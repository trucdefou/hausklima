services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    environment:
      - TZ=Europe/Berlin

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.6.2
    container_name: zigbee2mqtt
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8081:8080"
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - ${ZIGBEE_DONGLE:?Missing ZIGBEE_DONGLE in .env}:/dev/ttyACM0
    environment:
      - TZ=Europe/Berlin

  # Bluetooth LE to MQTT bridge for the Mi Flora plant sensors. Uses the Bluetooth adapter of the host
  # through BlueZ (D-Bus), so it needs host networking; it reaches mosquitto on the published port 1883.
  theengs:
    image: theengs/gateway:latest
    container_name: theengs
    restart: unless-stopped
    depends_on:
      - mosquitto
    network_mode: host
    volumes:
      - /var/run/dbus:/var/run/dbus
    environment:
      - TZ=Europe/Berlin
      - MQTT_HOST=127.0.0.1
      - MQTT_PORT=1883
      - MQTT_PUB_TOPIC=home/TheengsGateway/BTtoMQTT
      - MQTT_SUB_TOPIC=home/+/BTtoMQTT/undecoded
      - PUBLISH_ALL=false   # only devices Theengs can decode (not every phone or headset nearby)
      - DISCOVERY=false     # no Home Assistant discovery messages
      - LOG_LEVEL=WARNING

  panel:
    build: ./panel
    container_name: panel
    restart: unless-stopped
    depends_on:
      - mosquitto
    user: "1000:1000"
    ports:
      - "8082:8000"
    volumes:
      - ./data:/data
      - ./panel:/app:ro
    environment:
      - TZ=Europe/Berlin
      - PANEL_PASSWORD=${PANEL_PASSWORD:?Missing PANEL_PASSWORD in .env}
