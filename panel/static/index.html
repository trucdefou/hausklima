let meters = [], meterReadings = [];          // heating
let waterMeters = [], waterReadings = [];      // hot water
let allMeters = [], allReadings = [];
const colorMeter = {};
const METER_COLORS = COLORS;
const isWater = m => m?.kind === 'hot_water' || m?.kind === 'cold_water';
// Only hot water is rated with the Warmwasserspiegel; cold water is just counted
const isHotWater = m => m?.kind === 'hot_water';
const waterKindLabel = m => t(isHotWater(m) ? 'water.kind_hot' : 'water.kind_cold');
const unitOf = m => m?.unit || (isWater(m) ? 'm³' : t('meter.units'));
// Water consumption: if the unit is m³ it is shown in liters
const inLiters = m => isWater(m) && /^m(³|3)$/i.test(unitOf(m));
const fmtConsumption = (v, m, dec = 2) => inLiters(m) ? `${fmtValue(v * 1000, 0)} L` : `${fmtValue(v, dec)} ${unitOf(m)}`;
const fmtValue = (v, dec = 3) => (v == null || isNaN(v)) ? '–' : Number(v).toLocaleString(lang, { maximumFractionDigits: dec });
const meterById = id => allMeters.find(m => m.id === id);
const meterPoint = id => `<span class="point" style="background:${colorMeter[id] || '#999'}"></span>`;
const modalMeterReading = coreui.Modal.getOrCreateInstance($('#dlg-lectmed'));
let periods = [], closings = [];
const hasPeriods = () => periods.length > 0;

async function loadMeters() {
  let pe;
  let dailyWeather;
  [allMeters, allReadings, pe, dailyWeather] = await Promise.all([api('/api/meters'), api('/api/meter_readings'), api('/api/periods'),
    api('/api/daily_weather').catch(() => [])]);
  prepareDegreeDays(dailyWeather);
  periods = pe.periods;
  closings = pe.closings;
  meters = allMeters.filter(m => !isWater(m));
  waterMeters = allMeters.filter(isWater);
  const idsCal = new Set(meters.map(m => m.id));
  meterReadings = allReadings.filter(l => idsCal.has(l.meter));
  waterReadings = allReadings.filter(l => !idsCal.has(l.meter));
  // A meter without a room takes a color no linked room is using
  const roomColors = new Set(meters.map(m => m.sensor && colorDe[m.sensor]));
  const freeColors = METER_COLORS.filter(c => !roomColors.has(c));
  meters.forEach((m, i) => colorMeter[m.id] = (m.sensor && colorDe[m.sensor]) || freeColors.shift() || METER_COLORS[i % METER_COLORS.length]);
  waterMeters.forEach((m, i) => colorMeter[m.id] = COLORS[i % COLORS.length]);
}
// Reloads and redraws the meter section being viewed
function refreshMeters() {
  return currentTab() === 'water' ? showWater() : showReadings();
}
async function showReadings() {
  try { await loadMeters(); } catch (err) { return toast(err.message); }
  renderReadings();
}

          <button type="button" class="btn btn-sm btn-ghost-danger" data-delete-meter="${esc(m.id)}" title="${esc(t('delete'))}" aria-label="${esc(t('delete'))}"><i class="cil-trash"></i></button>

// ---------- Consumption ----------
// Cumulative value of a meter at any instant, interpolating linearly between readings
// (so the consumption between two readings is spread evenly over those days).
function cumulativeSeries(id) {
  const series = allReadings.filter(l => l.meter === id).map(l => ({ x: new Date(l.timestamp).getTime(), a: l.cumulative }));
  series.byCold = !isWater(meterById(id));
  return series;
}

// Accumulated degree days: a day adds what it lacks to reach the base temperature (a warm day adds 0).
// Between two readings, heating consumption is split in proportion to them. Hot water does not depend on the cold.
const HDD_BASE_TEMP = 15, WEATHER_TOLERANCE_DAYS = 7;
let degreeDays = null;
function prepareDegreeDays(rows) {
  degreeDays = null;
  if (!rows.length) return;
  const byDate = new Map(rows), values = rows.map(([, temp]) => Math.max(0, HDD_BASE_TEMP - temp));
  const media = values.reduce((a, b) => a + b, 0) / values.length;
  const start = new Date(rows[0][0] + 'T00:00:00'), end_at = new Date(rows[rows.length - 1][0] + 'T00:00:00');
  const cum = [0];
  for (const c = new Date(start); c <= end_at; c.setDate(c.getDate() + 1)) {
    const temp = byDate.get(dateInput(c));
    cum.push(cum[cum.length - 1] + (temp == null ? media : Math.max(0, HDD_BASE_TEMP - temp)));
  }
  degreeDays = { start: start.getTime(), end_at: end_at.getTime() + DAY, cum };
}
function degreesUntil(x) {
  const pos = Math.min(Math.max((x - degreeDays.start) / DAY, 0), degreeDays.cum.length - 1), i = Math.floor(pos);
  const sig = degreeDays.cum[Math.min(i + 1, degreeDays.cum.length - 1)];
  return degreeDays.cum[i] + (sig - degreeDays.cum[i]) * (pos - i);
}
function splitByCold(series, since, until) {
  return !!(series.byCold && degreeDays && since >= degreeDays.start && until <= degreeDays.end_at + WEATHER_TOLERANCE_DAYS * DAY);
}
function cumEn(series, x) {
  if (!series.length || x <= series[0].x) return 0;
  const last = series[series.length - 1];
  if (x >= last.x) return last.a;
  let i = 0;
  while (series[i + 1].x <= x) i++;
  const p = series[i], q = series[i + 1];
  if (splitByCold(series, p.x, q.x)) {
    const gp = degreesUntil(p.x), gq = degreesUntil(q.x);
    if (gq > gp) return p.a + (q.a - p.a) * (degreesUntil(x) - gp) / (gq - gp);
  }
  return p.a + (q.a - p.a) * (x - p.x) / (q.x - p.x);
}

// Comparison period: the same dates one year earlier. Heating depends on the season, and a period in progress
// is compared only against the same stretch of the previous one.
const oneYearBefore = x => { const f = new Date(x); f.setFullYear(f.getFullYear() - 1); return f.getTime(); };
// With readings far apart, the value on an intermediate date was not measured: it is an estimate
const NEARBY_READING_DAYS = 45;
function estimatedDate(s, x) {
  const i = s.findIndex(p => p.x >= x);
  return i > 0 && s[i].x !== x && s[i].x - s[i - 1].x > NEARBY_READING_DAYS * DAY;
}
// Consumption of a meter in the previous period. 'partial': missing data (it started later, or is from before the move-in).
// 'byCold': no readings near the cutoff and the segment was estimated from each day's cold.
// 'estimated': no weather data either, so the same stretch cannot be known and 'full' is given as a reference.
function prevConsumption(s, d, h, hPeriod) {
  if (s.length < 2) return null;
  const end_at = Math.min(h, s[s.length - 1].x);
  if (end_at <= d) return null;
  const start = oneYearBefore(d), endPrev = oneYearBefore(end_at);
  if (endPrev <= s[0].x) return null;
  const move_in = state.move_in_date ? new Date(state.move_in_date + 'T00:00:00').getTime() : 0;
  const far = estimatedDate(s, start) || estimatedDate(s, endPrev), byCold = far && splitByCold(s, start, endPrev);
  // "Total": the full billing period, even if the filter covers only part of it
  const period = periods.map(periodLimits).find(([a, b]) => a <= start && start <= b);
  const [startTotal, endTotal] = period || [start, oneYearBefore(hPeriod)];
  return { value: cumEn(s, endPrev) - cumEn(s, start), until: endPrev, partial: s[0].x > start || move_in > start,
           byCold, estimated: far && !byCold,
           full: cumEn(s, endTotal) - cumEn(s, startTotal) };
}
const helpIcon = text => `<i class="cil-info ms-1 text-body-secondary" role="img" tabindex="0" title="${esc(text)}" aria-label="${esc(text)}"></i>`;
const consumptionRow = (label, value) => `<div class="d-flex flex-wrap justify-content-between column-gap-2"><span class="text-nowrap">${esc(label)}</span><span class="tabular ms-auto text-end">${value}</span></div>`;
const helpProjection = f => f ? t('period.proj_cold', { c: fmtValue(f.consumed, 0), r: fmtValue(f.pace, 3), g: fmtValue(f.restDegrees, 0), p: fmtValue(f.total, 0) }) : t('period.proj_calculation');
const htmlProjection = (value, help) => `<div class="small text-body-secondary mt-1">${consumptionRow(t('consumption.projection'), `≈ ${fmtValue(value, 0)}${helpIcon(help)}`)}</div>`;
function htmlComparison(current, prev) {
  const row = consumptionRow;
  const block = rows => `<div class="small text-body-secondary mt-2 pt-2 border-top"><div class="fw-semibold">${esc(t('consumption.prev_period'))}</div>${rows}</div>`;
  if (!prev) return block(row(t('consumption.total_all'), '–'));
  const total = suffix => row(t('consumption.total_all'), `${prev.partial ? '≈ ' : ''}${fmtValue(prev.full, 0)}${suffix}`);
  if (prev.estimated) return block(total(helpIcon(t('consumption.estimated_help'))));
  const diff = prev.value > 0 && !prev.partial ? (current - prev.value) / prev.value * 100 : null;
  const cls = diff == null || Math.abs(diff) < 1 ? 'text-body-secondary' : diff > 0 ? 'text-danger' : 'text-success';
  const approx = prev.partial || prev.byCold ? '≈ ' : '';
  const pct = diff == null ? '' : ` <span class="fw-semibold text-nowrap ${cls}">${diff > 0 ? '+' : diff < 0 ? '−' : ''}${num(Math.abs(diff), 0)} %</span>`;
  const help = prev.partial ? 'consumption.partial' : prev.byCold ? 'consumption.cold_help' : '';
  const extra = pct + (help ? helpIcon(t(help)) : '');
  // In a closed period "to date" and "total" are the same value: a single row
  if (Math.abs(prev.full - prev.value) < 0.5) return block(total(extra));
  return block(row(t('consumption.to_date'), `<span class="text-nowrap">${approx}${fmtValue(prev.value, 0)}</span>${extra}`) + total(''));
}

const periodLimits = p => [new Date(p.start_at + 'T00:00:00').getTime(), new Date(p.end_at + 'T23:59:59').getTime()];
// Period in which the move-in happened: only counts from that day
const badgePeriodMoveIn = p => state.move_in_date && p.start_at < state.move_in_date && state.move_in_date <= p.end_at
  ? ` <span class="badge text-bg-light border" title="${esc(t('movein.before_help'))}">${t('movein.since')}</span>` : '';

function renderConsumption() {
  const sel = renderEnergyFilters(meters);

  const [d, h] = inputRange('#en-since', '#en-until', 365);
  const items = meters.filter(m => !sel || m.id === sel);
  const hPeriod = $('#en-until').value ? new Date($('#en-until').value + 'T23:59:59').getTime() : h;
  // The projection to closing only makes sense if the filter starts at the beginning of the period in progress
  const periodInProgress = periods.map(periodLimits).find(([a, b]) => a === d && b >= Date.now());
  const data = items.map(m => {
    const x = meterConsumption(m, d, h), s = x.s;
    return { ...x, prev: prevConsumption(s, d, h, hPeriod),
             projection: periodInProgress ? calculateProjection(s, periodInProgress[0], periodInProgress[1], cumEn(s, periodInProgress[1]) - cumEn(s, periodInProgress[0]), Date.now()) : null };
  });

  // Summary
  const widget = (title, value, unit, sub1, sub2, color, comparison, projection = '') => `<div class="col-6 col-lg-3"><div class="card h-100" style="border-top:3px solid ${color}">

  let html = '';

  if (data.length > 1 && units.size === 1) {

    const withPrev = data.filter(x => x.prev);
    const prevTotal = withPrev.length ? { value: withPrev.reduce((s, x) => s + x.prev.value, 0),
      full: withPrev.reduce((s, x) => s + x.prev.full, 0), estimated: withPrev.some(x => x.prev.estimated),
      byCold: withPrev.some(x => x.prev.byCold),
      partial: withPrev.length < data.length || withPrev.some(x => x.prev.partial) } : null;
    html += widget(t('consumption.total_all'), fmtValue(total, 2), [...units][0], '', '', 'var(--cui-primary)',
      htmlComparison(total, prevTotal),

    x.perDay == null ? '' : t('consumption.per_day', { v: fmtValue(x.perDay, 2) }),
    '', colorMeter[x.m.id], htmlComparison(x.consumption, x.prev),
    x.projection?.proj != null ? htmlProjection(x.projection.proj, helpProjection(x.projection.cold)) : '')).join('');
  $('#cs-summary').innerHTML = meters.length ? html : `<div class="col-12"><div class="card"><div class="card-body text-body-secondary">${t('consumption.no_meters')}</div></div></div>`;

  const theme = chartTheme();

  // Chart: cumulative consumption within the period (starts at 0 at the beginning of the period)

    const base = cumEn(x.s, d);
    const start = Math.max(d, x.s[0].x), end_at = Math.min(h, x.s[x.s.length - 1].x);
    if (end_at <= start) return null;
    const pts = [{ x: start, y: cumEn(x.s, start) - base },
      ...x.s.filter(p => p.x > start && p.x < end_at).map(p => ({ x: p.x, y: p.a - base })),
      { x: end_at, y: cumEn(x.s, end_at) - base }];
    return { label: `${x.m.name} (${unitOf(x.m)})`, data: pts, borderColor: colorMeter[x.m.id], backgroundColor: colorMeter[x.m.id],
             borderWidth: 2, pointRadius: 3, tension: 0 };
  }).filter(Boolean);
  renderChart('chart-cum', 'line', { datasets: lines }, {
    parsing: false,
    interaction: { mode: 'nearest', intersect: false },
    scales: { x: timeAxis(theme, d, h), y: valueAxis(theme, 2) },
    plugins: {
      legend: { labels: lineLegend(theme) },
      tooltip: { callbacks: { title: tooltipTimeTitle, label: it => `${it.dataset.label}: ${fmtValue(it.parsed.y, 2)}` } },
      zoom: { limits: { x: { min: d, max: h } }, pan: { enabled: true, mode: 'x' }, zoom: zoomGestures('x') },
    },
  });

  // Chart: consumption per day (short periods) or per month, split between readings

  $('#cs-bars-title').textContent = t(daily ? 'consumption.bars_day' : 'consumption.bars_month');
  const legendPrev = t('consumption.prev_period') + (data.some(x => x.prev?.estimated || x.prev?.byCold) ? ` (${t('consumption.estimated')})` : '');
  renderChart('chart-bars', 'bar', { labels, datasets: [
    ...data.map(x => ({
      label: `${x.m.name} (${unitOf(x.m)})`, backgroundColor: colorMeter[x.m.id], stack: 'consumption',
      data: buckets.map(([a, b]) => consumptionBetween(x.s, a, b)) })),
    // Same column one year earlier, lighter. Cut at the meter's last reading to compare the same stretch.
    ...data.filter(x => x.prev).map(x => {
      const last = x.s[x.s.length - 1].x;
      return { label: `${x.m.name} (${unitOf(x.m)}) · ${legendPrev}`, backgroundColor: `${colorMeter[x.m.id]}59`, stack: 'prev', prev: true,
        data: buckets.map(([a, b]) => a >= last ? 0 : consumptionBetween(x.s, oneYearBefore(a), oneYearBefore(Math.min(b, last)))) };

          const visible = chart.isDatasetVisible(item.datasetIndex);

    },

  renderComparison(items, theme);

  // Table of periods between readings touching the range
  const ids = new Set(items.map(m => m.id));
  const segments = meterReadings.filter(l => ids.has(l.meter) && l.consumption != null && l.kind !== 'period_start' && !l.before_move_in &&

    <th class="text-end">${t('meter.consumption')}</th><th class="text-end">${t('consumption.avg_day')}</th><th class="text-end">${t('meter.cumulative')}</th></tr></thead><tbody>` +
    (segments.length ? segments.map(l => { const m = meterById(l.meter); return `<tr>
      <td><span class="d-inline-flex align-items-center gap-2">${meterPoint(l.meter)}${esc(m?.name)}${l.virtual ? ` <em class="small text-body-secondary">(${esc(virtualLabel(l))})</em>` : ''}</span></td>
      <td>${fmtDateTime(l.since)}</td><td>${fmtDateTime(l.timestamp)}</td>
      <td class="text-end">${num(l.days, 1)}</td>
      <td class="text-end">${fmtValue(l.consumption, 2)} <span class="small text-body-secondary">${esc(unitOf(m))}</span>${badgeReset(l)}</td>

// Consumption of each meter in each billing period
// Daily rate (unit/day) measured at instant t: only if surrounding readings are ≤ 62 days apart (otherwise the seasonality is not visible)
function rateEn(series, t) {
  for (let i = 0; i + 1 < series.length; i++) {
    const p = series[i], q = series[i + 1];
    if (t >= p.x && t < q.x) return q.x - p.x <= 62 * DAY ? (q.a - p.a) / ((q.x - p.x) / DAY) : null;
  }
  return null;
}
// Average of what was measured on that date (month/day) across all years with data before `limit`
function rateDate(series, date, limit) {
  const v = [];
  for (let y = new Date(series[0].x).getFullYear(); y <= new Date(limit).getFullYear(); y++) {
    const t = new Date(y, date.getMonth(), date.getDate(), 12).getTime();
    if (t >= series[0].x && t <= limit) { const r = rateEn(series, t); if (r != null) v.push(r); }
  }
  return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null;
}
// Expected consumption between `since` and `until` according to the seasonality measured with data before `limit`; null if there is hardly any comparable data
function ratesExpected(series, since, until, limit) {
  if (series.length < 2) return null;
  let total = 0, withDatum = 0, days = 0;
  const noData = [];
  for (let t = since; t < until; t += DAY) {
    const day = new Date(Math.min(t + DAY / 2, until)), fraction = Math.min(DAY, until - t) / DAY;
    days += fraction;
    let r = rateDate(series, day, limit);
    if (r == null) {   // date symmetric around January 15
      const doy = Math.round((new Date(day.getFullYear(), day.getMonth(), day.getDate()) - new Date(day.getFullYear(), 0, 1)) / DAY) + 1;
      let esp = 30 - doy; if (esp < 1) esp += 365;
      r = rateDate(series, new Date(day.getFullYear(), 0, esp), limit);
    }
    if (r == null) { noData.push(fraction); continue; }
    total += r * fraction; withDatum += fraction;
  }
  if (withDatum < days * 0.6) return null;
  return total + (noData.length ? total / withDatum * noData.reduce((x, y) => x + y, 0) : 0);
}

// Heating projection to closing: consumed + (consumption per degree day of this period) × (degree days of the same
// remaining dates, one year earlier). null if too little cold has accumulated to compute the pace or the weather for those dates is missing.
const MIN_PROJECTION_DEGREE_DAYS = 100;
function projectionByCold(s, since, until, target, consumed) {
  if (!splitByCold(s, since, until)) return null;
  const periodDegrees = degreesUntil(until) - degreesUntil(since);
  const startRest = oneYearBefore(until), endRest = oneYearBefore(target);
  if (periodDegrees < MIN_PROJECTION_DEGREE_DAYS || startRest < degreeDays.start || endRest > degreeDays.end_at) return null;
  const pace = consumed / periodDegrees, restDegrees = degreesUntil(endRest) - degreesUntil(startRest);
  return { total: consumed + pace * restDegrees, consumed, pace, restDegrees };
}

function calculateProjection(s, start, end_at, value, now) {
  // Year-end projection (Dec 31; if the period ends earlier, to its closing) with seasonality:
  // adds up, day by day, the expected consumption according to what was measured on that same date in other years or, if there is no data,
  // on the climatically equivalent date (symmetric around January 15, the coldest moment).
  // Without enough data the daily average is used (no seasonality).
  let proj = null, seasonal = false, cold = null;
  const target = Math.min(end_at, new Date(new Date(now).getFullYear(), 11, 31, 23, 59, 59).getTime());
  if (end_at >= now && value > 0) {
    const since = Math.max(start, s[0].x), until = Math.min(s[s.length - 1].x, now);
    cold = until > since ? projectionByCold(s, since, until, target, value) : null;
    if (cold) { proj = cold.total; seasonal = true; }
    else if (until > since) {
      // Recent pace (last ~7 days, between real readings) versus the usual for those dates: scales what remains
      let vi = s.findIndex(q => q.x >= until - 7 * DAY);
      if (vi > 0 && until - s[vi].x < 2 * DAY) vi--;
      const win = vi >= 0 && s[vi].x < until ? s[vi].x : until - 7 * DAY;
      const future = ratesExpected(s, until, target, win);
      if (future != null) {
        const usual = ratesExpected(s, win, until, win);
        const real = cumEn(s, until) - cumEn(s, win);
        const k = usual != null && usual >= 1 ? Math.min(4, Math.max(0, real / usual)) : 1;
        proj = value + future * k; seasonal = true;
      }
      else proj = value + value / ((until - since) / DAY) * Math.max(0, target - until) / DAY;
    }
  }
  return { proj, seasonal, cold };
}

function totalComparisonRow(items, cells, comparisonPeriods) {
  if (items.length < 2 || new Set(items.map(unitOf)).size > 1) return '';
  const unit = esc(unitOf(items[0]));
  return `<tr class="fw-semibold"><td>${t('consumption.total_all')}</td>` + comparisonPeriods.map((p, j) => {
    const row = cells.map(c => c[j]).filter(Boolean);
    if (!row.length) return '<td class="text-end text-body-secondary">–</td>';
    const sum = row.reduce((s, c) => s + c.value, 0);
    const proj = row.some(c => c.inProgress) && row.every(c => c.proj != null) ? row.reduce((s, c) => s + c.proj, 0) : null;
    return `<td class="text-end">${fmtValue(sum, 0)} <span class="small text-body-secondary fw-normal">${unit}</span>
      ${proj != null ? `<div class="small text-body-secondary fst-italic fw-normal">${t('period.projection')}: ${fmtValue(proj, 0)}${helpIcon(t('consumption.proj_total_help'))}</div>` : ''}</td>`;
  }).join('') + '</tr>';
}

function renderComparison(items, theme) {
  const periodsWithData = periods.filter(p => p.start_at <= dateInput(new Date()));
  $('#cs-comp-card').hidden = !periodsWithData.length || !items.length;
  if ($('#cs-comp-card').hidden) { charts['chart-comp']?.destroy(); return; }
  const now = Date.now();
  const cells = items.map(m => {
    const s = cumulativeSeries(m.id);
    return periodsWithData.map(p => {
      const [start, end_at] = periodLimits(p);
      if (!s.length || s[s.length - 1].x < start || s[0].x > end_at) return null;   // no data in that period
      const value = cumEn(s, end_at) - cumEn(s, start);
      const incomplete = end_at < now && s[s.length - 1].x < end_at;
      const { proj, seasonal, cold } = calculateProjection(s, start, end_at, value, now);
      return { value, proj, seasonal, cold, incomplete, inProgress: end_at >= now, partialMoveIn: !!badgePeriodMoveIn(p) };
    });
  });
  const periodState = p => { const [start, end_at] = periodLimits(p); return badgePeriodMoveIn(p) + (end_at < now ? '' : ` <span class="badge text-bg-info">${t('period.state_progress')}</span>`); };
  $('#cs-comp').innerHTML = `<thead><tr><th>${t('meter.meter')}</th>${periodsWithData.map(p => `<th class="text-end">${esc(p.name)}${periodState(p)}</th>`).join('')}</tr></thead><tbody>` +
    items.map((m, i) => `<tr><td><span class="d-inline-flex align-items-center gap-2">${meterPoint(m.id)}${esc(m.name)}</span></td>` +
      cells[i].map((c, j) => {
        if (!c) return '<td class="text-end text-body-secondary">–</td>';
        const prev = j > 0 ? cells[i][j - 1] : null;
        // not compared against an incomplete period nor the move-in one (not a full year)
        const delta = prev && prev.value > 0 && !prev.incomplete && !prev.partialMoveIn && !c.inProgress && !c.incomplete && !c.partialMoveIn
          ? (c.value - prev.value) / prev.value * 100 : null;
        return `<td class="text-end"><span class="${c.incomplete ? 'fst-italic text-body-secondary' : 'fw-semibold'}" ${c.incomplete ? `title="${esc(t('period.incomplete'))}"` : ''}>${fmtValue(c.value, 0)}</span>
          <span class="small text-body-secondary">${esc(unitOf(m))}</span>
          ${c.incomplete ? `<div class="small"><span class="badge text-bg-warning">${t('period.incomplete')}</span></div>` : ''}
          ${c.proj != null ? `<div class="small text-body-secondary fst-italic">${t('period.projection')}: ${fmtValue(c.proj, 0)}${c.cold ? helpIcon(t('period.proj_cold', { c: fmtValue(c.cold.consumed, 0), r: fmtValue(c.cold.pace, 3), g: fmtValue(c.cold.restDegrees, 0), p: fmtValue(c.cold.total, 0) })) : ''}${c.seasonal ? '' : ` <span title="${esc(t('period.proj_linear_help'))}">(${t('period.proj_linear')})</span>`}</div>` : ''}
          ${delta != null ? `<div class="small ${delta > 0 ? 'text-danger' : 'text-success'}">${delta > 0 ? '+' : ''}${num(delta, 0)} % ${t('period.change')}</div>` : ''}</td>`;
      }).join('') + '</tr>').join('') + totalComparisonRow(items, cells, periodsWithData) + '</tbody>';

  // Grouped bars: one group per meter, one bar per period
  const tones = periodsWithData.map((p, j) => 0.35 + 0.65 * (j + 1) / periodsWithData.length);
  renderChart('chart-comp', 'bar', {
    labels: items.map(m => m.name),
    datasets: periodsWithData.flatMap((p, j) => [{
      label: p.name, data: cells.map(row => row[j] ? row[j].value : null), stack: p.id,
      backgroundColor: `rgba(99, 102, 241, ${tones[j]})`, borderColor: '#6366f1', borderWidth: 1,
    }, {
      // Projection of the period in progress: translucent bar with dotted border above what was consumed
      label: `${p.name} (${t('period.projection')})`, projection: true, stack: p.id,
      data: cells.map(row => row[j] && row[j].proj != null ? row[j].proj - row[j].value : null),
      backgroundColor: 'rgba(99, 102, 241, 0.15)', borderColor: '#6366f1', borderWidth: 1.5, borderDash: [5, 4],
    }]),
  }, {
    scales: { x: categoryAxis(theme), y: valueAxis(theme, 0, { stacked: true }) },
    plugins: {
      legend: { labels: barLegend(theme, { filter: (it, data) => !data.datasets[it.datasetIndex]?.projection }) },
      tooltip: { callbacks: { label: it => {
        const u = unitOf(items[it.dataIndex]);
        if (!it.dataset.projection) return `${it.dataset.label}: ${fmtValue(it.parsed.y, 0)} ${u}`;
        const c = cells[it.dataIndex][Math.floor(it.datasetIndex / 2)];
        return `${it.dataset.label}: ${fmtValue(c.proj, 0)} ${u}`;
      } } },
    },
  });
}

let waterHome = null, waterBenchmarks = {};
// Household and Warmwasserspiegel tables, to rate the consumption
async function loadWaterReference() {
  const [d, cfg] = await Promise.all([api('/api/home'), api('/api/config')]);
  waterHome = d.home;
  waterBenchmarks = cfg.water_benchmarks;
}
// Data tab: counters, new readings and history
async function showWater() {
  try { await loadMeters(); } catch (err) { return toast(err.message); }
  renderWater();
}

const widgetWater = (title, value, sub, color) => `<div class="col-6 col-lg-3"><div class="card h-100" style="border-top:3px solid ${color}">
  <div class="card-body py-3"><div class="small text-body-secondary text-truncate">${title}</div>
  <div class="fs-4 fw-semibold tabular">${value}</div><div class="small text-body-secondary">${sub}</div></div></div></div>`;

const BENCHMARK_COLORS = ['#4faa4c', '#9ccb7e', '#f59500', '#e04545'];
const MIN_ESTIMATE_DAYS = 30;

// Average with the readings since the move-in, optionally within a range. Less than a day of data is not enough to extrapolate.
function waterAverage(m, since = -Infinity, until = Infinity) {
  const s = cumulativeSeries(m.id);
  if (s.length < 2) return null;
  const move_in = state.move_in_date ? new Date(state.move_in_date + 'T00:00:00').getTime() : 0;
  const start = Math.max(s[0].x, move_in, since), end_at = Math.min(s[s.length - 1].x, until), days = (end_at - start) / DAY;
  return days >= 1 ? { days, perDay: (cumEn(s, end_at) - cumEn(s, start)) / days } : null;
}

// Table matching a year: the most recent one not later than it; if none, the oldest
function benchmarkOfYear(year) {
  const years = Object.keys(waterBenchmarks).map(Number).sort((a, b) => a - b);
  const selected = years.filter(a => a <= year).pop() ?? years[0];
  return selected == null ? null : { year: selected, table: waterBenchmarks[selected] };
}

// Limits for this household in a year, or null if the number of people is missing or exceeds the 5 in the table
function waterBenchmarkLimits(year = new Date().getFullYear()) {
  const people = waterHome?.people, e = benchmarkOfYear(year);
  return people && e ? e.table[waterHome.is_apartment ? 'apartment' : 'house']?.[people - 1] || null : null;
}

const categoryBenchmark = (m3, limits) => { const i = limits.findIndex(l => m3 <= l); return i < 0 ? 3 : i; };

// Row with the category of each period: its average scaled to a year, against the table of the year containing most of the period.
// It always rates the whole household (`data` = every hot water counter); `filtered` says the rows above are not exactly those counters.
function htmlCategoriesPeriods(data, people, filtered = false) {
  if (!data.length || !data.every(x => inLiters(x.m))) return '';
  const cells = people.map(p => {
    const [start, end_at] = periodLimits(p), year = new Date((start + end_at) / 2).getFullYear(), limits = waterBenchmarkLimits(year);
    const avgs = data.map(x => waterAverage(x.m, start, end_at));
    if (!limits || avgs.some(x => !x)) return '<td class="text-end text-body-secondary">–</td>';
    const m3 = avgs.reduce((s, x) => s + x.perDay, 0) * 365, cat = categoryBenchmark(m3, limits);
    const approx = Math.min(...avgs.map(x => x.days)) < MIN_ESTIMATE_DAYS ? '≈ ' : '';
    return `<td class="text-end"><span class="badge" style="background:${BENCHMARK_COLORS[cat]};color:#10242c">${'ABCD'[cat]}</span> ${approx}${fmtValue(m3, 1)} m³<div class="small text-body-secondary">${t('water.table_year', { v: benchmarkOfYear(year).year })}</div></td>`;
  });
  return cells.some(c => c.includes('badge')) ? `<tr><td>${t(filtered ? 'water.category_household' : 'water.category_period')}</td>${cells.join('')}</tr>` : '';
}

function htmlComparisonWater(m3) {
  const apt = !!waterHome?.is_apartment, people = waterHome?.people, limits = waterBenchmarkLimits();
  if (!limits) return widgetWater(t('water.comparison'), '–', t(people ? 'water.no_reference' : 'water.missing_people'), 'var(--cui-secondary)');
  const cat = categoryBenchmark(m3, limits);
  const scale = `A ≤ ${fmtValue(limits[0], 1)} · B ≤ ${fmtValue(limits[1], 1)} · C ≤ ${fmtValue(limits[2], 1)} · D > ${fmtValue(limits[2], 1)} m³`;
  return widgetWater(t('water.comparison'), `${'ABCD'[cat]} · ${t('water.cat_' + cat)}`,
    `${t('water.ref', { kind: t(apt ? 'water.apt' : 'water.house'), n: people })}<br>${scale}`, BENCHMARK_COLORS[cat]);
}

// Reference table of the own home kind, next to the counter cards (on the phone, below)
function htmlTableBenchmarkWater() {
  const apt = !!waterHome?.is_apartment, benchmark = benchmarkOfYear(new Date().getFullYear()), rows = benchmark?.table[apt ? 'apartment' : 'house'];
  if (!rows) return '';
  const cab = [...'ABCD'].map((c, i) => `<th class="text-end" style="background:${BENCHMARK_COLORS[i]} !important;color:#10242c !important">${c}</th>`).join('');
  return `<div class="col"><div class="card h-100">
    <div class="card-header"><strong>Warmwasserspiegel ${benchmark.year}</strong> <span class="small text-body-secondary">· ${t(apt ? 'water.apt' : 'water.house')} · ${t('water.m3_year')}</span></div>
    <div class="table-responsive"><table class="table table-sm align-middle mb-0 tabular"><thead><tr><th>${t('water.people_col')}</th>${cab}</tr></thead><tbody>` +
    rows.map((f, i) => `<tr class="${waterHome?.people === i + 1 ? 'table-active fw-semibold' : ''}"><th scope="row" class="fw-normal">${i + 1}</th>` +
      f.map(v => `<td class="text-end text-nowrap">≤ ${fmtValue(v, 1)}</td>`).join('') + `<td class="text-end text-nowrap">&gt; ${fmtValue(f[2], 1)}</td></tr>`).join('') +
    '</tbody></table></div></div></div>';
}

function renderWaterEstimate() {
  const rows = waterMeters.filter(isHotWater).map(m => ({ m, avg: waterAverage(m) }));
  // The household total only applies if all counters have data and are in m³
  const summable = rows.length > 0 && rows.every(x => x.avg && inLiters(x.m));
  let html = '';
  if (summable) {
    const perDay = rows.reduce((s, x) => s + x.avg.perDay, 0), m3 = perDay * 365;
    const days = Math.min(...rows.map(x => x.avg.days));
    // Reference: the category B ("mittel") limit of the table
    const limitB = waterBenchmarkLimits()?.[1];
    const refDay = limitB ? `<br>${t('water.ref_day', { v: fmtValue(limitB * 1000 / 365, 0) })}` : '';
    const refYear = limitB ? `<br>${t('water.ref_year', { v: fmtValue(limitB, 1) })}` : '';
    html += widgetWater(t('water.average_day'), fmtConsumption(perDay, rows[0].m),
      t(days < MIN_ESTIMATE_DAYS ? 'water.base_short' : 'water.base', { n: Math.round(days) }) + refDay, 'var(--cui-primary)');
    html += widgetWater(t('water.estimate_annual'), `${fmtValue(m3, 1)} m³`, t('water.annual_calculation') + refYear, 'var(--cui-primary)');
    html += htmlComparisonWater(m3);
  }
  if (rows.length > 1 || !summable) {
    html += rows.map(({ m, avg }) => avg
      ? widgetWater(esc(m.name), t('water.per_year', { v: `${fmtValue(avg.perDay * 365, 1)} ${esc(unitOf(m))}` }), t('water.per_day', { v: fmtConsumption(avg.perDay, m) }), colorMeter[m.id])
      : widgetWater(esc(m.name), '–', t('water.missing_readings'), colorMeter[m.id])).join('');
  }
  if (rows.length) html += `<div class="col-12"><p class="small text-body-secondary mb-0">${t('water.note_estimate')}</p></div>`;
  $('#ag-estimate').innerHTML = html;
}

// Heating units projected to the closing of the period in progress: same calculation as in Consumption. null if any meter is missing.
function projectedUnits() {
  const now = Date.now(), period = periods.map(p => ({ id: p.id, lim: periodLimits(p) })).find(p => p.lim[0] <= now && now <= p.lim[1]);
  if (!period || !meters.length) return null;
  const [start, end_at] = period.lim;
  const proj = meters.map(m => { const s = cumulativeSeries(m.id); return calculateProjection(s, start, end_at, cumEn(s, end_at) - cumEn(s, start), now).proj; });
  return proj.every(x => x != null) ? { period: period.id, units: proj.reduce((a, b) => a + b, 0) } : null;
}

let energyData = null, heizspiegels = {};
const HEIZ_SOURCES = ['Erdgas', 'Heizöl', 'Fernwärme', 'Wärmepumpe', 'Holzpellets'];
const HEIZ_COLORS = ['#4faa4c', '#fbe14b', '#f59500', '#e04545'];

// Table matching a billing year: the most recent one not later than it; if none, the oldest
function heizspiegelOfYear(year) {
  const years = Object.keys(heizspiegels).map(Number).sort((a, b) => a - b);
  const selected = years.filter(a => a <= year).pop() ?? years[0];
  return selected == null ? null : { ...heizspiegels[selected], year: selected };
}
const heizBand = (table, m2) => !m2 || m2 < table.min_m2 ? null : table.bands.find(f => f.until == null || m2 <= f.until) || null;
function bandLabel(table, band) {
  const i = table.bands.indexOf(band), since = i ? table.bands[i - 1].until : table.min_m2;
  return band.until == null ? `> ${fmtValue(since, 0)}` : `${fmtValue(since, 0)}–${fmtValue(band.until, 0)}`;
}

// An apartment is compared by the whole building: that is what the Heizspiegel indicates.
// The period in progress uses the projection to closing; in an apartment it is scaled to the building with the home/building ratio of the last full year.
function heizspiegelValue(p, d, periodsE) {
  if (!p.in_progress) return d.is_apartment ? p.building?.kwh_m2 : (p.partial_move_in ? null : p.kwh_m2);
  if (p.kwhEnd == null || !d.m2_home) return null;
  const own = p.kwhEnd / d.m2_home;
  if (!d.is_apartment) return own;
  const ref = periodsE.filter(x => !x.in_progress && !x.partial_move_in && x.kwh_m2 && x.building?.kwh_m2).pop();
  return ref ? own * ref.building.kwh_m2 / ref.kwh_m2 : null;
}

// Home view: its own values, without a category, because the Heizspiegel tables are for whole buildings
function renderHeizHome(periodsE, d) {
  const m2 = d.m2_home;
  $('#mt-heiz-sub').textContent = m2 ? `· ${fmtValue(m2, 1)} m²` : '';
  if (!m2) return $('#mt-heiz').innerHTML = `<div class="card-body text-body-secondary">${t('heiz.missing_m2')} <a href="#settings/home">${t('energy.go_settings')}</a></div>`;
  const rows = periodsE.slice().reverse().map(p => {
    const kwh = p.in_progress ? (p.kwhEnd == null ? null : p.kwhEnd / m2) : p.kwh_m2;
    const euros = p.in_progress ? (p.costEnd == null ? null : p.costEnd / m2) : (p.paid == null ? null : p.paid / m2);
    if (kwh == null && euros == null) return '';
    const diff = p.building?.difference, approx = p.in_progress || p.estimated ? '≈ ' : '';
    const state = p.in_progress ? ` <span class="badge text-bg-info">${t('heiz.projection')}</span>` : p.partial_move_in ? ` <span class="badge text-bg-warning">${t('period.incomplete')}</span>` : '';
    return `<tr><td>${esc(p.name)}${state}</td><td class="text-end fw-semibold">${kwh == null ? '–' : approx + fmtValue(kwh, 1)}</td>
      <td class="text-end">${euros == null ? '–' : (p.in_progress ? '≈ ' : '') + fmtValue(euros, 2)}</td>
      <td class="text-end">${diff == null ? '–' : `<span class="fw-semibold ${diff > 0 ? 'text-danger' : 'text-success'}">${fmtPct(diff)}</span>`}</td></tr>`;
  }).join('');
  $('#mt-heiz').innerHTML = `<div class="table-responsive"><table class="table table-hover align-middle mb-0 tabular"><thead><tr><th>${t('period.period')}</th><th class="text-end">kWh/m²</th><th class="text-end">€/m²</th><th class="text-end">${t('heiz.vs_building')}</th></tr></thead><tbody>${rows || `<tr><td colspan="4" class="text-center text-body-secondary py-3">–</td></tr>`}</tbody></table></div>
    <div class="card-body border-top small text-body-secondary">${t('heiz.note_home')}</div>`;
}

let heizView = 'home', heizData = null;
function renderHeizspiegel(periodsE, d) {
  heizData = [periodsE, d];
  $('#mt-heiz-view').hidden = !d.is_apartment;
  document.querySelectorAll('#mt-heiz-view button').forEach(b => b.classList.toggle('active', b.dataset.view === heizView));
  if (d.is_apartment && heizView === 'home') return renderHeizHome(periodsE, d);
  const m2 = d.is_apartment ? d.m2_building : d.m2_home;
  const source = d.energy ? t('heiz.source.' + d.energy) : '';
  $('#mt-heiz-sub').textContent = m2 && d.energy ? `· ${t(d.is_apartment ? 'heiz.sub_building' : 'heiz.sub_home', { m: fmtValue(m2, 1), f: source })}` : '';
  const toast = key => `<div class="card-body text-body-secondary">${t(key)} <a href="#settings/home">${t('energy.go_settings')}</a></div>`;
  if (!d.energy) return $('#mt-heiz').innerHTML = toast('heiz.missing_energy');
  if (!m2) return $('#mt-heiz').innerHTML = toast('heiz.missing_m2');
  const rows = periodsE.filter(p => !p.in_progress || heizspiegelValue(p, d, periodsE) != null).reverse().map(p => {
    const year = new Date((new Date(p.start_at).getTime() + new Date(p.end_at).getTime()) / 2).getFullYear();
    const value = heizspiegelValue(p, d, periodsE);
    const table = heizspiegelOfYear(year), band = table && heizBand(table, m2), lim = band?.rows[d.energy]?.kwh;
    const cat = value != null && lim ? categoryBenchmark(value, lim) : null;
    return `<tr><td>${esc(p.name)}${p.in_progress ? ` <span class="badge text-bg-info">${t('heiz.projection')}</span>` : ''}</td><td>${table ? t('heiz.table_val', { e: table.edition, a: table.year }) : '–'}</td>
      <td class="text-end fw-semibold">${value == null ? '–' : (p.in_progress || (!d.is_apartment && p.estimated) ? '≈ ' : '') + fmtValue(value, 1)}</td>
      <td>${cat == null ? '–' : `<span class="badge" style="background:${HEIZ_COLORS[cat]};color:#10242c">${t('water.cat_' + cat)}</span>`}</td>
      <td class="text-end">${lim ? t('heiz.ref_val', { v: fmtValue(lim[1], 0) }) : '–'}</td></tr>`;
  }).join('');
  const last = heizspiegelOfYear(Infinity), band = last && heizBand(last, m2);
  const cells = (v, dec) => v.map(x => `<td class="text-end text-nowrap">≤ ${fmtValue(x, dec)}</td>`).join('') + `<td class="text-end text-nowrap">&gt; ${fmtValue(v[2], dec)}</td>`;
  const cab = HEIZ_COLORS.map((c, i) => `<th class="text-end" style="background:${c} !important;color:#10242c !important">${t('water.cat_' + i)}</th>`).join('');
  const reference = band ? `<div class="card-body border-top pb-2"><strong class="small">${t('heiz.ref_title', { e: last.edition, a: last.year, f: bandLabel(last, band) })}</strong>${helpIcon(t('heiz.table_help'))}</div>
    <div class="table-responsive"><table class="table table-sm align-middle mb-0 tabular"><thead><tr><th rowspan="2">${t('heiz.energy')}</th><th colspan="4" class="text-center">${t('heiz.kwh_col')}</th><th colspan="4" class="text-center">${t('heiz.cost_col')}</th></tr><tr>${cab}${cab}</tr></thead><tbody>` +
    HEIZ_SOURCES.filter(f => band.rows[f]).map(f => `<tr class="${f === d.energy ? 'table-active fw-semibold' : ''}"><th scope="row" class="fw-normal text-nowrap">${t('heiz.source.' + f)}</th>${cells(band.rows[f].kwh, 0)}${cells(band.rows[f].cost, 2)}</tr>`).join('') + '</tbody></table></div>' : '';
  $('#mt-heiz').innerHTML = `<div class="table-responsive"><table class="table table-hover align-middle mb-0 tabular"><thead><tr><th>${t('period.period')}</th><th>${t('heiz.table')}${helpIcon(t('heiz.table_help'))}</th><th class="text-end">kWh/m²</th><th>${t('heiz.category')}</th><th class="text-end">${t('heiz.reference')}</th></tr></thead><tbody>${rows || `<tr><td colspan="5" class="text-center text-body-secondary py-3">–</td></tr>`}</tbody></table></div>
    ${reference}<div class="card-body border-top small text-body-secondary">${t('heiz.note')}</div>`;
}

async function loadEnergy() {
  const [d, cfg] = await Promise.all([api('/api/energy'), api('/api/config')]);
  energyData = d;
  heizspiegels = cfg.heizspiegels;
  const withData = d.periods.some(p => p.kwh != null);
  $('#mt-energy-empty').hidden = withData;
  $('#mt-energy-empty .card-body').innerHTML = `<p class="text-body-secondary mb-0">${t('energy.empty')} <a href="#settings/home">${t('energy.go_settings')}</a></p>`;
  $('#mt-energy-block').hidden = !withData;
  if (!withData) return;
  const projected = projectedUnits();
  const periodsE = d.periods.map(p => {
    const kwhEnd = projected?.period === p.id && p.factor ? projected.units * p.factor : null;
    return { ...p, kwhEnd, costEnd: kwhEnd != null && p.price ? kwhEnd * p.price : null };
  });
  renderKpiEnergy(periodsE);
  renderAnnual(periodsE, d.is_apartment);
  renderHeizspiegel(periodsE, d);
  const withKwh = periodsE.filter(p => p.kwh != null);
  const previous = $('#mt-room-period').value;
  $('#mt-room-period').innerHTML = withKwh.slice().reverse().map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  // Defaults to the period in progress; if another was already selected, it is respected on refresh
  $('#mt-room-period').value = withKwh.some(p => p.id === previous) ? previous : (withKwh.find(p => p.in_progress) || withKwh[withKwh.length - 1]).id;
  renderRooms();
}

// Last closed and complete period: the fair baseline to compare
const referencePeriod = periods => periods.filter(p => p.kwh != null && !p.in_progress && !p.partial_move_in).pop();
const fmtN = (v, dec = 0) => v == null ? '–' : fmtValue(v, dec);
const fmtPct = v => `${v > 0 ? '+' : v < 0 ? '−' : ''}${num(Math.abs(v), 0)} %`;

function renderKpiEnergy(periods) {
  const ref = referencePeriod(periods), current = periods.find(p => p.in_progress);
  const kpi = (title, value, unit, sub, color) => `<div class="col-6 col-lg-3"><div class="card h-100" style="border-top:3px solid ${color}">
    <div class="card-body py-3"><div class="small text-body-secondary">${esc(title)}</div>
    <div class="fs-4 fw-semibold tabular">${value} <span class="fs-6 fw-normal text-body-secondary">${esc(unit)}</span></div>
    <div class="small text-body-secondary">${sub}</div></div></div></div>`;
  let html = '';
  if (ref) {
    const diff = ref.building?.difference;
    html += kpi(t('energy.kpi_intensity', { p: ref.name }), fmtN(ref.kwh_m2, 1), 'kWh/m²', diff == null ? '&nbsp;' : `<span class="fw-semibold ${diff > 0 ? 'text-danger' : 'text-success'}">${fmtPct(diff)}</span> ${t('energy.vs_building')}`, 'var(--cui-primary)');
    html += kpi(t('energy.kpi_cost', { p: ref.name }), fmtN(ref.cost), '€', ref.paid == null ? '&nbsp;' : t('energy.paid_val', { v: fmtN(ref.paid, 2) }), 'var(--cui-primary)');
  }
  if (current) {
    html += kpi(t('energy.kpi_current', { p: current.name }), `≈ ${fmtN(current.kwh)}`, 'kWh', current.cost == null ? '&nbsp;' : `≈ ${fmtN(current.cost)} €`, 'var(--cui-warning)');
    if (current.kwhEnd != null) {
      const diff = ref?.cost && current.costEnd != null ? (current.costEnd - ref.cost) / ref.cost * 100 : null;
      html += kpi(t('energy.kpi_end', { p: current.name }), current.costEnd != null ? `≈ ${fmtN(current.costEnd)}` : `≈ ${fmtN(current.kwhEnd)}`, current.costEnd != null ? '€' : 'kWh',
        `≈ ${fmtN(current.kwhEnd)} kWh${diff == null ? '' : ` · <span class="fw-semibold ${diff > 0 ? 'text-danger' : 'text-success'}">${fmtPct(diff)}</span> vs. ${esc(ref.name)}`}${helpIcon(t('energy.projection_help'))}`, 'var(--cui-warning)');
    }
  }
  $('#mt-kpi-energy').innerHTML = html;
}

// One row per period, so it supports many years; each view shows few columns to allow comparing them
let annualView = 'consumption', annualPeriods = [], hasBuilding = false;
function renderAnnual(chronological, isApt) {
  annualPeriods = chronological.slice().reverse();   // most recent first: it is the one being evaluated
  hasBuilding = isApt && chronological.some(p => p.building);
  renderAnnualView();
}

function renderAnnualView() {
  if (annualView === 'building' && !hasBuilding) annualView = 'consumption';
  document.querySelectorAll('#mt-annual-view button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === annualView);
    if (b.dataset.view === 'building') b.hidden = !hasBuilding;
  });
  const estimated = annualPeriods.some(p => p.estimated);
  const approx = (p, v, dec) => v == null ? '–' : (p.estimated ? '≈ ' : '') + fmtN(v, dec);
  const withPrice = (p, v) => v == null ? '–' : (p.estimated || p.price_estimated ? '≈ ' : '') + fmtN(v);
  const vs = v => v == null ? '–' : `<span class="fw-semibold ${v > 0 ? 'text-danger' : 'text-success'}">${fmtPct(v)}</span>`;
  const columns = {
    consumption: [['energy.kwh', '', p => approx(p, p.kwh)], ['energy.kwh_m2', '', p => `<strong>${approx(p, p.kwh_m2, 1)}</strong>`], ['energy.w_m2', 'energy.w_m2_help', p => approx(p, p.w_m2, 1)],
      ['energy.units', '', p => fmtN(p.units)], ['energy.factor', estimated ? 'energy.avg_factor_help' : 'energy.factor_help', p => approx(p, p.factor, 3)]],
    costs: [['energy.price', 'energy.price_help', p => p.price == null ? '–' : (p.price_estimated ? '≈ ' : '') + fmtN(p.price, 3)], ['energy.cost', 'energy.cost_help', p => `<strong>${withPrice(p, p.cost)}</strong>`],
      ['energy.paid', 'energy.paid_help', p => fmtN(p.paid, 2)], ['energy.proj_kwh', 'energy.projection_help', p => p.kwhEnd == null ? '–' : `≈ ${fmtN(p.kwhEnd)}`], ['energy.proj_cost', '', p => p.costEnd == null ? '–' : `<strong>≈ ${fmtN(p.costEnd)}</strong>`]],
    building: [['energy.kwh_building', '', p => fmtN(p.building?.kwh)], ['energy.kwh_m2_building', '', p => fmtN(p.building?.kwh_m2, 1)], ['energy.kwh_m2_home', '', p => approx(p, p.kwh_m2, 1)], ['energy.vs_building', 'energy.vs_building_help', p => vs(p.building?.difference)]],
  }[annualView];
  const rows = annualView === 'building' ? annualPeriods.filter(p => p.building) : annualPeriods;
  const periodState = p => p.in_progress ? ` <span class="badge text-bg-info fw-normal">${t('period.state_progress')}</span>`
    : p.partial_move_in ? ` <span class="badge text-bg-light border fw-normal">${t('movein.since')}</span>` : '';
  $('#mt-annual').innerHTML = `<thead><tr><th>${t('period.period')}</th>${columns.map(([key, help]) => `<th class="text-end">${esc(t(key))}${help ? helpIcon(t(help)) : ''}</th>`).join('')}</tr></thead><tbody>` +
    rows.map(p => `<tr><td>${esc(p.name)}${periodState(p)}</td>${columns.map(([, , value]) => `<td class="text-end">${value(p)}</td>`).join('')}</tr>`).join('') + '</tbody>';
  paginateTable('#mt-annual');
}
$('#mt-annual-view').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]');
  if (b) { annualView = b.dataset.view; delete currentPage['mt-annual']; renderAnnualView(); }
});

// Signal levels (linkquality from 0 to 255): green from 100, yellow from 40, red below
function signalIcon(lq) {
  if (lq == null) return '–';
  const bars = lq >= 150 ? 4 : lq >= 100 ? 3 : lq >= 60 ? 2 : lq >= 30 ? 1 : 0;
  const color = lq >= 100 ? 'text-success' : lq >= 40 ? 'text-warning' : 'text-danger';
  return `<span class="tabular text-nowrap"><i class="cil-wifi-signal-${bars} ${color} me-1"></i>${whole(lq)}</span>`;
}

function renderSignals() {
  const badge = { online: ['success', 'sensor.connected'] };
  const zigbee = state.sensors.filter(s => !s.manual);
  $('#a-signals').innerHTML = zigbee.length ? zigbee.map(s => {
    const [color, text] = badge[s.connection] || ['secondary', 'sensor.unknown'];
    const last = s.outage?.last_reading || s.last_reading;
    return `<tr>
      <td class="text-nowrap">${point(s.id)} ${esc(nameOf(s.id))}</td>
      <td>${s.connection === 'offline' ? noSignalBadge() : `<span class="badge text-bg-${color}">${t(text)}</span>`}</td>
      <td>${signalIcon(s.outage?.linkquality ?? s.linkquality)}</td>
      <td class="tabular d-none d-md-table-cell">${s.battery != null ? `${whole(s.battery)} %` : '–'}</td>
      <td class="small text-nowrap" title="${esc(fmtDateTime(last))}">${last ? ago(last) : '–'}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="5" class="text-body-secondary">${t('settings.no_sensors')}</td></tr>`;
}

      <div class="form-text tabular">${esc(s.id)} · ${num(s.temperature)} °C · ${s.last_reading ? t('settings.last', { h: ago(s.last_reading) }) : t('settings.no_readings')}
        ${s.manual ? '' : `· <a href="#" data-a-manual="${esc(s.id)}">${t('manual.switch_manual')}</a>`}
        ${s.manual && state.sensors.some(x => !x.manual) ? `<select class="form-select form-select-sm mt-1" data-target="${esc(s.id)}" aria-label="${esc(t('manual.link'))}">
          <option value="">${esc(t('manual.link'))}…</option>
          ${state.sensors.filter(x => !x.manual).map(x => `<option value="${esc(x.id)}">${esc(x.configured_name || x.id)} (${esc(x.id.slice(-4))})</option>`).join('')}
        </select>` : ''}</div>
    </div>`).join('') : `<p class="text-body-secondary">${t('settings.no_sensors')}</p>`;
  const ms = manual_sensors();
  const autos = state.sensors.filter(x => !x.manual);
  $('#a-manual_sensors').innerHTML = ms.length ? ms.map(s => `<li class="list-group-item d-flex align-items-center gap-2 flex-wrap">
      ${point(s.id)}<span class="flex-grow-1 text-truncate">${esc(nameOf(s.id))}</span>
      ${autos.length ? `<select class="form-select form-select-sm w-auto" data-target="${esc(s.id)}" aria-label="${esc(t('manual.link'))}">
        <option value="">${esc(t('manual.link'))}…</option>
        ${autos.map(x => `<option value="${esc(x.id)}">${esc(x.configured_name || x.id)} (${esc(x.id.slice(-4))})</option>`).join('')}
      </select>` : ''}
      <button class="btn btn-sm btn-ghost-danger" data-delete-manual="${esc(s.id)}" title="${esc(t('delete'))}" aria-label="${esc(t('delete'))}"><i class="cil-trash"></i></button>
    </li>`).join('') : `<li class="list-group-item small text-body-secondary">${t('manual.none')}</li>`;
  $('#a-interval').value = state.interval_minutes;
  $('#a-live').value = state.live_seconds;
  $('#a-move-in').value = state.move_in_date || '';
  $('#a-temp-min').value = state.temp_ref?.min ?? 18;
  $('#a-temp-max').value = state.temp_ref?.max ?? 22;
  $('#a-hum-min').value = state.humidity_ref?.min ?? 40;
  $('#a-hum-max').value = state.humidity_ref?.max ?? 60;
  $('#a-place-current').textContent = placeName();
  $('#a-results').innerHTML = '';
  pendingPlace = null;
}

async function searchPlace() {
  const q = $('#a-search').value.trim();
  if (q.length < 2) return;
  $('#a-results').innerHTML = `<div class="list-group-item text-body-secondary">${t('settings.searching')}</div>`;
  try {
    const res = await api('/api/search_place?' + new URLSearchParams({ q, lang }));
    $('#a-results').innerHTML = res.length
      ? res.map((r, n) => `<button type="button" class="list-group-item list-group-item-action" data-n="${n}"><i class="cil-location-pin me-2"></i>${esc(r.name)}</button>`).join('')
      : `<div class="list-group-item text-body-secondary">${t('settings.no_results')}</div>`;
    $('#a-results').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      pendingPlace = res[b.dataset.n];
      $('#a-place-current').innerHTML = `${esc(pendingPlace.name)} <span class="badge text-bg-warning">${t('settings.no_save')}</span>`;
      $('#a-results').innerHTML = '';
    };
  } catch (err) { $('#a-results').innerHTML = `<div class="list-group-item text-danger">${esc(err.message)}</div>`; }
}
$('#a-search-btn').addEventListener('click', searchPlace);

async function createManual() {
  const name = $('#a-manual-name').value.trim();
  if (!name) return $('#a-manual-name').focus();
  if (!await confirm(t('conf.new'), { detail: name })) return;
  try {
    await api('/api/manual_sensors', { method: 'POST', body: { name } });
    $('#a-manual-name').value = '';
    await loadState();
    renderSettings();
    toast(t('manual.created'), 'success');
  } catch (err) { toast(err.message); }
}
$('#a-manual-create').addEventListener('click', createManual);
$('#a-manual-name').addEventListener('keydown', e => { if (e.key === 'Enter') createManual(); });
$('#a-manual_sensors').addEventListener('click', async e => {
  const b = e.target.closest('[data-delete-manual]');
  if (!b || !await confirm(t('manual.confirm_delete', { n: nameOf(b.dataset.deleteManual) }), { danger: true })) return;
  try {
    await api(`/api/manual_sensors/${b.dataset.deleteManual}`, { method: 'DELETE' });
    await loadState();
    renderSettings();
    temperaturesLoaded = false;
    toast(t('manual.deleted'), 'success');
  } catch (err) { toast(err.message); }
});
const linkManual = async e => {
  const sel = e.target.closest('[data-target]');
  if (!sel || !sel.value) return;
  const source = sel.dataset.target, target = sel.value;
  if (!await confirm(t('manual.confirm_link', { n: nameOf(source), d: target }))) { sel.value = ''; return; }
  try {
    await api(`/api/manual_sensors/${source}/automatic`, { method: 'POST', body: { target } });
    await loadState();
    renderSettings();
    temperaturesLoaded = false;
    toast(t('manual.linked'), 'success');
  } catch (err) { toast(err.message); }
};
$('#a-manual_sensors').addEventListener('change', linkManual);
$('#a-rooms').addEventListener('change', linkManual);
$('#a-rooms').addEventListener('click', async e => {
  const a = e.target.closest('[data-a-manual]');
  if (!a) return;
  e.preventDefault();
  const id = a.dataset.aManual;
  if (!await confirm(t('manual.confirm_switch', { n: nameOf(id) }))) return;
  try {
    await api(`/api/manual_sensors/convert/${id}`, { method: 'POST' });
    await loadState();
    renderSettings();
    temperaturesLoaded = false;
    toast(t('manual.switched'), 'success');
  } catch (err) { toast(err.message); }
});
$('#a-search').addEventListener('keydown', e => { if (e.key === 'Enter') searchPlace(); });

$('#a-save').addEventListener('click', async () => {
  const rooms = {};
  document.querySelectorAll('#a-rooms input').forEach(i => { if (i.value.trim()) rooms[i.dataset.id] = i.value.trim(); });
  const body = { rooms, interval_minutes: Number($('#a-interval').value), live_seconds: Number($('#a-live').value),
                 humidity_ref: { min: Number($('#a-hum-min').value), max: Number($('#a-hum-max').value) },
                 temp_ref: { min: Number($('#a-temp-min').value), max: Number($('#a-temp-max').value) },
                 move_in_date: $('#a-move-in').value };
  if (pendingPlace) body.place = pendingPlace;
  if (!await confirm(t('conf.settings'))) return;
  try {
    await api('/api/config', { method: 'PUT', body });
    await loadState();
    renderSettings();
    temperaturesLoaded = false;
    toast(t('settings.saved'), 'success');
    redrawCharts();
    if (body.place) setTimeout(() => loadState().catch(() => {}), 3000);
  } catch (err) { toast(err.message); }
});

// ======================================================================
//  Startup
// ======================================================================
async function refresh() {
  await loadState();
  const tab = currentTab();
  if (tab === 'panel') loadPanelChart().catch(err => toast(err.message));
  if (tab === 'windows') loadWindows();
  if (tab === 'thermostats') loadThermostats();
  if (tab === 'temperatures') loadTemperatures();
}

(async () => {
  prepareDates();
  translatePage();
  saveLang();
  applyTheme(readTheme());
  $('#t-until').value = $('#v-until').value = dateInput(new Date());
  $('#t-since').value = dateInput(new Date(Date.now() - 6 * DAY));
  $('#v-since').value = dateInput(new Date(Date.now() - 29 * DAY));
  $('#tm-until').value = dateInput(new Date());
  $('#tm-since').value = dateInput(new Date(Date.now() - 29 * DAY));
  $('#en-until').value = dateInput(new Date());
  $('#en-since').value = `${new Date().getFullYear()}-01-01`;
  try { await loadState(); } catch (err) { toast(err.message); }
  showTab();
  scheduleLive();
  setInterval(() => { if (!document.hidden) updateLiveTimes(); }, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) updateLiveTimes(); });
  setInterval(() => { if (!document.hidden && currentTab() === 'panel') loadPanelChart().catch(() => {}); }, 5 * 60000);
})();
</script>
</body>
</html>
