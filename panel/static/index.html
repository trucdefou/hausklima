// Consumo de cada medidor en cada período de liquidación
// Tasa diaria (unidad/día) medida en el instante t: solo si las lecturas que lo rodean están a ≤ 62 días (si no, no se ve la estacionalidad)
function tasaEn(serie, t) {
  for (let i = 0; i + 1 < serie.length; i++) {
    const p = serie[i], q = serie[i + 1];
    if (t >= p.x && t < q.x) return q.x - p.x <= 62 * DIA ? (q.a - p.a) / ((q.x - p.x) / DIA) : null;
  }
  return null;
}
// Promedio de lo medido en esa fecha (mes/día) en todos los años con datos anteriores a `limite`
function tasaFecha(serie, fecha, limite) {
  const v = [];
  for (let y = new Date(serie[0].x).getFullYear(); y <= new Date(limite).getFullYear(); y++) {
    const t = new Date(y, fecha.getMonth(), fecha.getDate(), 12).getTime();
    if (t >= serie[0].x && t <= limite) { const r = tasaEn(serie, t); if (r != null) v.push(r); }
  }
  return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null;
}
// Consumo esperado entre `desde` y `hasta` según la estacionalidad medida con datos anteriores a `limite`; null si casi no hay datos comparables
function tasasEsperadas(serie, desde, hasta, limite) {
  if (serie.length < 2) return null;
  let total = 0, conDato = 0, dias = 0;
  const sinDato = [];
  for (let t = desde; t < hasta; t += DIA) {
    const dia = new Date(Math.min(t + DIA / 2, hasta)), fraccion = Math.min(DIA, hasta - t) / DIA;
    dias += fraccion;
    let r = tasaFecha(serie, dia, limite);
    if (r == null) {   // fecha simétrica respecto del 15 de enero
      const doy = Math.round((new Date(dia.getFullYear(), dia.getMonth(), dia.getDate()) - new Date(dia.getFullYear(), 0, 1)) / DIA) + 1;
      let esp = 30 - doy; if (esp < 1) esp += 365;
      r = tasaFecha(serie, new Date(dia.getFullYear(), 0, esp), limite);
    }
    if (r == null) { sinDato.push(fraccion); continue; }
    total += r * fraccion; conDato += fraccion;
  }
  if (conDato < dias * 0.6) return null;
  return total + (sinDato.length ? total / conDato * sinDato.reduce((x, y) => x + y, 0) : 0);
}

// Proyección de calefacción al cierre: lo consumido + (consumo por grado-día de este período) × (grados-día de las mismas
// fechas restantes, un año antes). null si hay poco frío acumulado para calcular el ritmo o falta el clima de esas fechas.
const MIN_GRADOS_DIA_PROYECCION = 100;
function proyeccionPorFrio(s, desde, hasta, objetivo, consumido) {
  if (!repartePorFrio(s, desde, hasta)) return null;
  const gradosPeriodo = gradosHasta(hasta) - gradosHasta(desde);
  const inicioResto = unAnioAntes(hasta), finResto = unAnioAntes(objetivo);
  if (gradosPeriodo < MIN_GRADOS_DIA_PROYECCION || inicioResto < gradosDia.ini || finResto > gradosDia.fin) return null;
  const ritmo = consumido / gradosPeriodo, gradosResto = gradosHasta(finResto) - gradosHasta(inicioResto);
  return { total: consumido + ritmo * gradosResto, consumido, ritmo, gradosResto };
}

function calcularProyeccion(s, ini, fin, valor, ahora) {
  // Proyección a fin de año (31 dic; si el período termina antes, a su cierre) con estacionalidad:
  // se suma, día por día, el consumo esperado según lo medido en esa misma fecha en otros años o, si no hay datos,
  // en la fecha climáticamente equivalente (simétrica respecto del 15 de enero, el momento más frío).
  // Sin datos suficientes se usa el promedio diario (sin estacionalidad).
  let proy = null, estacional = false, frio = null;
  const objetivo = Math.min(fin, new Date(new Date(ahora).getFullYear(), 11, 31, 23, 59, 59).getTime());
  if (fin >= ahora && valor > 0) {
    const desde = Math.max(ini, s[0].x), hasta = Math.min(s[s.length - 1].x, ahora);
    frio = hasta > desde ? proyeccionPorFrio(s, desde, hasta, objetivo, valor) : null;
    if (frio) { proy = frio.total; estacional = true; }
    else if (hasta > desde) {
      // Ritmo reciente (últimos ~7 días, entre lecturas reales) frente a lo habitual para esas fechas: escala lo que falta
      let vi = s.findIndex(q => q.x >= hasta - 7 * DIA);
      if (vi > 0 && hasta - s[vi].x < 2 * DIA) vi--;
      const ventana = vi >= 0 && s[vi].x < hasta ? s[vi].x : hasta - 7 * DIA;
      const futuro = tasasEsperadas(s, hasta, objetivo, ventana);
      if (futuro != null) {
        const habitual = tasasEsperadas(s, ventana, hasta, ventana);
        const real = acumEn(s, hasta) - acumEn(s, ventana);
        const k = habitual != null && habitual >= 1 ? Math.min(4, Math.max(0, real / habitual)) : 1;
        proy = valor + futuro * k; estacional = true;
      }
      else proy = valor + valor / ((hasta - desde) / DIA) * Math.max(0, objetivo - hasta) / DIA;
    }
  }
  return { proy, estacional, frio };
}

function filaTotalComparacion(lista, celdas, periodosComp) {
  if (lista.length < 2 || new Set(lista.map(unidadDe)).size > 1) return '';
  const unidad = esc(unidadDe(lista[0]));
  return `<tr class="fw-semibold"><td>${t('cons.total_todos')}</td>` + periodosComp.map((p, j) => {
    const fila = celdas.map(c => c[j]).filter(Boolean);
    if (!fila.length) return '<td class="text-end text-body-secondary">–</td>';
    const suma = fila.reduce((s, c) => s + c.valor, 0);
    const proy = fila.some(c => c.enCurso) && fila.every(c => c.proy != null) ? fila.reduce((s, c) => s + c.proy, 0) : null;
    return `<td class="text-end">${fmtValor(suma, 0)} <span class="small text-body-secondary fw-normal">${unidad}</span>
      ${proy != null ? `<div class="small text-body-secondary fst-italic fw-normal">${t('per.proyeccion')}: ${fmtValor(proy, 0)}${iconoAyuda(t('cons.proy_total_ayuda'))}</div>` : ''}</td>`;
  }).join('') + '</tr>';
}

function renderComparacion(lista, texto, grid) {
  const perConDatos = periodos.filter(p => p.inicio <= fechaInput(new Date()));
  $('#cs-comp-card').hidden = !perConDatos.length || !lista.length;
  if ($('#cs-comp-card').hidden) { graficos['graf-comp']?.destroy(); return; }
  const ahora = Date.now();
  const celdas = lista.map(m => {
    const s = serieAcum(m.id);
    return perConDatos.map(p => {
      const [ini, fin] = limitesPer(p);
      if (!s.length || s[s.length - 1].x < ini || s[0].x > fin) return null;   // sin datos en ese período
      const valor = acumEn(s, fin) - acumEn(s, ini);
      const incompleto = fin < ahora && s[s.length - 1].x < fin;
      const { proy, estacional, frio } = calcularProyeccion(s, ini, fin, valor, ahora);
      return { valor, proy, estacional, frio, incompleto, enCurso: fin >= ahora, parcialMudanza: !!badgePerMudanza(p) };
    });
  });
  const estadoPer = p => { const [ini, fin] = limitesPer(p); return badgePerMudanza(p) + (fin < ahora ? '' : ` <span class="badge text-bg-info">${t('per.estado_curso')}</span>`); };
  $('#cs-comp').innerHTML = `<thead><tr><th>${t('med.medidor')}</th>${perConDatos.map(p => `<th class="text-end">${esc(p.nombre)}${estadoPer(p)}</th>`).join('')}</tr></thead><tbody>` +
    lista.map((m, i) => `<tr><td><span class="d-inline-flex align-items-center gap-2">${puntoMed(m.id)}${esc(m.nombre)}</span></td>` +
      celdas[i].map((c, j) => {
        if (!c) return '<td class="text-end text-body-secondary">–</td>';
        const prev = j > 0 ? celdas[i][j - 1] : null;
        // no se compara contra un período incompleto ni contra el de la mudanza (no es un año completo)
        const delta = prev && prev.valor > 0 && !prev.incompleto && !prev.parcialMudanza && !c.enCurso && !c.incompleto && !c.parcialMudanza
          ? (c.valor - prev.valor) / prev.valor * 100 : null;
        return `<td class="text-end"><span class="${c.incompleto ? 'fst-italic text-body-secondary' : 'fw-semibold'}" ${c.incompleto ? `title="${esc(t('per.incompleto'))}"` : ''}>${fmtValor(c.valor, 0)}</span>
          <span class="small text-body-secondary">${esc(unidadDe(m))}</span>
          ${c.incompleto ? `<div class="small"><span class="badge text-bg-warning">${t('per.incompleto')}</span></div>` : ''}
          ${c.proy != null ? `<div class="small text-body-secondary fst-italic">${t('per.proyeccion')}: ${fmtValor(c.proy, 0)}${c.frio ? iconoAyuda(t('per.proy_frio', { c: fmtValor(c.frio.consumido, 0), r: fmtValor(c.frio.ritmo, 3), g: fmtValor(c.frio.gradosResto, 0), p: fmtValor(c.frio.total, 0) })) : ''}${c.estacional ? '' : ` <span title="${esc(t('per.proy_lineal_ayuda'))}">(${t('per.proy_lineal')})</span>`}</div>` : ''}
          ${delta != null ? `<div class="small ${delta > 0 ? 'text-danger' : 'text-success'}">${delta > 0 ? '+' : ''}${num(delta, 0)} % ${t('per.variacion')}</div>` : ''}</td>`;
      }).join('') + '</tr>').join('') + filaTotalComparacion(lista, celdas, perConDatos) + '</tbody>';

  // Barras agrupadas: un grupo por medidor, una barra por período
  const tonos = perConDatos.map((p, j) => 0.35 + 0.65 * (j + 1) / perConDatos.length);
  graficos['graf-comp']?.destroy();
  graficos['graf-comp'] = new Chart($('#graf-comp'), {
    type: 'bar',
    data: {
      labels: lista.map(m => m.nombre),
      datasets: perConDatos.flatMap((p, j) => [{
        label: p.nombre, data: celdas.map(fila => fila[j] ? fila[j].valor : null), stack: p.id,
        backgroundColor: `rgba(99, 102, 241, ${tonos[j]})`, borderColor: '#6366f1', borderWidth: 1,
      }, {
        // Proyección del período en curso: barra translúcida con borde punteado encima de lo consumido
        label: `${p.nombre} (${t('per.proyeccion')})`, proyeccion: true, stack: p.id,
        data: celdas.map(fila => fila[j] && fila[j].proy != null ? fila[j].proy - fila[j].valor : null),
        backgroundColor: 'rgba(99, 102, 241, 0.15)', borderColor: '#6366f1', borderWidth: 1.5, borderDash: [5, 4],
      }]),
    },
    options: {
      animation: false, maintainAspectRatio: false,
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { color: texto } },
        y: { stacked: true, beginAtZero: true, grid: { color: grid }, ticks: { color: texto, callback: v => fmtValor(v, 0) } },
      },
      plugins: {
        legend: { labels: { color: texto, boxWidth: 12, filter: (it, datos) => !datos.datasets[it.datasetIndex]?.proyeccion } },
        tooltip: { callbacks: { label: it => {
          const u = unidadDe(lista[it.dataIndex]);
          if (!it.dataset.proyeccion) return `${it.dataset.label}: ${fmtValor(it.parsed.y, 0)} ${u}`;
          const c = celdas[it.dataIndex][Math.floor(it.datasetIndex / 2)];
          return `${it.dataset.label}: ${fmtValor(c.proy, 0)} ${u}`;
        } } },
      },
    },
  });
}

async function mostrarAgua() {
  try { await cargarMedidores(); } catch (err) { return aviso(err.message); }
  renderAgua();
}

function renderAgua() {
  const ahoraLocal = isoLocal(new Date()).slice(0, 16);
  $('#ag-tarjetas').innerHTML = medidoresAgua.length ? medidoresAgua.map(m => htmlTarjetaMedidor(m, ahoraLocal)).join('')
    : `<div class="col-12 w-100"><div class="card"><div class="card-body text-body-secondary">${t('agua.ninguno')}</div></div></div>`;
  if ($('#ag-editando').value) { $('#ag-titulo').textContent = t('agua.editar'); $('#ag-guardar').textContent = t('guardar'); }
  const csv = paramsRango('#ag-desde', '#ag-hasta');
  csv.set('tipo', 'agua_caliente');
  $('#ag-descargar').href = '/api/consumo.csv?' + csv + '&idioma=' + idioma;

  const d = $('#ag-desde').value ? new Date($('#ag-desde').value + 'T00:00:00').getTime() : Date.now() - 30 * DIA;
  const h = Math.min($('#ag-hasta').value ? new Date($('#ag-hasta').value + 'T23:59:59').getTime() : Date.now(), Date.now());
  const datos = medidoresAgua.map(m => {
    const s = serieAcum(m.id);
    const consumo = acumEn(s, h) - acumEn(s, d);
    const ini = s.length ? Math.max(d, s[0].x) : 0, fin = s.length ? Math.min(h, s[s.length - 1].x) : 0;
    const dias = s.length > 1 && fin > ini ? (fin - ini) / DIA : 0;
    return { m, s, consumo, porDia: dias ? consumo / dias : null };
  });

  // Resumen
  const widget = (titulo, valor, sub, color) => `<div class="col-6 col-lg-3"><div class="card h-100" style="border-top:3px solid ${color}">
    <div class="card-body py-3"><div class="small text-body-secondary text-truncate">${titulo}</div>
    <div class="fs-4 fw-semibold tabular">${valor}</div><div class="small text-body-secondary">${sub}</div></div></div></div>`;
  let html = '';
  if (datos.length > 1 && datos.every(x => enLitros(x.m))) {
    const total = datos.reduce((s, x) => s + x.consumo, 0), totalDia = datos.reduce((s, x) => s + (x.porDia || 0), 0);
    html += widget(t('cons.total_todos'), fmtConsumo(total, datos[0].m), t('agua.por_dia', { v: fmtConsumo(totalDia, datos[0].m) }), 'var(--cui-primary)');
  }
  html += datos.map(x => widget(esc(x.m.nombre), fmtConsumo(x.consumo, x.m),
    x.porDia == null ? t('agua.en_periodo') : t('agua.por_dia', { v: fmtConsumo(x.porDia, x.m) }), colorMed[x.m.id])).join('');
  $('#ag-resumen').innerHTML = html;

  // Barras por día o por mes
  const css = getComputedStyle(document.documentElement);
  const texto = css.getPropertyValue('--cui-body-color').trim() || '#666';
  const grid = css.getPropertyValue('--cui-border-color-translucent').trim() || 'rgba(0,0,0,.1)';
  const diario = h - d <= 62 * DIA;
  $('#ag-barras-titulo').textContent = t(diario ? 'cons.barras_dia' : 'cons.barras_mes');
  const cortes = [];
  const c = new Date(d);
  c.setHours(0, 0, 0, 0);
  if (!diario) c.setDate(1);
  while (c.getTime() < h && cortes.length < 400) {
    const ini = Math.max(c.getTime(), d);
    if (diario) c.setDate(c.getDate() + 1); else c.setMonth(c.getMonth() + 1);
    cortes.push([ini, Math.min(c.getTime(), h)]);
  }
  const factor = m => enLitros(m) ? 1000 : 1;
  graficos['graf-agua']?.destroy();
  graficos['graf-agua'] = new Chart($('#graf-agua'), {
    type: 'bar',
    data: {
      labels: cortes.map(([a]) => diario ? fmtDiaMes(new Date(a)) : new Date(a).toLocaleDateString(idioma, { month: 'short', year: 'numeric' })),
      datasets: datos.map(x => ({
        label: `${x.m.nombre} (${enLitros(x.m) ? 'L' : unidadDe(x.m)})`, backgroundColor: colorMed[x.m.id], stack: 'agua',
        data: cortes.map(([a, b]) => Math.max(0, acumEn(x.s, b) - acumEn(x.s, a)) * factor(x.m)),
      })),
    },
    options: {
      animation: false, maintainAspectRatio: false,
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { color: texto, maxRotation: 0, autoSkip: true } },
        y: { stacked: true, beginAtZero: true, grid: { color: grid }, ticks: { color: texto, callback: v => fmtValor(v, 0) } },

// Unidades de calefacción proyectadas al cierre del período en curso: la misma cuenta que en Consumo. null si falta algún medidor.
function unidadesProyectadas() {
  const ahora = Date.now(), per = periodos.map(p => ({ id: p.id, lim: limitesPer(p) })).find(p => p.lim[0] <= ahora && ahora <= p.lim[1]);
  if (!per || !medidores.length) return null;
  const [ini, fin] = per.lim;
  const proy = medidores.map(m => { const s = serieAcum(m.id); return calcularProyeccion(s, ini, fin, acumEn(s, fin) - acumEn(s, ini), ahora).proy; });
  return proy.every(x => x != null) ? { periodo: per.id, unidades: proy.reduce((a, b) => a + b, 0) } : null;
}

let datosEnergia = null;

async function cargarEnergia() {
  const d = datosEnergia = await api('/api/energia');
  const conDatos = d.periodos.some(p => p.kwh != null);
  $('#mt-energia-vacio').hidden = conDatos;
  $('#mt-energia-vacio .card-body').innerHTML = `<p class="text-body-secondary mb-0">${t('ene.vacio')} <a href="#ajustes">${t('ene.ir_ajustes')}</a></p>`;
  $('#mt-energia-bloque').hidden = !conDatos;
  if (!conDatos) return;
  const proyectado = unidadesProyectadas();
  const periodosE = d.periodos.map(p => {
    const kwhFin = proyectado?.periodo === p.id && p.factor ? proyectado.unidades * p.factor : null;
    return { ...p, kwhFin, costoFin: kwhFin != null && p.precio ? kwhFin * p.precio : null };
  });
  renderKpiEnergia(periodosE);
  renderAnual(periodosE, d.es_departamento);
  const conKwh = periodosE.filter(p => p.kwh != null);
  const previo = $('#mt-sala-periodo').value;
  $('#mt-sala-periodo').innerHTML = conKwh.slice().reverse().map(p => `<option value="${esc(p.id)}">${esc(p.nombre)}</option>`).join('');
  // Por defecto el período en curso; si ya se eligió otro, se respeta al refrescar
  $('#mt-sala-periodo').value = conKwh.some(p => p.id === previo) ? previo : (conKwh.find(p => p.en_curso) || conKwh[conKwh.length - 1]).id;
  renderSalas();
}

// Último período cerrado y completo: la base justa para comparar
const periodoReferencia = periodos => periodos.filter(p => p.kwh != null && !p.en_curso && !p.parcial_mudanza).pop();
const fmtN = (v, dec = 0) => v == null ? '–' : fmtValor(v, dec);
const fmtPct = v => `${v > 0 ? '+' : v < 0 ? '−' : ''}${num(Math.abs(v), 0)} %`;

function renderKpiEnergia(periodos) {
  const ref = periodoReferencia(periodos), actual = periodos.find(p => p.en_curso);
  const kpi = (titulo, valor, unidad, sub, color) => `<div class="col-6 col-lg-3"><div class="card h-100" style="border-top:3px solid ${color}">
    <div class="card-body py-3"><div class="small text-body-secondary">${esc(titulo)}</div>
    <div class="fs-4 fw-semibold tabular">${valor} <span class="fs-6 fw-normal text-body-secondary">${esc(unidad)}</span></div>
    <div class="small text-body-secondary">${sub}</div></div></div></div>`;
  let html = '';
  if (ref) {
    const dif = ref.edificio?.diferencia;
    html += kpi(t('ene.kpi_intensidad', { p: ref.nombre }), fmtN(ref.kwh_m2, 1), 'kWh/m²', dif == null ? '&nbsp;' : `<span class="fw-semibold ${dif > 0 ? 'text-danger' : 'text-success'}">${fmtPct(dif)}</span> ${t('ene.vs_edificio')}`, 'var(--cui-primary)');
    html += kpi(t('ene.kpi_costo', { p: ref.nombre }), fmtN(ref.costo), '€', ref.pagado == null ? '&nbsp;' : t('ene.pagado_val', { v: fmtN(ref.pagado, 2) }), 'var(--cui-primary)');
  }
  if (actual) {
    html += kpi(t('ene.kpi_actual', { p: actual.nombre }), `≈ ${fmtN(actual.kwh)}`, 'kWh', actual.costo == null ? '&nbsp;' : `≈ ${fmtN(actual.costo)} €`, 'var(--cui-warning)');
    if (actual.kwhFin != null) {
      const dif = ref?.costo && actual.costoFin != null ? (actual.costoFin - ref.costo) / ref.costo * 100 : null;
      html += kpi(t('ene.kpi_fin', { p: actual.nombre }), actual.costoFin != null ? `≈ ${fmtN(actual.costoFin)}` : `≈ ${fmtN(actual.kwhFin)}`, actual.costoFin != null ? '€' : 'kWh',
        `≈ ${fmtN(actual.kwhFin)} kWh${dif == null ? '' : ` · <span class="fw-semibold ${dif > 0 ? 'text-danger' : 'text-success'}">${fmtPct(dif)}</span> vs. ${esc(ref.nombre)}`}${iconoAyuda(t('ene.proyeccion_ayuda'))}`, 'var(--cui-warning)');
    }
  }
  $('#mt-kpi-energia').innerHTML = html;
}

// Una fila por período, para que soporte muchos años; cada vista muestra pocas columnas para poder compararlas
let vistaAnual = 'consumo', periodosAnual = [], hayEdificio = false;
function renderAnual(cronologicos, esDpto) {
  periodosAnual = cronologicos.slice().reverse();   // el más reciente primero: es el que se evalúa
  hayEdificio = esDpto && cronologicos.some(p => p.edificio);
  renderVistaAnual();
}

function renderVistaAnual() {
  if (vistaAnual === 'edificio' && !hayEdificio) vistaAnual = 'consumo';
  document.querySelectorAll('#mt-anual-vista button').forEach(b => {
    b.classList.toggle('active', b.dataset.vista === vistaAnual);
    if (b.dataset.vista === 'edificio') b.hidden = !hayEdificio;
  });
  const estimados = periodosAnual.some(p => p.estimado);
  const aprox = (p, v, dec) => v == null ? '–' : (p.estimado ? '≈ ' : '') + fmtN(v, dec);
  const conPrecio = (p, v) => v == null ? '–' : (p.estimado || p.precio_estimado ? '≈ ' : '') + fmtN(v);
  const vs = v => v == null ? '–' : `<span class="fw-semibold ${v > 0 ? 'text-danger' : 'text-success'}">${fmtPct(v)}</span>`;
  const columnas = {
    consumo: [['ene.kwh', '', p => aprox(p, p.kwh)], ['ene.kwh_m2', '', p => `<strong>${aprox(p, p.kwh_m2, 1)}</strong>`], ['ene.w_m2', 'ene.w_m2_ayuda', p => aprox(p, p.w_m2, 1)],
      ['ene.unidades', '', p => fmtN(p.unidades)], ['ene.factor', estimados ? 'ene.factor_medio_ayuda' : 'ene.factor_ayuda', p => aprox(p, p.factor, 3)]],
    costos: [['ene.precio', 'ene.precio_ayuda', p => p.precio == null ? '–' : (p.precio_estimado ? '≈ ' : '') + fmtN(p.precio, 3)], ['ene.costo', 'ene.costo_ayuda', p => `<strong>${conPrecio(p, p.costo)}</strong>`],
      ['ene.pagado', 'ene.pagado_ayuda', p => fmtN(p.pagado, 2)], ['ene.proy_kwh', 'ene.proyeccion_ayuda', p => p.kwhFin == null ? '–' : `≈ ${fmtN(p.kwhFin)}`], ['ene.proy_costo', '', p => p.costoFin == null ? '–' : `<strong>≈ ${fmtN(p.costoFin)}</strong>`]],
    edificio: [['ene.kwh_edificio', '', p => fmtN(p.edificio?.kwh)], ['ene.kwh_m2_edificio', '', p => fmtN(p.edificio?.kwh_m2, 1)], ['ene.kwh_m2_vivienda', '', p => aprox(p, p.kwh_m2, 1)], ['ene.vs_edificio', 'ene.vs_edificio_ayuda', p => vs(p.edificio?.diferencia)]],
  }[vistaAnual];
  const filas = vistaAnual === 'edificio' ? periodosAnual.filter(p => p.edificio) : periodosAnual;
  const estadoPer = p => p.en_curso ? ` <span class="badge text-bg-info fw-normal">${t('per.estado_curso')}</span>`
    : p.parcial_mudanza ? ` <span class="badge text-bg-light border fw-normal">${t('mud.desde')}</span>` : '';
  $('#mt-anual').innerHTML = `<thead><tr><th>${t('per.periodo')}</th>${columnas.map(([clave, ayuda]) => `<th class="text-end">${esc(t(clave))}${ayuda ? iconoAyuda(t(ayuda)) : ''}</th>`).join('')}</tr></thead><tbody>` +
    filas.map(p => `<tr><td>${esc(p.nombre)}${estadoPer(p)}</td>${columnas.map(([, , valor]) => `<td class="text-end">${valor(p)}</td>`).join('')}</tr>`).join('') + '</tbody>';
  paginarTabla('#mt-anual');
}
$('#mt-anual-vista').addEventListener('click', e => {
  const b = e.target.closest('button[data-vista]');
  if (b) { vistaAnual = b.dataset.vista; delete paginaActual['mt-anual']; renderVistaAnual(); }
});

function renderSalas() {
  const d = datosEnergia, p = d?.periodos.find(x => x.id === $('#mt-sala-periodo').value);
  if (!p) return;
  const aprox = p.estimado ? '≈ ' : '';
  const total = d.medidores.reduce((s, m) => s + (p.por_medidor[m.id]?.kwh || 0), 0);
  const filas = d.medidores.map(m => ({ m, x: p.por_medidor[m.id] || {} })).sort((a, b) => (b.x.kwh_m2 ?? -1) - (a.x.kwh_m2 ?? -1));
  $('#mt-salas').innerHTML = `<thead><tr><th>${t('med.medidor')}</th><th class="text-end">m²</th><th class="text-end">${t('ene.kwh')}</th><th class="text-end">${t('ene.kwh_m2')}</th><th style="width:30%">${t('ene.participacion')}</th></tr></thead><tbody>` +
    filas.map(({ m, x }) => {
      const parte = total && x.kwh != null ? x.kwh / total * 100 : null;
      return `<tr><td><span class="d-inline-flex align-items-center gap-2">${puntoMed(m.id)}${esc(m.nombre)}</span></td><td class="text-end">${fmtN(m.m2, 1)}</td>
        <td class="text-end">${x.kwh == null ? '–' : aprox + fmtN(x.kwh)}</td><td class="text-end fw-semibold">${x.kwh_m2 == null ? '–' : aprox + fmtN(x.kwh_m2, 1)}</td>
        <td>${parte == null ? '–' : `<div class="d-flex align-items-center gap-2"><div class="progress flex-grow-1" style="height:6px"><div class="progress-bar" style="width:${parte.toFixed(1)}%;background:${colorMed[m.id] || '#999'}"></div></div><span class="small text-nowrap" style="min-width:3.2em;text-align:right">${num(parte, 0)} %</span></div>`}</td></tr>`;
    }).join('') + '</tbody>';
}
$('#mt-sala-periodo').addEventListener('change', renderSalas);

async function cargarMetricas() {
  let d;
  try { await cargarMedidores(); cargarEnergia().catch(err => aviso(err.message)); d = await api('/api/metricas'); } catch (err) { return aviso(err.message); }
  const valor = (v, unidad = '') => v == null ? '–' : `${num(v)}${unidad}`;
  const con = (v, signo = '') => v == null ? '–' : `${v ? signo : ''}${num(Math.abs(v))}`;
  const widget = (titulo, v, unidad, sub, color, ayuda) => `<div class="col-6 col-lg-3"><div class="card h-100" style="border-top:3px solid ${color}">
    <div class="card-body py-3"><div class="small text-body-secondary">${esc(titulo)}${iconoAyuda(ayuda)}</div>
    <div class="fs-4 fw-semibold tabular">${v} <span class="fs-6 fw-normal text-body-secondary">${esc(unidad)}</span></div>
    <div class="small text-body-secondary">${esc(sub)}</div></div></div></div>`;
  const c = d.casa;
  $('#mt-resumen').innerHTML =
    widget(t('met.pierde'), con(c.hum_caida, '−'), t('met.puntos'), t('met.n_aperturas', { n: c.n_hum }), 'var(--cui-info)', t('met.pierde_ayuda')) +
    widget(t('met.recupera'), con(c.hum_recupera, '+'), t('met.puntos_h'), t('met.n_aperturas', { n: c.n_hum_recupera }), 'var(--cui-info)', t('met.recupera_ayuda')) +
    widget(t('met.enfria'), con(c.temp_caida, '−'), '°C', t('met.n_aperturas', { n: c.n_temp }), 'var(--cui-warning)', t('met.enfria_ayuda')) +
    widget(t('met.noche'), c.noche_caida == null ? '–' : `${c.noche_caida > 0 ? '−' : '+'}${num(Math.abs(c.noche_caida))}`, '°C', t('met.n_noches', { n: c.n_noches }), 'var(--cui-warning)', t('met.noche_ayuda'));
  const encabezado = col => `<th class="text-end">${esc(t(col[0]))}${col[1] ? iconoAyuda(t(col[1])) : ''}</th>`;
  const sala = s => `<td><span class="d-inline-flex align-items-center gap-2">${punto(s.sensor)}${esc(nombreDe(s.sensor))}</span></td>`;
  const vacio = n => `<tr><td colspan="${n}" class="text-center text-body-secondary py-4">${t('sin_datos')}</td></tr>`;
  const conDatos = clave => d.sensores.filter(s => s[clave] > 0);
  $('#mt-humedad').innerHTML = `<thead><tr><th>${t('habitacion')}</th>${[['met.col_aperturas'], ['met.col_pierde', 'met.pierde_ayuda'], ['met.col_velocidad', 'met.velocidad_ayuda'], ['met.col_recupera', 'met.recupera_ayuda']].map(encabezado).join('')}</tr></thead><tbody>` +
    (conDatos('n_hum').map(s => `<tr>${sala(s)}<td class="text-end">${entero(s.n_hum)}</td><td class="text-end">${con(s.hum_caida, '−')}</td>
      <td class="text-end">${valor(s.hum_por_min)}</td><td class="text-end">${con(s.hum_recupera, '+')} <span class="small text-body-secondary">(${entero(s.n_hum_recupera)})</span></td></tr>`).join('') || vacio(5)) + '</tbody>';
  $('#mt-temperatura').innerHTML = `<thead><tr><th>${t('habitacion')}</th>${[['met.col_aperturas'], ['met.col_enfria', 'met.enfria_ayuda'], ['met.col_temp_recupera', 'met.temp_recupera_ayuda'], ['met.col_noches'], ['met.col_noche', 'met.noche_ayuda'], ['met.col_afuera']].map(encabezado).join('')}</tr></thead><tbody>` +
    (d.sensores.filter(s => s.n_temp > 0 || s.n_noches > 0).map(s => `<tr>${sala(s)}<td class="text-end">${entero(s.n_temp)}</td><td class="text-end">${con(s.temp_caida, '−')}</td>
      <td class="text-end">${s.temp_recupera == null ? '–' : `${s.temp_recupera >= 0 ? '+' : '−'}${num(Math.abs(s.temp_recupera))}`}</td><td class="text-end">${entero(s.n_noches)}</td>
      <td class="text-end">${s.noche_caida == null ? '–' : `${s.noche_caida > 0 ? '−' : '+'}${num(Math.abs(s.noche_caida))}`}</td><td class="text-end">${valor(s.noche_afuera, ' °C')}</td></tr>`).join('') || vacio(7)) + '</tbody>';
}

// Niveles de señal (linkquality de 0 a 255): verde desde 100, amarillo desde 40, rojo por debajo
function iconoSenal(lq) {
  if (lq == null) return '–';
  const barras = lq >= 150 ? 4 : lq >= 100 ? 3 : lq >= 60 ? 2 : lq >= 30 ? 1 : 0;
  const color = lq >= 100 ? 'text-success' : lq >= 40 ? 'text-warning' : 'text-danger';
  return `<span class="tabular text-nowrap"><i class="cil-wifi-signal-${barras} ${color} me-1"></i>${entero(lq)}</span>`;
}

function renderSenales() {
  const insignia = { online: ['success', 'sen.conectado'] };
  const zigbee = estado.sensores.filter(s => !s.manual);
  $('#a-senales').innerHTML = zigbee.length ? zigbee.map(s => {
    const [color, texto] = insignia[s.conexion] || ['secondary', 'sen.desconocido'];
    const ultima = s.corte?.ultima_lectura || s.ultima_lectura;
    return `<tr>
      <td class="text-nowrap">${punto(s.id)} ${esc(nombreDe(s.id))}</td>
      <td>${s.conexion === 'offline' ? insigniaSinSenal() : `<span class="badge text-bg-${color}">${t(texto)}</span>`}</td>
      <td>${iconoSenal(s.corte?.linkquality ?? s.linkquality)}</td>
      <td class="tabular d-none d-md-table-cell">${s.bateria != null ? `${entero(s.bateria)} %` : '–'}</td>
      <td class="small text-nowrap" title="${esc(fmtFechaHora(ultima))}">${ultima ? hace(ultima) : '–'}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="5" class="text-body-secondary">${t('aj.no_sensores')}</td></tr>`;
}

async function cargarCortes() {
  const cortes = await api('/api/cortes');
  $('#a-cortes').innerHTML = cortes.length ? cortes.map(c => {
    const inicio = c.ultima_lectura || c.desde;
    return `<tr>
      <td class="text-nowrap">${punto(c.sensor)} ${esc(nombreDe(c.sensor))}</td>
      <td class="small text-nowrap tabular">${esc(fmtFechaHora(c.ultima_lectura)) || '–'}</td>
      <td class="small text-nowrap tabular">${esc(fmtFechaHora(c.desde))}</td>
      <td class="small text-nowrap tabular">${c.hasta ? esc(fmtFechaHora(c.hasta)) : `<span class="text-danger">${t('sen.sigue')}</span>`}</td>
      <td class="small text-nowrap">${duracion(inicio, c.hasta)}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="5" class="text-body-secondary">${t('sen.sin_cortes')}</td></tr>`;
  paginarTabla('#a-cortes');
}

async function cargarVivienda() {
  const d = await api('/api/vivienda');
  const v = d.vivienda, valor = x => x == null ? '' : x;
  $('#v-es-dpto').checked = v.es_departamento;
  $('#v-m2-total').value = valor(v.m2_total);
  $('#v-m2-edificio').value = valor(v.m2_edificio);
  $('#v-m2-medidores').innerHTML = d.medidores.length ? d.medidores.map(m => `<div class="col-6 col-md-3"><label class="form-label small">${esc(m.nombre)}
      <div class="input-group input-group-sm"><input type="number" class="form-control" min="0" step="0.1" data-m2="${esc(m.id)}" value="${esc(valor(v.m2_medidores[m.id]))}"><span class="input-group-text">m²</span></div></label></div>`).join('')
    : `<div class="col-12 text-body-secondary small">${t('cons.sin_medidores')}</div>`;
  const campo = (p, c, clase = '') => `<td class="${clase}"><input type="number" class="form-control form-control-sm text-end" min="0" step="any" data-periodo="${esc(p.id)}" data-campo="${c}" value="${esc(valor(d.facturas[p.id]?.[c]))}" aria-label="${esc(`${p.nombre} ${t('viv.' + c)}`)}"></td>`;
  $('#v-facturas').innerHTML = `<thead><tr><th>${t('per.periodo')}</th><th class="text-end">${t('viv.kwh_vivienda')}</th><th class="text-end">${t('viv.unidades_vivienda')}</th><th class="text-end solo-dpto">${t('viv.kwh_edificio')}</th><th class="text-end solo-dpto">${t('viv.unidades_edificio')}</th><th class="text-end">${t('viv.precio_kwh')}</th><th class="text-end">${t('viv.pagado')}</th></tr></thead><tbody>` +
    d.periodos.slice().reverse().map(p => `<tr><td>${esc(p.nombre)}</td>${campo(p, 'kwh_vivienda')}${campo(p, 'unidades_vivienda')}${campo(p, 'kwh_edificio', 'solo-dpto')}${campo(p, 'unidades_edificio', 'solo-dpto')}${campo(p, 'precio_kwh')}${campo(p, 'pagado')}</tr>`).join('') + '</tbody>';
  mostrarCamposDpto();
}
function mostrarCamposDpto() {
  $('#v-m2-total-titulo').textContent = t($('#v-es-dpto').checked ? 'viv.m2_dpto' : 'viv.m2_casa');
  document.querySelectorAll('#tab-ajustes .solo-dpto').forEach(el => { el.hidden = !$('#v-es-dpto').checked; });
}
$('#v-es-dpto').addEventListener('change', mostrarCamposDpto);
$('#v-guardar').addEventListener('click', async () => {
  const facturas = {}, m2_medidores = {};
  document.querySelectorAll('#v-facturas input').forEach(i => { (facturas[i.dataset.periodo] ??= {})[i.dataset.campo] = i.value; });
  document.querySelectorAll('#v-m2-medidores input').forEach(i => { m2_medidores[i.dataset.m2] = i.value; });
  try {
    await api('/api/vivienda', { method: 'PUT', body: { es_departamento: $('#v-es-dpto').checked, m2_total: $('#v-m2-total').value, m2_edificio: $('#v-m2-edificio').value, m2_medidores, facturas } });
    aviso(t('aj.guardados'), 'success');
  } catch (err) { aviso(err.message); }
});

function renderSensoresAjustes() {
  renderSenales();
  cargarCortes().catch(() => {});
}

function renderAjustes() {
  renderSensoresAjustes();
  cargarVivienda().catch(err => aviso(err.message));
  $('#a-habitaciones').innerHTML = estado.sensores.length ? estado.sensores.map(s => `<div class="mb-3">
      <div class="input-group">
        <span class="input-group-text">${punto(s.id)}</span>
        <input class="form-control" data-id="${esc(s.id)}" value="${esc(s.nombre_configurado)}" placeholder="${esc(t('sensor'))} ${esc(s.id.slice(-4))}" maxlength="40" aria-label="${esc(s.id)}">
      </div>
      <div class="form-text tabular">${esc(s.id)} · ${num(s.temperatura)} °C · ${s.ultima_lectura ? t('aj.ultima', { h: hace(s.ultima_lectura) }) : t('aj.sin_lecturas')}
        ${s.manual ? '' : `· <a href="#" data-a-manual="${esc(s.id)}">${t('manual.pasar_manual')}</a>`}
        ${s.manual && estado.sensores.some(x => !x.manual) ? `<select class="form-select form-select-sm mt-1" data-destino="${esc(s.id)}" aria-label="${esc(t('manual.vincular'))}">
          <option value="">${esc(t('manual.vincular'))}…</option>
          ${estado.sensores.filter(x => !x.manual).map(x => `<option value="${esc(x.id)}">${esc(x.nombre_configurado || x.id)} (${esc(x.id.slice(-4))})</option>`).join('')}
        </select>` : ''}</div>
    </div>`).join('') : `<p class="text-body-secondary">${t('aj.no_sensores')}</p>`;
  const ms = manuales();
  const autos = estado.sensores.filter(x => !x.manual);
  $('#a-manuales').innerHTML = ms.length ? ms.map(s => `<li class="list-group-item d-flex align-items-center gap-2 flex-wrap">
      ${punto(s.id)}<span class="flex-grow-1 text-truncate">${esc(nombreDe(s.id))}</span>
      ${autos.length ? `<select class="form-select form-select-sm w-auto" data-destino="${esc(s.id)}" aria-label="${esc(t('manual.vincular'))}">
        <option value="">${esc(t('manual.vincular'))}…</option>
        ${autos.map(x => `<option value="${esc(x.id)}">${esc(x.nombre_configurado || x.id)} (${esc(x.id.slice(-4))})</option>`).join('')}
      </select>` : ''}
      <button class="btn btn-sm btn-ghost-danger" data-borrar-manual="${esc(s.id)}" title="${esc(t('borrar'))}" aria-label="${esc(t('borrar'))}"><i class="cil-trash"></i></button>
    </li>`).join('') : `<li class="list-group-item small text-body-secondary">${t('manual.ninguno')}</li>`;
  $('#a-intervalo').value = estado.intervalo_minutos;
  $('#a-vivo').value = estado.segundos_vivo;
  $('#a-mudanza').value = estado.fecha_mudanza || '';
  $('#a-temp-min').value = estado.temp_ref?.min ?? 18;
  $('#a-temp-max').value = estado.temp_ref?.max ?? 22;
  $('#a-hum-min').value = estado.humedad_ref?.min ?? 40;
  $('#a-hum-max').value = estado.humedad_ref?.max ?? 60;
  $('#a-ubic-actual').textContent = nombreUbicacion();
  $('#a-resultados').innerHTML = '';
  ubicPendiente = null;
}

async function buscarUbicacion() {
  const q = $('#a-buscar').value.trim();
  if (q.length < 2) return;
  $('#a-resultados').innerHTML = `<div class="list-group-item text-body-secondary">${t('aj.buscando')}</div>`;
  try {
    const res = await api('/api/buscar_ubicacion?' + new URLSearchParams({ q, idioma }));
    $('#a-resultados').innerHTML = res.length
      ? res.map((r, n) => `<button type="button" class="list-group-item list-group-item-action" data-n="${n}"><i class="cil-location-pin me-2"></i>${esc(r.nombre)}</button>`).join('')
      : `<div class="list-group-item text-body-secondary">${t('aj.sin_resultados')}</div>`;
    $('#a-resultados').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      ubicPendiente = res[b.dataset.n];
      $('#a-ubic-actual').innerHTML = `${esc(ubicPendiente.nombre)} <span class="badge text-bg-warning">${t('aj.sin_guardar')}</span>`;
      $('#a-resultados').innerHTML = '';
    };
  } catch (err) { $('#a-resultados').innerHTML = `<div class="list-group-item text-danger">${esc(err.message)}</div>`; }
}
$('#a-buscar-btn').addEventListener('click', buscarUbicacion);

async function crearManual() {
  const nombre = $('#a-manual-nombre').value.trim();
  if (!nombre) return $('#a-manual-nombre').focus();
  if (!await confirmar(t('conf.nuevo'), { detalle: nombre })) return;
  try {
    await api('/api/sensores_manuales', { method: 'POST', body: { nombre } });
    $('#a-manual-nombre').value = '';
    await cargarEstado();
    renderAjustes();
    aviso(t('manual.creado'), 'success');
  } catch (err) { aviso(err.message); }
}
$('#a-manual-crear').addEventListener('click', crearManual);
$('#a-manual-nombre').addEventListener('keydown', e => { if (e.key === 'Enter') crearManual(); });
$('#a-manuales').addEventListener('click', async e => {
  const b = e.target.closest('[data-borrar-manual]');
  if (!b || !await confirmar(t('manual.confirmar_borrar', { n: nombreDe(b.dataset.borrarManual) }), { peligro: true })) return;
  try {
    await api(`/api/sensores_manuales/${b.dataset.borrarManual}`, { method: 'DELETE' });
    await cargarEstado();
    renderAjustes();
    tempCargadas = false;
    aviso(t('manual.borrado'), 'success');
  } catch (err) { aviso(err.message); }
});
const vincularManual = async e => {
  const sel = e.target.closest('[data-destino]');
  if (!sel || !sel.value) return;
  const origen = sel.dataset.destino, destino = sel.value;
  if (!await confirmar(t('manual.confirmar_vincular', { n: nombreDe(origen), d: destino }))) { sel.value = ''; return; }
  try {
    await api(`/api/sensores_manuales/${origen}/automatico`, { method: 'POST', body: { destino } });
    await cargarEstado();
    renderAjustes();
    tempCargadas = false;
    aviso(t('manual.vinculado'), 'success');
  } catch (err) { aviso(err.message); }
};
$('#a-manuales').addEventListener('change', vincularManual);
$('#a-habitaciones').addEventListener('change', vincularManual);
$('#a-habitaciones').addEventListener('click', async e => {
  const a = e.target.closest('[data-a-manual]');
  if (!a) return;
  e.preventDefault();
  const id = a.dataset.aManual;
  if (!await confirmar(t('manual.confirmar_pasar', { n: nombreDe(id) }))) return;
  try {
    await api(`/api/sensores_manuales/convertir/${id}`, { method: 'POST' });
    await cargarEstado();
    renderAjustes();
    tempCargadas = false;
    aviso(t('manual.pasado'), 'success');
  } catch (err) { aviso(err.message); }
});
$('#a-buscar').addEventListener('keydown', e => { if (e.key === 'Enter') buscarUbicacion(); });

$('#a-guardar').addEventListener('click', async () => {
  const habitaciones = {};
  document.querySelectorAll('#a-habitaciones input').forEach(i => { if (i.value.trim()) habitaciones[i.dataset.id] = i.value.trim(); });
  const body = { habitaciones, intervalo_minutos: Number($('#a-intervalo').value), segundos_vivo: Number($('#a-vivo').value),
                 humedad_ref: { min: Number($('#a-hum-min').value), max: Number($('#a-hum-max').value) },
                 temp_ref: { min: Number($('#a-temp-min').value), max: Number($('#a-temp-max').value) },
                 fecha_mudanza: $('#a-mudanza').value };
  if (ubicPendiente) body.ubicacion = ubicPendiente;
  if (!await confirmar(t('conf.ajustes'))) return;
  try {
    await api('/api/config', { method: 'PUT', body });
    await cargarEstado();
    renderAjustes();
    tempCargadas = false;
    aviso(t('aj.guardados'), 'success');
    redibujarGraficos();
    if (body.ubicacion) setTimeout(() => cargarEstado().catch(() => {}), 3000);
  } catch (err) { aviso(err.message); }
});

// ======================================================================
//  Arranque
// ======================================================================
async function refrescar() {
  await cargarEstado();
  const tab = tabActual();
  if (tab === 'panel') cargarGraficoPanel().catch(err => aviso(err.message));
  if (tab === 'ventanas') cargarVentanas();
  if (tab === 'termostatos') cargarTermostatos();
  if (tab === 'temperaturas') cargarTemperaturas();
}

(async () => {
  prepararFechas();
  traducirPagina();
  guardarIdioma();
  aplicarTema(leerTema());
  $('#t-hasta').value = $('#v-hasta').value = fechaInput(new Date());
  $('#t-desde').value = fechaInput(new Date(Date.now() - 6 * DIA));
  $('#v-desde').value = fechaInput(new Date(Date.now() - 29 * DIA));
  $('#tm-hasta').value = fechaInput(new Date());
  $('#tm-desde').value = fechaInput(new Date(Date.now() - 29 * DIA));
  $('#cs-hasta').value = fechaInput(new Date());
  $('#cs-desde').value = `${new Date().getFullYear()}-01-01`;
  $('#ag-hasta').value = fechaInput(new Date());
  $('#ag-desde').value = fechaInput(new Date(Date.now() - 29 * DIA));
  try { await cargarEstado(); } catch (err) { aviso(err.message); }
  mostrarTab();
  programarVivo();
  setInterval(() => { if (!document.hidden) actualizarTiemposVivos(); }, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) actualizarTiemposVivos(); });
  setInterval(() => { if (!document.hidden && tabActual() === 'panel') cargarGraficoPanel().catch(() => {}); }, 5 * 60000);
})();
