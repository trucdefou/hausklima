<script>
  // Applies the theme before painting to avoid flicker
  (() => {
    let t = 'auto';
    try { t = localStorage.getItem('theme') || 'auto'; } catch (e) {}
    const real = t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
    document.documentElement.setAttribute('data-coreui-theme', real);
  })();
</script>

<style>
  /* Transition when switching sections and loading bar while data is requested */
  @keyframes entry { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  [id^="tab-"]:not([hidden]) { animation: entry .3s ease-out; }
  [id^="tab-"] { transition: opacity .2s; }
  body.loading [id^="tab-"]:not([hidden]) { opacity: .55; pointer-events: none; }

  #bar-load.active { opacity: 1; }

  .temp-large { font-size: 2.1rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.5px; line-height: 1.1; }
  .point { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .card-room { border-top-width: 3px; }
  .card-room.open { box-shadow: 0 0 0 2px var(--cui-warning); }
  .chart { position: relative; height: 320px; }
  .tabular { font-variant-numeric: tabular-nums; }
  .table td, .table th { white-space: nowrap; }
  .table td.note { white-space: normal; min-width: 7rem; max-width: 16rem; overflow-wrap: anywhere; }
  .note-short { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }

  .flatpickr-day.selected, .flatpickr-day.selected:hover { background: var(--cui-primary); border-color: var(--cui-primary); }
  [data-coreui-theme=dark] .flatpickr-calendar { background: var(--cui-tertiary-bg); box-shadow: 0 3px 13px rgba(0,0,0,.5); }
  [data-coreui-theme=dark] .flatpickr-calendar.arrowTop:after { border-bottom-color: var(--cui-tertiary-bg); }
  [data-coreui-theme=dark] .flatpickr-calendar.arrowBottom:after { border-top-color: var(--cui-tertiary-bg); }
  [data-coreui-theme=dark] .flatpickr-months .flatpickr-month, [data-coreui-theme=dark] .flatpickr-current-month,
  [data-coreui-theme=dark] span.flatpickr-weekday, [data-coreui-theme=dark] .flatpickr-day, [data-coreui-theme=dark] .flatpickr-time input,
  [data-coreui-theme=dark] .flatpickr-time .flatpickr-time-separator { color: var(--cui-body-color); fill: var(--cui-body-color); }
  [data-coreui-theme=dark] .flatpickr-months .flatpickr-prev-month svg, [data-coreui-theme=dark] .flatpickr-months .flatpickr-next-month svg { fill: var(--cui-body-color); }
  [data-coreui-theme=dark] .flatpickr-current-month .flatpickr-monthDropdown-months { background: var(--cui-tertiary-bg); }
  [data-coreui-theme=dark] .flatpickr-day.prevMonthDay, [data-coreui-theme=dark] .flatpickr-day.nextMonthDay { color: var(--cui-secondary-color); }
  [data-coreui-theme=dark] .flatpickr-day:hover, [data-coreui-theme=dark] .flatpickr-time input:hover { background: var(--cui-secondary-bg); }
  [data-coreui-theme=dark] .flatpickr-time { border-top-color: var(--cui-border-color); }
  /* On touch screens charts start locked (the page can be scrolled over them); touching activates them */
  .chart-veil, .chart-done { display: none; }
  @media (pointer: coarse) {
    .chart:not(.active) .chart-veil { display: flex; position: absolute; inset: 0; z-index: 2; align-items: center; justify-content: center;
                                          touch-action: pan-y pinch-zoom; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .chart-veil .badge { opacity: .85; pointer-events: none; }
    .chart.active { outline: 2px solid var(--cui-primary); outline-offset: 4px; border-radius: 2px; }
    .chart.active .chart-done { display: inline-flex; align-items: center; gap: .25rem; position: absolute; top: -.25rem; right: 0; z-index: 2; }
  }
  /* Full screen for a chart: only the card (header with controls + chart) fills the screen */
  .card.screen-full { position: fixed; inset: 0; z-index: 1060; margin: 0 !important; width: 100vw; height: 100vh; height: 100dvh !important;
                            border-radius: 0; border: 0; display: flex; flex-direction: column; }
  .card.screen-full > .card-header { flex: none; flex-wrap: nowrap !important; overflow-x: auto; padding: .35rem .75rem;
                                           padding-left: max(.75rem, env(safe-area-inset-left)); padding-right: max(.75rem, env(safe-area-inset-right)); }
  .card.screen-full > .card-header > *, .card.screen-full > .card-header .d-flex { flex-wrap: nowrap !important; flex-shrink: 0; white-space: nowrap; }
  .card.screen-full > .card-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: .5rem;
                                         padding-left: max(.5rem, env(safe-area-inset-left)); padding-right: max(.5rem, env(safe-area-inset-right));
                                         padding-bottom: max(.5rem, env(safe-area-inset-bottom)); }
  .card.screen-full > .card-body > :not(.chart), .card.screen-full > :not(.card-header):not(.card-body) { display: none !important; }
  .card.screen-full [data-screen] { position: sticky; right: 0; z-index: 1; margin-left: auto;
                                           background: var(--cui-body-bg); box-shadow: -.75rem 0 .5rem -.25rem var(--cui-body-bg); }
  .card.screen-full .chart { flex: 1 1 auto; height: auto; min-height: 0; outline: 0; }
  .card.screen-full .chart-veil, .card.screen-full .chart-done { display: none !important; }
  body.conn-screen-full { overflow: hidden; }
  .toast-rotate { display: none; }
  @media (pointer: coarse) and (orientation: portrait) {
    .card.screen-full .toast-rotate { display: flex; position: absolute; left: 50%; bottom: max(1rem, env(safe-area-inset-bottom)); transform: translateX(-50%);
                                           z-index: 3; align-items: center; gap: .4rem; pointer-events: none; white-space: nowrap; }
  }

  /* Utility classes such as d-flex use !important and would override the hidden attribute */
  [data-settings-section][hidden] { display: none !important; }
  .modal-backdrop.conf-backdrop { z-index: 1065; }
</style>

const LANGS = Object.keys(I18N);

function initialLang() {
  let i = null;
  try { i = localStorage.getItem('lang'); } catch (e) {}
  if (LANGS.includes(i)) return i;
  for (const l of navigator.languages || [navigator.language]) {
    const short = (l || '').slice(0, 2).toLowerCase();
    if (LANGS.includes(short)) return short;
  }
  return 'es';
}
let lang = initialLang();

function t(key, params = {}) {
  const txt = I18N[lang][key] ?? I18N.es[key] ?? key;
  return txt.replace(/\{(\w+)\}/g, (_, k) => params[k] ?? '');
}

const $ = s => document.querySelector(s);

// ---------- Charts on touch screens ----------
// A transparent "veil" sits on top of each chart so the page can be scrolled. Touching it activates the chart
// (two-finger zoom, drag, view values) until "Done" is touched or anywhere outside its card.
document.querySelectorAll('.chart').forEach(g => g.insertAdjacentHTML('beforeend',
  `<div class="chart-veil"><span class="badge text-bg-secondary fw-normal"><i class="cil-touch-app me-1"></i><span data-i18n="chart.touch"></span></span></div>
   <button type="button" class="btn btn-sm btn-primary chart-done"><i class="cil-check-alt"></i><span data-i18n="chart.done"></span></button>`));
// ---------- Full screen ----------
// Button in the header of each card with a chart. Tries real full screen + rotating to landscape
// (Android/Chrome); where the browser does not allow it (iPhone) the card still fills the screen and,
// if the phone is in portrait, it asks to rotate it.
document.querySelectorAll('.chart').forEach(g => {
  const card = g.closest('.card'), cab = card?.querySelector(':scope > .card-header');
  if (!cab) return;
  cab.classList.add('d-flex', 'align-items-center', 'gap-2');
  cab.insertAdjacentHTML('beforeend', `<button type="button" class="btn btn-sm btn-ghost-secondary ${cab.querySelector('.ms-auto, .flex-grow-1') ? '' : 'ms-auto'}" data-screen
      data-i18n-aria="chart.screen" data-i18n-title="chart.screen"><i class="cil-fullscreen"></i></button>`);
  g.insertAdjacentHTML('beforeend', `<span class="toast-rotate badge text-bg-dark fw-normal"><i class="cil-screen-smartphone"></i><span data-i18n="chart.rotate"></span></span>`);
});
const fullElement = () => document.fullscreenElement || document.webkitFullscreenElement;
async function enterFullScreen(card) {
  card.classList.add('screen-full');
  document.body.classList.add('conn-screen-full');
  card.querySelector('.chart')?.classList.add('active');   // in full screen the chart is used directly
  updateFullScreenButton(card);
  try {
    if (card.requestFullscreen) await card.requestFullscreen({ navigationUI: 'hide' });
    else if (card.webkitRequestFullscreen) card.webkitRequestFullscreen();
  } catch (e) { /* no real full screen: the card keeps filling the whole window */ }
  try { await screen.orientation?.lock?.('landscape'); } catch (e) { /* cannot rotate by itself: the notice is shown */ }
}
function exitFullScreen(card) {
  card.classList.remove('screen-full');
  document.body.classList.remove('conn-screen-full');
  const g = card.querySelector('.chart');
  if (g) deactivateChart(g);
  updateFullScreenButton(card);
  try { screen.orientation?.unlock?.(); } catch (e) {}
  if (fullElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document).catch?.(() => {});
}
function updateFullScreenButton(card) {
  const b = card.querySelector('[data-screen]'), on = card.classList.contains('screen-full');
  b.dataset.i18nAria = b.dataset.i18nTitle = on ? 'chart.exit_fullscreen' : 'chart.screen';
  b.title = t(b.dataset.i18nTitle);
  b.setAttribute('aria-label', b.title);
  b.innerHTML = `<i class="cil-${on ? 'fullscreen-exit' : 'fullscreen'}"></i>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-screen]');
  if (!b) return;
  const card = b.closest('.card');
  if (card.classList.contains('screen-full')) exitFullScreen(card); else enterFullScreen(card);
});
// Leaving with the browser "back" button/Esc also closes the view
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => {
  if (fullElement()) return;
  document.querySelectorAll('.card.screen-full').forEach(exitFullScreen);
}));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.querySelector('.modal.show')) document.querySelectorAll('.card.screen-full').forEach(exitFullScreen);
});

function deactivateChart(g) {
  g.classList.remove('active');
  const ch = Chart.getChart(g.querySelector('canvas'));
  if (ch) { ch.setActiveElements([]); ch.tooltip?.setActiveElements([], { x: 0, y: 0 }); ch.update('none'); }   // no stuck tooltip
}
document.addEventListener('click', e => {
  const veil = e.target.closest('.chart-veil');
  if (veil) {
    document.querySelectorAll('.chart.active').forEach(deactivateChart);
    veil.closest('.chart').classList.add('active');
    return;
  }
  const done = e.target.closest('.chart-done');
  if (done) deactivateChart(done.closest('.chart'));
});
document.addEventListener('pointerdown', e => {
  document.querySelectorAll('.chart.active').forEach(g => {
    if (!(g.closest('.card') || g).contains(e.target)) deactivateChart(g);   // controls in the same card do not close it
  });
});

function translatePage() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  $('#lang-current').textContent = lang.toUpperCase();
  renderControls();
  document.title = t('app.title');
}

const modalReading = coreui.Modal.getOrCreateInstance($('#dlg-reading'));
const modalThermo = coreui.Modal.getOrCreateInstance($('#dlg-thermo'));
let signatureWindows = null;
const sidebar = () => coreui.Sidebar.getOrCreateInstance($('#sidebar'));

const pad = n => String(n).padStart(2, '0');
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const dateInput = d => isoLocal(d).slice(0, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v, dec = 1) => (v === '' || v == null || isNaN(v)) ? '–'
  : Number(v).toLocaleString(lang, { minimumFractionDigits: dec, maximumFractionDigits: dec });
const whole = n => Number(n).toLocaleString(lang);
// Dates always in German format (DD.MM.YYYY, 24 h), regardless of the language
const fmtDate = d => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
const fmtDayMonth = d => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.`;
const fmtTime24 = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtDateTime = s => { if (!s) return ''; const d = new Date(s); return `${fmtDate(d)} ${fmtTime24(d)}`; };
function minutesText(min) {
  min = Math.max(0, Math.round(min));
  return min < 60 ? t('t.min', { n: min }) : t('t.hmin', { h: Math.floor(min / 60), m: pad(min % 60) });
}
const durationText = (a, b) => minutesText(((b ? new Date(b) : new Date()) - new Date(a)) / 6e4);
function agoText(s) {
  const min = Math.round((Date.now() - new Date(s)) / 6e4);
  if (min < 1) return t('t.recent');
  if (min < 60 * 24) return t('t.ago', { x: minutesText(min) });
  return t('t.ago', { x: t('t.days', { n: Math.floor(min / 1440) }) });
}
// "Live" versions: they return a <span> that updateLiveTimes() refreshes without reloading the page
// Stopwatch for what is still open: m:ss, or h:mm:ss from one hour on
function stopwatch(a) {
  const sec = Math.max(0, Math.floor((Date.now() - new Date(a)) / 1000));
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, ss = pad(sec % 60);
  return h ? `${h}:${pad(m)}:${ss}` : `${m}:${ss}`;
}
const duration = (a, b) => b ? durationText(a, b)
  : `<span class="tabular" data-live="dur" data-since="${esc(a)}">${stopwatch(a)}</span>`;
const ago = s => `<span data-live="ago" data-since="${esc(s)}">${agoText(s)}</span>`;
function updateLiveTimes() {
  for (const el of document.querySelectorAll('[data-live]')) {
    const txt = el.dataset.live === 'dur' ? stopwatch(el.dataset.since) : agoText(el.dataset.since);
    if (el.textContent !== txt) el.textContent = txt;
  }
}
// Place name in the active language (old configurations only have "name")
const placeName = () => state.place?.names?.[lang] || state.place?.name || '';

function nameOf(id) {
  if (id === 'outdoor') return t('outdoor');
  return state.sensors.find(s => s.id === id)?.configured_name || `${t('sensor')} ${id.slice(-4)}`;
}
const isManual = id => !!state.sensors.find(s => s.id === id)?.manual;
const manual_sensors = () => state.sensors.filter(s => s.manual);
const point = id => `<span class="point" style="background:${colorDe[id] || '#999'}"></span>`;

function weather(c) {
  const f = (icon, key) => `<i class="${icon}"></i> ${t(key)}`;
  if (c == null) return '';
  if (c === 0) return f('cil-sun', 'w.0');
  if (c === 1) return f('cil-sun', 'w.1');
  if (c === 2) return f('cil-cloudy', 'w.2');
  if (c === 3) return f('cil-cloud', 'w.3');
  if (c === 45 || c === 48) return f('cil-blur-linear', 'w.fog');
  if (c >= 51 && c <= 57) return f('cil-rain', 'w.drizzle');
  if (c >= 61 && c <= 67) return f('cil-rain', 'w.rain');
  if (c >= 71 && c <= 77) return f('cil-snowflake', 'w.snow');
  if (c >= 80 && c <= 82) return f('cil-rain', 'w.showers');
  if (c >= 85 && c <= 86) return f('cil-snowflake', 'w.showers_snow');
  if (c >= 95) return f('cil-bolt', 'w.storm');
  return '';
}

// Date fields: the browser picker uses the format of its configuration (e.g. MM/DD/YYYY);
// replaced by flatpickr to always show DD.MM.YYYY and 24 h. The internal value is still ISO
// (YYYY-MM-DD or YYYY-MM-DDTHH:MM), so the rest of the code reads and writes .value as before.
const nativeValue = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
const calendarLocale = () => ({ ...((window.flatpickr && flatpickr.l10ns[lang]) || {}), firstDayOfWeek: 1 });
function prepareDate(el) {
  if (!window.flatpickr || el._flatpickr || !['date', 'datetime-local'].includes(el.type)) return;
  const withTime = el.type === 'datetime-local';
  flatpickr(el, {
    altInput: true, allowInput: true, disableMobile: true, time_24hr: true, enableTime: withTime,
    // in 1-minute steps: with the default step (5) the calendar minutes field, which inside a modal
    // ends up inside the <form>, is invalid if the time is not a multiple of 5 and the browser blocks submission silently
    minuteIncrement: 1,
    dateFormat: withTime ? 'Y-m-d\\TH:i' : 'Y-m-d', altFormat: withTime ? 'd.m.Y H:i' : 'd.m.Y',
    locale: calendarLocale(),
    static: !!el.closest('.modal'),          // inside a modal, the calendar goes next to the field
  });
  // if the code assigns .value, the visible field updates by itself
  let syncing = false;
  Object.defineProperty(el, 'value', {
    configurable: true,
    get() { return nativeValue.get.call(this); },
    set(v) {
      nativeValue.set.call(this, v);
      if (syncing || !this._flatpickr) return;
      syncing = true;
      try { this._flatpickr.setDate(v || null, false); } finally { syncing = false; }
    },
  });
}
function prepareDates(root = document) {
  root.querySelectorAll?.('input[type=date], input[type=datetime-local]').forEach(prepareDate);
}
new MutationObserver(changes => changes.forEach(c => c.addedNodes.forEach(n => {
  if (n.nodeType !== 1) return;
  if (n.matches('input[type=date], input[type=datetime-local]')) prepareDate(n); else prepareDates(n);
}))).observe(document.body, { childList: true, subtree: true });

function toast(msg, kind = 'danger') {
  const el = document.createElement('div');
  el.className = `toast align-items-center text-bg-${kind} border-0`;
  el.setAttribute('role', 'alert');
  el.innerHTML = `<div class="d-flex"><div class="toast-body">${esc(msg)}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-coreui-dismiss="toast" aria-label="${esc(t('close'))}"></button></div>`;
  $('#toasts').append(el);
  el.addEventListener('hidden.coreui.toast', () => el.remove());
  coreui.Toast.getOrCreateInstance(el, { delay: 4000 }).show();
}

// Confirmation modal: returns a promise with true (confirmed) or false (cancelled).
// Resolves only once the modal has finished closing, so it does not clash with other modals.
const modalConfirm = coreui.Modal.getOrCreateInstance($('#dlg-confirm'));
let confirmPending = null;
function confirm(message, { detail = '', danger = false } = {}) {
  confirmPending?.resolver(false);
  $('#dlgc-message').textContent = message;
  $('#dlgc-detail').textContent = detail;
  $('#dlgc-detail').hidden = !detail;
  $('#dlgc-ok').textContent = t(danger ? 'delete' : 'conf.yes');
  $('#dlgc-ok').className = `btn ${danger ? 'btn-danger' : 'btn-primary'}`;
  return new Promise(resolver => {
    confirmPending = { resolver, ok: false };
    modalConfirm.show();
  });
}
$('#dlgc-ok').addEventListener('click', () => { if (confirmPending) confirmPending.ok = true; modalConfirm.hide(); });
$('#dlg-confirm').addEventListener('show.coreui.modal', () => setTimeout(() => {
  // in case it opens on top of another modal: its backdrop has to stay above the first one
  const backgrounds = document.querySelectorAll('.modal-backdrop');
  backgrounds[backgrounds.length - 1]?.classList.add('conf-backdrop');
}));
$('#dlg-confirm').addEventListener('shown.coreui.modal', () => $('#dlgc-ok').focus());
$('#dlg-confirm').addEventListener('hidden.coreui.modal', () => {
  if (document.querySelector('.modal.show')) document.body.classList.add('modal-open');   // the one below is still open
  const p = confirmPending;
  confirmPending = null;
  p?.resolver(p.ok);
});

// Loading bar: only appears if a request takes more than a moment, to avoid flicker on fast ones
let requests = 0, loadTimer = null;
function loadMore(n) {
  requests = Math.max(0, requests + n);
  if (requests > 0 && !loadTimer) {
    loadTimer = setTimeout(() => {
      $('#bar-load')?.classList.add('active');
      if (currentTab() !== 'panel') document.body.classList.add('loading');
    }, 150);
  } else if (requests === 0) {
    clearTimeout(loadTimer); loadTimer = null;
    $('#bar-load')?.classList.remove('active');
    document.body.classList.remove('loading');
  }
}
async function api(url, { silent, ...opts } = {}) {
  if (!silent) loadMore(1);
  try {
    const r = await fetch(url, {
      ...opts,
      headers: { 'Content-Type': 'application/json' },
      body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
    });
    if (r.status === 401) { location.href = '/login'; throw new Error(t('err.session')); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error ? t(d.error) : t('err.http', { n: r.status }));
    return d;
  } finally { if (!silent) loadMore(-1); }
}

// ======================================================================
//  Table pagination
// ======================================================================
const ROWS_PER_PAGE = 25;
const currentPage = {};   // table id -> page (from 0); kept when the data is refreshed

function pageOf(id, total) {
  const last = Math.max(Math.ceil(total / ROWS_PER_PAGE) - 1, 0);
  return currentPage[id] = Math.min(currentPage[id] || 0, last);
}

function drawPaginator(id, table, total, onChange) {
  const page = pageOf(id, total), pages = Math.ceil(total / ROWS_PER_PAGE);
  let nav = document.getElementById(`page-${id}`);
  if (!nav) {
    nav = document.createElement('div');
    nav.id = `page-${id}`;
    nav.className = 'd-flex flex-wrap justify-content-between align-items-center gap-2 px-3 py-2 small text-body-secondary border-top';
    (table.closest('.table-responsive') || table).after(nav);
    nav.addEventListener('click', e => {
      const b = e.target.closest('button[data-page]');
      if (!b || b.disabled) return;
      currentPage[id] = Number(b.dataset.page);
      nav.onChange();
    });
  }
  nav.onChange = onChange;
  nav.classList.toggle('d-none', total <= ROWS_PER_PAGE);
  nav.classList.toggle('d-flex', total > ROWS_PER_PAGE);
  const button = (text, key, target, active) => `<li class="page-item ${active ? '' : 'disabled'}">
    <button class="page-link" type="button" data-page="${target}" aria-label="${esc(t(key))}" title="${esc(t(key))}" ${active ? '' : 'disabled'}>${text}</button></li>`;
  nav.innerHTML = `<span class="tabular">${t('page.range', { a: whole(page * ROWS_PER_PAGE + 1), b: whole(Math.min((page + 1) * ROWS_PER_PAGE, total)), n: whole(total) })}</span>
    <ul class="pagination pagination-sm mb-0">
      ${button('«', 'page.first', 0, page > 0)}${button('‹', 'page.prev', page - 1, page > 0)}
      <li class="page-item disabled"><span class="page-link tabular">${t('page.page', { p: whole(page + 1), n: whole(pages) })}</span></li>
      ${button('›', 'page.next', page + 1, page < pages - 1)}${button('»', 'page.last', pages - 1, page < pages - 1)}
    </ul>`;
}

// For already drawn tables: hides the rows of the other pages (full table or its <tbody> directly)
function paginateTable(selector) {
  const el = $(selector), body = el.tagName === 'TBODY' ? el : el.tBodies[0], table = body.closest('table');
  const id = selector.slice(1), rows = [...body.rows];
  const show = () => {
    const since = pageOf(id, rows.length) * ROWS_PER_PAGE;
    rows.forEach((f, i) => { f.hidden = i < since || i >= since + ROWS_PER_PAGE; });
    drawPaginator(id, table, rows.length, show);
  };
  show();
}

// A new filter goes back to the first page
const resetPages = () => Object.keys(currentPage).forEach(k => delete currentPage[k]);
document.addEventListener('click', e => { if (e.target.closest('[id$="-apply"]')) resetPages(); }, true);
document.addEventListener('change', e => { if (e.target.matches('#md-filter, #en-meter, #en-period')) resetPages(); }, true);

//  Language and theme
// ======================================================================
function saveLang() {
  try { localStorage.setItem('lang', lang); } catch (e) {}
  document.cookie = `lang=${lang}; path=/; max-age=31536000; SameSite=Lax`;
}
function changeLang(newLang) {
  lang = newLang;
  saveLang();
  document.querySelectorAll('.flatpickr-input').forEach(i => i._flatpickr?.set('locale', calendarLocale()));
  translatePage();
  updateTitle();
  renderCards();
  fillSelects();
  footerAndHeader();
  const tab = currentTab();
  if (tab === 'settings') renderSettings();
  else if (tab === 'temperatures') loadTemperatures();
  else if (tab === 'windows') loadWindows();
  else if (tab === 'thermostats') loadThermostats();
  else if (tab === 'climate') loadClimate();
  else if (tab === 'energy' && energyView === 'annual') loadEnergy().catch(err => toast(err.message));
  else if (tab === 'readings') renderReadings();
  else if (tab === 'periods') renderPeriods();
  else if (tab === 'water') renderWater();
  redrawCharts();
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => changeLang(b.dataset.lang)));

function readTheme() { try { return localStorage.getItem('theme') || 'auto'; } catch (e) { return 'auto'; } }
function applyTheme(theme) {
  try { localStorage.setItem('theme', theme); } catch (e) {}
  const real = theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
  document.documentElement.setAttribute('data-coreui-theme', real);
  $('#icon-theme').className = 'fs-5 ' + ({ light: 'cil-sun', dark: 'cil-moon', auto: 'cil-contrast' }[theme]);
  document.querySelectorAll('[data-theme]').forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
  redrawCharts();
}
document.querySelectorAll('[data-theme]').forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.theme)));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (readTheme() === 'auto') applyTheme('auto'); });

$('#toggle-sidebar').addEventListener('click', () => sidebar().toggle());
$('#close-sidebar').addEventListener('click', () => sidebar().toggle());

// The hash is "#tab" or, for Settings, "#settings/section"
const hashParts = () => location.hash.slice(1).split('/');
function currentTab() { const x = hashParts()[0]; return TABS.includes(x) ? x : 'panel'; }
const SETTINGS_SECTIONS = ['general', 'sensors', 'home', 'references'];
function settingsSection() { const x = hashParts()[1]; return SETTINGS_SECTIONS.includes(x) ? x : 'general'; }
function updateTitle() {
  const tab = currentTab();
  $('#title-tab').textContent = t('nav.' + tab) + (tab === 'settings' ? ' · ' + t('settings.sec_' + settingsSection()) : '');
}
function toggleSettingsMenu(open) {
  $('#nav-settings').classList.toggle('show', open);
  $('#nav-settings .nav-group-toggle').setAttribute('aria-expanded', open);
}
$('#nav-settings .nav-group-toggle').addEventListener('click', e => {
  e.preventDefault();
  toggleSettingsMenu(!$('#nav-settings').classList.contains('show'));
});
// Old addresses (bookmarks, home screen shortcuts) of tabs merged into Energy: [tab, view]
const OLD_TABS = { consumption: ['energy', 'heating'], metrics: ['energy', 'annual'] };
let previousTab = null;
function showTab() {
  const old = OLD_TABS[location.hash.slice(1)];
  if (old) { saveEnergyView(old[1]); history.replaceState(null, '', '#' + old[0]); }
  const tab = currentTab(), section = settingsSection();
  const enteringTab = tab !== previousTab;
  previousTab = tab;
  TABS.forEach(x => $('#tab-' + x).hidden = x !== tab);
  document.querySelectorAll('[data-settings-section]').forEach(d => d.hidden = d.dataset.settingsSection !== section);
  document.querySelectorAll('.sidebar-nav a[data-tab]').forEach(a =>
    a.classList.toggle('active', a.dataset.tab === tab && (!a.dataset.section || a.dataset.section === section)));
  if (tab === 'settings') toggleSettingsMenu(true);
  updateTitle();
  if (innerWidth < 992 && $('#sidebar').classList.contains('show')) sidebar().hide();
  // Moving between Settings sections keeps the page as it is, so unsaved edits are not lost
  if (tab === 'settings' && !enteringTab) return scrollTo(0, 0);
  if (tab === 'temperatures' && !temperaturesLoaded) loadTemperatures();
  if (tab === 'windows') loadWindows();
  if (tab === 'thermostats') loadThermostats();
  if (tab === 'readings') showReadings();
  if (tab === 'energy') showEnergy();
  if (tab === 'periods') showPeriods();
  if (tab === 'water') showWater();
  if (tab === 'settings') renderSettings();
  if (tab === 'climate') loadClimate();
  if (tab === 'panel') loadPanelChart().catch(err => toast(err.message));
}
window.addEventListener('hashchange', showTab);

// ======================================================================
//  Panel
// ======================================================================
async function loadState(silent = false) {
  state = await api('/api/state', { silent });
  state.sensors.map(s => s.id).sort().forEach((id, i) => colorDe[id] = COLORS[i % COLORS.length]);
  state.sensors.sort((a, b) => nameOf(a.id).localeCompare(nameOf(b.id), lang));
  // If someone opened or closed a window (from this or another device), the chart is redrawn
  const signature = state.sensors.map(s => s.open_window?.id || '').join(',');
  if (signatureWindows !== null && signature !== signatureWindows && currentTab() === 'panel') loadPanelChart().catch(() => {});
  signatureWindows = signature;
  renderCards();
  fillSelects();
  footerAndHeader();
  if (currentTab() === 'settings') renderSensorSettings();
}

// Real time: every live_seconds (Settings) a lightweight version is polled and it refreshes only if new data arrived.
// At least every 30 s it reloads anyway, for what does not bump the version (weather, windows opened from another device).
// Paused while a modal is open, during a click or drag and while typing in a field, so nothing moves under the user.
const MIN_RELOAD_MS = 30000;
let liveVersion = null, lastReload = Date.now(), pointerPressed = false;
document.addEventListener('pointerdown', () => { pointerPressed = true; }, true);
for (const ev of ['pointerup', 'pointercancel']) document.addEventListener(ev, () => { pointerPressed = false; }, true);

async function followLive() {
  if (document.hidden || pointerPressed || document.querySelector('.modal.show')
      || document.activeElement?.matches('select, textarea, input:not([type=range])')) return;
  try {
    const { version } = await api('/api/live', { silent: true });
    const change = version !== liveVersion;
    if (!change && Date.now() - lastReload < MIN_RELOAD_MS) return;
    await loadState(true);
    liveVersion = version;
    lastReload = Date.now();
    if (change && currentTab() === 'panel' && lastDraw['chart-panel']) draw('chart-panel', ...lastDraw['chart-panel']);
  } catch { /* retried on the next pass */ }
}

// Chained setTimeout: picks up a new interval immediately and two queries never overlap
function scheduleLive() {
  setTimeout(async () => { await followLive(); scheduleLive(); }, (state?.live_seconds || 10) * 1000);
}

function footerAndHeader() {
  const a = state.outdoor || {};
  $('#time-outdoor').innerHTML = a.temperature != null ? `<i class="cil-location-pin me-1"></i>${esc(placeName().split(',')[0])} ${num(a.temperature)} °C` : '';
  $('#footer-interval').textContent = state.interval_minutes ? t('footer.saving', { n: state.interval_minutes }) : '';
  renderNotifications();
}

const noSignalBadge = () => `<span class="badge text-bg-danger"><i class="cil-warning me-1"></i>${t('sensor.no_signal')}</span>`;

function renderNotifications() {
  const dropped = state.sensors.filter(s => s.connection === 'offline');
  const counter = $('#bell-counter');
  counter.hidden = !dropped.length;
  counter.textContent = dropped.length || '';
  $('#bell').setAttribute('aria-label', `${t('sensor.notifications')}: ${dropped.length}`);
  $('#bell-items').innerHTML = dropped.length ? dropped.map(s => {
    const last = s.outage?.last_reading || s.last_reading;
    return `<a class="dropdown-item d-flex align-items-start gap-2" href="#settings/sensors">
      <i class="cil-warning text-danger mt-1"></i>
      <span class="text-wrap"><strong>${esc(nameOf(s.id))}</strong>
        <span class="d-block small text-body-secondary">${t('sensor.no_signal')}${last ? ` · ${t('sensor.last')} ${ago(last)}` : ''}</span></span>
    </a>`;
  }).join('') : `<div class="px-3 py-2 small text-body-secondary">${t('sensor.no_notifications')}</div>`;
}

// Color by distance to the recommended range: inside = green, up to the tolerance = yellow, further = red
const REF_TOLERANCE = { temperature: 2, humidity: 10 };
function clsRange(metric, value) {
  if (value == null) return '';
  const met = METRICS[metric], ref = state[met.ref] || met.refDef;
  const dist = value < ref.min ? ref.min - value : value > ref.max ? value - ref.max : 0;
  return dist === 0 ? 'text-success' : dist <= REF_TOLERANCE[metric] ? 'text-warning' : 'text-danger';
}

function renderCards() {
  if (Object.keys(pendingThermo).length) return;
  const a = state.outdoor || {};
  let html = `<div class="col"><div class="card h-100 text-white bg-info border-0"><div class="card-body">
      <div class="d-flex align-items-center gap-2 fw-semibold"><i class="cil-cloud"></i> ${t('outdoor')}</div>`;
  if (a.temperature != null) {
    html += `<div class="temp-large my-2">${num(a.temperature)} °C</div>
      <div class="small">${weather(a.code)} · ${t('feels_like')} ${num(a.feels_like)} °C</div>
      <div class="small"><i class="cil-drop"></i> ${num(a.humidity, 0)} % · ${t('wind')} ${num(a.wind, 0)} km/h</div>
      <div class="small text-white-50 mt-1"><i class="cil-location-pin"></i> ${esc(placeName())} · ${ago(a.time)}</div>`;
    if (a.error) html += `<div class="small mt-1">⚠ ${t('weather.last_error')}</div>`;
  } else {
    html += `<div class="small mt-2">${a.error ? t('weather.fetch_failed') : t('loading')}</div>`;
  }
  html += '</div></div></div>';
  for (const s of state.sensors) {
    const v = s.open_window, manual = s.manual;
    html += `<div class="col"><div class="card h-100 card-room ${v ? 'open' : ''}" style="border-top-color:${colorDe[s.id]}">
      <div class="card-body d-flex flex-column">
        <div class="d-flex align-items-center flex-wrap gap-2 fw-semibold">${point(s.id)}<span class="text-truncate">${esc(nameOf(s.id))}</span>
          ${manual ? `<span class="badge text-bg-secondary fw-normal">${t('manual')}</span>` : ''}
          ${s.connection === 'offline' ? noSignalBadge() : ''}
          ${v ? `<span class="badge text-bg-warning ms-auto">${t('open')}</span>` : ''}</div>
        <div class="temp-large my-2 ${clsRange('temperature', s.temperature)}">${num(s.temperature)} °C</div>
        <div class="small text-body-secondary"><i class="cil-drop"></i> <span class="fw-semibold ${clsRange('humidity', s.humidity)}">${num(s.humidity, 0)} %</span>${manual ? '' : ` · <i class="cil-battery-full"></i> ${s.battery ?? '–'} %`}</div>
        <div class="small text-body-secondary">${s.last_reading ? t(manual ? 'manual.last' : 'last_reading', { h: ago(s.last_reading) }) : t('no_readings')}</div>

        <div class="mt-auto pt-3 d-grid gap-2">
          ${manual ? `<button class="btn btn-outline-secondary" data-reading="${esc(s.id)}"><i class="cil-plus me-1"></i>${t('manual.add')}</button>` : ''}
          ${v ? `<button class="btn btn-warning" data-close="${esc(v.id)}"><i class="cil-window me-1"></i>${t('close_open', { d: duration(v.start_at) })}</button>`

  }

}

// Thermostat setting: only the final value is saved (when releasing the slider or ~1 s after the last − / +)
const pendingThermo = {};
function showLevel(cont, n) {
  const badge = cont.querySelector('.thermo-value');
  badge.innerHTML = fmtLevel(n);
  badge.className = `badge ${n === 0 ? 'text-bg-secondary' : 'text-bg-danger'} ms-auto thermo-value fs-6 pending`;
}
function scheduleLevel(cont, wait) {
  const sensor = cont.dataset.thermo;
  clearTimeout(pendingThermo[sensor]);
  pendingThermo[sensor] = setTimeout(async () => {
    delete pendingThermo[sensor];
    const level = Number(cont.querySelector('input[type=range]').value);
    if (String(level) === cont.dataset.current) return refresh();   // back to the same value: nothing to save
    pendingThermo[sensor] = 0;   // while confirming, the automatic refresh must not redraw the card
    const ok = await confirm(t('conf.thermo', { h: nameOf(sensor), n: fmtLevel(level, false) }));
    delete pendingThermo[sensor];
    if (!ok) return refresh();
    try {
      await api('/api/thermostats', { method: 'POST', body: { sensor, level } });
      toast(t('thermo.saved'), 'success');
    } catch (err) { toast(err.message); }
    await refresh();
  }, wait);
}
$('#cards').addEventListener('input', e => {
  const cont = e.target.closest('[data-thermo]');
  if (!cont || e.target.type !== 'range') return;
  showLevel(cont, Number(e.target.value));
  clearTimeout(pendingThermo[cont.dataset.thermo]);
  pendingThermo[cont.dataset.thermo] = 0;   // in progress: the automatic refresh must not redraw the card
});
$('#cards').addEventListener('change', e => {
  const cont = e.target.closest('[data-thermo]');
  if (cont && e.target.type === 'range') scheduleLevel(cont, 400);
});

$('#cards').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.reading) return openReadingDialog(b.dataset.reading);
  if (b.dataset.step) {
    const cont = b.closest('[data-thermo]'), range = cont.querySelector('input[type=range]');
    range.value = Math.min(5, Math.max(0, Number(range.value) + 0.5 * Number(b.dataset.step)));
    showLevel(cont, Number(range.value));
    return scheduleLevel(cont, 1200);
  }
  const windowSensor = b.dataset.open || state.sensors.find(s => s.open_window?.id === b.dataset.close)?.id;
  if (!await confirm(t(b.dataset.open ? 'conf.open' : 'conf.close', { h: nameOf(windowSensor) }))) return;
  b.disabled = true;
  try {
    if (b.dataset.open) await api('/api/windows', { method: 'POST', body: { sensor: b.dataset.open } });
    else if (b.dataset.close) await api(`/api/windows/${b.dataset.close}/close`, { method: 'POST' });
    await refresh();
  } catch (err) { toast(err.message); b.disabled = false; }
});

async function loadPanelChart() {
  // Today, from 00:00 to 24:00: data arrives until now and the line advances with the day
  const until = new Date(), since = new Date(); since.setHours(0, 0, 0, 0);
  const endDay = new Date(since.getFullYear(), since.getMonth(), since.getDate() + 1).getTime();
  const q = new URLSearchParams({ since: isoLocal(since), until: isoLocal(until) });
  const [d, v, tm] = await Promise.all([api('/api/temperatures?' + q), api('/api/windows?' + q), api('/api/thermostats?' + q)]);
  d.thermostats = tm;
  draw('chart-panel', d, v, [since.getTime(), endDay]);
  loadConsumption24().then(renderPanelWater).catch(err => toast(err.message));
}

// Today's cumulative heating consumption (00:00 to 24:00), per room. Today's line is drawn until now
// and advances with the day. Starts at 0 at 00:00; if the previous reading falls outside, the first segment is split proportionally.
async function loadConsumption24() {
  await loadMeters();
  const now = Date.now(), midnight = new Date(); midnight.setHours(0, 0, 0, 0);
  const start = midnight.getTime(), end_at = new Date(midnight.getFullYear(), midnight.getMonth(), midnight.getDate() + 1).getTime();
  const datasets = [];
  const time = l => new Date(l.timestamp).getTime();
  // Points (x, cumulative consumption) of a meter between start and end; null if there are not enough readings
  const series = (rows, start, end_at, untilNow = false) => {
    let i0 = rows.findLastIndex(l => time(l) <= start);
    if (i0 < 0) i0 = rows.findIndex(l => time(l) > start);
    const inside = i0 < 0 ? [] : rows.slice(i0 + 1).filter(l => time(l) > start && time(l) <= end_at);
    if (i0 < 0 || !inside.length) return null;
    const base = rows[i0], pts = [];
    let contribution = 0;   // consumed between the baseline reading and the window start, which does not count
    if (time(base) < start) {
      pts.push({ x: start, y: 0 });
      const first = inside[0], part = (time(first) - start) / (time(first) - time(base));
      contribution = (1 - part) * (first.cumulative - base.cumulative);
    } else pts.push({ x: time(base), y: 0 });
    for (const l of inside) pts.push({ x: time(l), y: l.cumulative - base.cumulative - contribution });
    if (!untilNow) pts.push({ x: end_at, y: pts[pts.length - 1].y });   // today ends at the last real reading
    return pts;
  };
  for (const m of meters) {
    const rows = meterReadings.filter(l => l.meter === m.id && !l.virtual)
      .sort((a, b) => a.timestamp.localeCompare(b.timestamp));
    const today = series(rows, start, now, true), yesterday = series(rows, start - DAY, start);
    const point = n => ctx => ctx.dataIndex === 0 || ctx.dataIndex === n - 1 ? 0 : 3;
    // The previous day is drawn shifted 24 h, to compare it hour by hour with today (from 00:00 to 24:00)
    if (yesterday) datasets.push({ label: t('panel.consumption24_yesterday', { n: m.name }), unit: unitOf(m), yesterday: true,
      data: yesterday.map(p => ({ x: p.x + DAY, y: p.y })), borderColor: colorMeter[m.id], backgroundColor: colorMeter[m.id],
      borderWidth: 1.5, borderDash: [5, 4], pointRadius: point(yesterday.length), tension: 0 });
    if (today) datasets.push({ label: m.name, unit: unitOf(m), data: today, borderColor: colorMeter[m.id], backgroundColor: colorMeter[m.id],
      borderWidth: 2, pointRadius: point(today.length), tension: 0 });
  }
  $('#consumption24-empty').hidden = datasets.length > 0;
  $('.chart:has(#chart-consumption24)').hidden = datasets.length === 0;
  charts['chart-consumption24']?.destroy();
  delete charts['chart-consumption24'];
  if (!datasets.length) return;
  const theme = chartTheme();
  renderChart('chart-consumption24', 'line', { datasets }, {
    parsing: false,
    interaction: { mode: 'nearest', axis: 'x', intersect: false },
    scales: {
      x: timeAxis(theme, start, end_at),
      y: valueAxis(theme, null, { grace: '5%', ticks: { includeBounds: false } }),
    },
    plugins: {
      legend: { labels: lineLegend(theme) },
      tooltip: { callbacks: {
        title: it => it.length ? fmtDateTime(isoLocal(new Date(it[0].parsed.x - (it[0].dataset.yesterday ? DAY : 0)))) : '',
        label: it => `${it.dataset.label}: +${num(it.parsed.y, Number.isInteger(it.parsed.y) ? 0 : 1)} ${it.dataset.unit}`,
      } },
    },
  });
}

// Water used in the current month, per day from the 1st until now: every counter (hot and cold), stacked
function renderPanelWater() {
  $('#panel-water-card').hidden = !waterMeters.length;
  if (!waterMeters.length) {
    charts['chart-water-panel']?.destroy();
    delete charts['chart-water-panel'];
    return;
  }
  const now = new Date(), start = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const { buckets, labels } = timeBuckets(start, now.getTime());
  const series = waterMeters.map(m => {
    const s = cumulativeSeries(m.id), factor = inLiters(m) ? 1000 : 1;
    return { m, data: buckets.map(([a, b]) => consumptionBetween(s, a, b) * factor) };
  });
  // The month total only makes sense in the title if every counter is shown in litres
  const total = series.every(x => inLiters(x.m)) ? series.reduce((sum, x) => sum + x.data.reduce((a, b) => a + b, 0), 0) : null;
  $('#panel-water-title').textContent = t('water.panel_title', { m: now.toLocaleDateString(lang, { month: 'long' }) }) +
    (total == null ? '' : ` · ${fmtValue(total, 0)} L`);
  const theme = chartTheme();
  renderChart('chart-water-panel', 'bar', {
    labels,
    datasets: series.map(({ m, data }) => ({
      label: `${m.name} (${inLiters(m) ? 'L' : unitOf(m)})`, backgroundColor: colorMeter[m.id], stack: 'water', data,
    })),
  }, {
    scales: {
      x: categoryAxis(theme, { maxRotation: 0, autoSkip: true }),
      y: valueAxis(theme, 0, { stacked: true }),
    },
    plugins: {
      legend: { labels: barLegend(theme) },
      tooltip: { callbacks: { label: it => `${it.dataset.label}: ${fmtValue(it.parsed.y, 0)}` } },
    },
  });
}

// ======================================================================
//  Charts
// ======================================================================
// Text and grid colors of the current CoreUI theme, so charts follow light/dark mode
function chartTheme() {
  const css = getComputedStyle(document.documentElement);
  return {
    text: css.getPropertyValue('--cui-body-color').trim() || '#666',
    grid: css.getPropertyValue('--cui-border-color-translucent').trim() || 'rgba(0,0,0,.1)',
  };
}

// Destroys the chart on a canvas (if any) and creates a new one, kept in `charts`
function renderChart(id, type, data, options) {
  charts[id]?.destroy();
  return charts[id] = new Chart(document.getElementById(id), {
    type, data, options: { animation: false, maintainAspectRatio: false, ...options },
  });
}

// X axis of timestamps (ms) on a linear scale, with our own tick marks and labels
function timeAxis({ text, grid }, min, max, extra = {}) {
  return {
    type: 'linear', min, max, grid: { color: grid },
    afterBuildTicks: axis => { axis.ticks = timeMarks(axis.min, axis.max); },
    ticks: { color: text, maxRotation: 0, callback(v) { return axisLabel(v, this.max - this.min); } },
    ...extra,
  };
}

// Y axis of values from zero; with `decimals` the ticks are formatted with fmtValue
function valueAxis({ text, grid }, decimals, { ticks, ...extra } = {}) {
  return {
    beginAtZero: true, grid: { color: grid },
    ticks: { color: text, ...(decimals == null ? {} : { callback: v => fmtValue(v, decimals) }), ...ticks },
    ...extra,
  };
}

// Stacked category axis for bar charts
function categoryAxis({ text }, ticks = {}) {
  return { stacked: true, grid: { display: false }, ticks: { color: text, ...ticks } };
}

// Legend labels: a thin line for line charts, a box for bar charts
const lineLegend = ({ text }, extra = {}) => ({ color: text, boxWidth: 14, boxHeight: 2, ...extra });
const barLegend = ({ text }, extra = {}) => ({ color: text, boxWidth: 12, ...extra });

// Tooltip title with the date and time of the hovered point
const tooltipTimeTitle = it => it.length ? fmtDateTime(isoLocal(new Date(it[0].parsed.x))) : '';

// Wheel and pinch zoom along the given axes
const zoomGestures = (mode, onZoomComplete) => ({ wheel: { enabled: true, speed: 0.15 }, pinch: { enabled: true }, mode, onZoomComplete });

// Range [start, end] in ms from a pair of date inputs. With no start it covers the last `defaultDays` days; the end is never past now.
function inputRange(sinceSel, untilSel, defaultDays) {
  const start = $(sinceSel).value ? new Date($(sinceSel).value + 'T00:00:00').getTime() : Date.now() - defaultDays * DAY;
  const end = Math.min($(untilSel).value ? new Date($(untilSel).value + 'T23:59:59').getTime() : Date.now(), Date.now());
  return [start, end];
}

// Splits [start, end] into calendar days (ranges up to 62 days) or calendar months, clipped to the range
function timeBuckets(start, end) {
  const daily = end - start <= 62 * DAY, buckets = [];
  const c = new Date(start);
  c.setHours(0, 0, 0, 0);
  if (!daily) c.setDate(1);
  while (c.getTime() < end && buckets.length < 400) {
    const a = Math.max(c.getTime(), start);
    if (daily) c.setDate(c.getDate() + 1); else c.setMonth(c.getMonth() + 1);
    buckets.push([a, Math.min(c.getTime(), end)]);
  }
  const labels = buckets.map(([a]) => daily ? fmtDayMonth(new Date(a)) : new Date(a).toLocaleDateString(lang, { month: 'short', year: 'numeric' }));
  return { daily, buckets, labels };
}

// Consumption of a cumulative series between two instants, never negative
const consumptionBetween = (s, a, b) => Math.max(0, cumEn(s, b) - cumEn(s, a));

// Consumption of a meter in [start, end] and its daily average over the stretch covered by readings
function meterConsumption(m, start, end) {
  const s = cumulativeSeries(m.id);
  const consumption = cumEn(s, end) - cumEn(s, start);
  const from = s.length ? Math.max(start, s[0].x) : 0, to = s.length ? Math.min(end, s[s.length - 1].x) : 0;
  const days = s.length > 1 && to > from ? (to - from) / DAY : 0;
  return { m, s, consumption, days, perDay: days ? consumption / days : null };
}

// Window openings: vertical line on opening, another on closing and the area between shaded.
// While still open only the opening line is shown and the shade reaches "now".
const bandsPlugin = {
  id: 'bands',
  beforeDatasetsDraw(chart, args, opts) {
    const { ctx, chartArea: a, scales: { x } } = chart;
    // Hidden only if the room has a line on the chart and you hid it from the legend
    const withLine = new Set(chart.data.datasets.map(d => d.sid));
    const visible = new Set(chart.data.datasets.filter((d, i) => chart.isDatasetVisible(i)).map(d => d.sid));
    ctx.save();
    ctx.beginPath(); ctx.rect(a.left, a.top, a.right - a.left, a.bottom - a.top); ctx.clip();
    const line = px => { ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke(); };
    for (const b of opts.bands || []) {
      if (withLine.has(b.sid) && !visible.has(b.sid)) continue;
      const x1 = x.getPixelForValue(b.since), x2 = x.getPixelForValue(b.until);
      if (x2 < a.left || x1 > a.right) continue;
      ctx.globalAlpha = 0.15;
      ctx.fillStyle = b.color;
      ctx.fillRect(x1, a.top, Math.max(x2 - x1, 1), a.bottom - a.top);
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([]);
      line(x1);
      if (!b.open) line(x2);
      ctx.globalAlpha = 1;
      ctx.fillStyle = b.color;
      ctx.font = '600 11px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.textBaseline = 'top';
      ctx.fillText(b.name, Math.max(x1, a.left) + 4, a.top + 4 + b.row * 14);
    }
    ctx.restore();
  },
};
const noDataPlugin = {
  id: 'noData',
  afterDraw(chart) {
    if (chart.data.datasets.length) return;
    const { ctx, chartArea: a } = chart;
    ctx.save(); ctx.fillStyle = chart.options.scales.x.ticks.color; ctx.textAlign = 'center';
    ctx.fillText(t('no_data_period'), (a.left + a.right) / 2, (a.top + a.bottom) / 2); ctx.restore();
  },
};
// The value box (tooltip) is only visible while the pointer is over the chart:
// with a mouse it hides on leaving; on touch screens, 1.5 s after lifting the finger.
const hideTooltipPlugin = {
  id: 'hideTooltip',
  afterInit(chart) {
    let timer;
    const hide = () => {
      clearTimeout(timer);
      if (!chart.tooltip?.getActiveElements().length) return;
      chart.tooltip.setActiveElements([], { x: 0, y: 0 });
      chart.setActiveElements([]);
      chart.update('none');
    };
    chart.$listeners = [
      ['mouseleave', hide],
      ['touchcancel', hide],
      ['touchstart', () => clearTimeout(timer)],
      ['touchend', () => { clearTimeout(timer); timer = setTimeout(hide, 1500); }],
    ];
    chart.$listeners.forEach(([ev, fn]) => chart.canvas.addEventListener(ev, fn, { passive: true }));
  },
  beforeDestroy(chart) {
    chart.$listeners?.forEach(([ev, fn]) => chart.canvas.removeEventListener(ev, fn));
  },
};
// Reference lines (recommended humidity range): soft band and two dotted lines with their value
const referencesPlugin = {
  id: 'references',
  beforeDatasetsDraw(chart, args, opts) {
    if (!opts?.range) return;
    const { ctx, chartArea: a, scales: { y } } = chart;
    const color = opts.color || '#2eb85c';
    const yMin = y.getPixelForValue(opts.range.min), yMax = y.getPixelForValue(opts.range.max);
    ctx.save();
    ctx.beginPath(); ctx.rect(a.left, a.top, a.right - a.left, a.bottom - a.top); ctx.clip();
    ctx.globalAlpha = 0.07;
    ctx.fillStyle = color;
    ctx.fillRect(a.left, Math.min(yMin, yMax), a.right - a.left, Math.abs(yMin - yMax));
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 4]);
    for (const py of [yMax, yMin]) {
      if (py < a.top || py > a.bottom) continue;
      ctx.beginPath(); ctx.moveTo(a.left, py); ctx.lineTo(a.right, py); ctx.stroke();
    }
    ctx.restore();
  },
  // Labels go above the data lines, with a background so they can be read
  afterDatasetsDraw(chart, args, opts) {
    if (!opts?.range) return;
    const { ctx, chartArea: a, scales: { y } } = chart;
    const color = opts.color || '#2eb85c';
    const background = getComputedStyle(document.documentElement).getPropertyValue('--cui-body-bg').trim() || '#fff';
    ctx.save();
    ctx.font = '600 11px system-ui, -apple-system, "Segoe UI", sans-serif';
    ctx.textBaseline = 'middle';
    for (const [value, text, down] of [[opts.range.max, opts.textMax, false], [opts.range.min, opts.textMin, true]]) {
      const py = y.getPixelForValue(value);
      if (py < a.top || py > a.bottom) continue;
      const width = ctx.measureText(text).width + 10, high = 16;
      const x = a.left + 4, cy = py + (down ? high / 2 + 2 : -high / 2 - 2);
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = background;
      ctx.beginPath(); ctx.roundRect(x, cy - high / 2, width, high, 4); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = color;
      ctx.fillText(text, x + 5, cy);
    }
    ctx.restore();
  },
};
Chart.register(bandsPlugin, noDataPlugin, hideTooltipPlugin, referencesPlugin);
if (window.ChartZoom) Chart.register(window.ChartZoom);

// Metrics that can be plotted with the same chart
const METRICS = {
  temperature: { unit: '°C', dec: 1, limits: { min: -60, max: 120, minRange: 0.5 }, ref: 'temp_ref', refDef: { min: 18, max: 22 }, marginRef: 1 },
  humidity: { unit: '%', dec: 0, limits: { min: 0, max: 100, minRange: 2 }, ref: 'humidity_ref', refDef: { min: 40, max: 60 }, marginRef: 3 },
};

function seriesOf(data, field = 'temperature') {
  const i = Object.fromEntries(data.columns.map((c, n) => [c, n]));
  const series = {};
  for (const f of data.rows) {
    const y = parseFloat(f[i[field]]);
    if (isNaN(y)) continue;
    (series[f[i.sensor]] ??= []).push({ x: new Date(f[i.timestamp]).getTime(), y });
  }
  return series;
}

// Appends the latest received reading to the end of each line, even if not stored yet. It is only drawn: the
// log keeps storing according to its interval.
function addLivePoints(series, field, range) {
  for (const s of state.sensors) {
    const y = parseFloat(s[field]);
    if (s.manual || s.connection === 'offline' || !s.last_reading || isNaN(y)) continue;
    const x = new Date(s.last_reading).getTime(), line = series[s.id] ??= [];
    if (x >= range[0] && x > (line.at(-1)?.x ?? -Infinity)) line.push({ x, y });
  }
}

// Axis marks at "round" times depending on the visible range (from 5 min to 30 days), in local time
function timeMarks(min, max) {
  const M = 6e4, H = 36e5;
  const steps = [5 * M, 10 * M, 15 * M, 30 * M, H, 2 * H, 3 * H, 6 * H, 12 * H, DAY, 2 * DAY, 7 * DAY, 14 * DAY, 30 * DAY];
  const step = steps.find(p => (max - min) / p <= 8) || steps[steps.length - 1];
  const d = new Date(min);
  d.setSeconds(0, 0);
  if (step >= DAY) d.setHours(0, 0);
  else if (step >= H) { d.setMinutes(0); d.setHours(Math.ceil(d.getHours() / (step / H)) * (step / H)); }
  else d.setMinutes(Math.ceil(d.getMinutes() / (step / M)) * (step / M));
  const res = [];
  for (let x = d.getTime(); x <= max && res.length < 60; ) {
    if (x >= min) res.push({ value: x });
    if (step >= DAY) { const n = new Date(x); n.setDate(n.getDate() + step / DAY); x = n.getTime(); } else x += step;
  }
  return res;
}

function axisLabel(v, range) {
  const d = new Date(v);
  const date = fmtDayMonth(d);
  const time = fmtTime24(d);
  if (!d.getHours() && !d.getMinutes()) return date;      // midnight: show the day
  return range > 1.5 * DAY ? `${date} ${time}` : time;
}

// Thermostat level as steps: each change holds until the next one (or until "now")
function thermostatSeries(records, range) {
  const end_at = Math.min(Date.now(), range[1]);
  const res = {};
  for (const r of records) {
    const pts = (res[r.sensor] ??= []);
    const x = Math.max(new Date(r.timestamp).getTime(), range[0]);
    if (pts.length && pts[pts.length - 1].x === x) pts.pop();  // the one in effect before the range gets overwritten
    pts.push({ x, y: Number(r.level) });
  }
  for (const pts of Object.values(res)) {
    const last = pts[pts.length - 1];
    if (last.x < end_at) pts.push({ x: end_at, y: last.y });
  }
  return res;
}

// If there is data for only part of the period, the axis starts where the data starts
// (with a margin and showing at least 1 hour), so it is not all squeezed against the edge.
function startByData(data, windows, start_at, end_at) {
  let first = Infinity;
  for (const pts of Object.values(seriesOf(data))) if (pts.length) first = Math.min(first, pts[0].x);
  for (const v of windows) first = Math.min(first, Math.max(new Date(v.start_at).getTime(), start_at));
  if (!isFinite(first)) return start_at;
  const margin = Math.max((end_at - first) * 0.05, 5 * 6e4);
  return Math.max(start_at, Math.min(first - margin, end_at - 36e5));
}

const lastDraw = {};
function redrawCharts() {
  for (const id in lastDraw) draw(id, ...lastDraw[id]);
  if (currentTab() === 'panel' && charts['chart-water-panel']) renderPanelWater();
  if (currentTab() === 'energy' && energyView === 'heating') renderConsumption();
  if (currentTab() === 'energy' && energyView === 'water') renderWaterAnalysis();
}

// View preferences per chart (zoom axis and Y axis range), remembered in this browser
const DEFAULT_VIEW = { mode: 'x', metric: 'temperature', axes: {}, thermostats: true, windows: true, reference: true };
// Y axis range of the metric being viewed (each metric remembers its own)
function axisY(v) {
  v.axes ??= {};
  return v.axes[v.metric] ??= { yAuto: true, yMin: '', yMax: '' };
}
const views = {};
function viewOf(id) {
  if (!views[id]) {
    let v = {};
    try { v = JSON.parse(localStorage.getItem('view-' + id) || '{}'); } catch (e) {}
    views[id] = { ...DEFAULT_VIEW, ...v };
  }
  return views[id];
}
function saveView(id) { try { localStorage.setItem('view-' + id, JSON.stringify(views[id])); } catch (e) {} }
const numOrEmpty = v => (v === '' || v == null || isNaN(v)) ? undefined : Number(v);

function htmlControls(id) {
  const v = viewOf(id), ey = axisY(v);
  const metric = m => `<button type="button" class="btn btn-outline-secondary ${v.metric === m ? 'active' : ''}" data-metric="${m}" aria-pressed="${v.metric === m}">${t('chart.' + m)}</button>`;
  const mode = m => `<button type="button" class="btn btn-outline-secondary ${v.mode === m ? 'active' : ''}" data-mode="${m}" aria-pressed="${v.mode === m}">${{ x: 'X', y: 'Y', xy: 'X+Y' }[m]}</button>`;
  const layer = k => `<button type="button" class="btn btn-outline-secondary ${v[k] ? 'active' : ''}" data-layer="${k}" aria-pressed="${!!v[k]}">${t('chart.' + k)}</button>`;
  return `<div class="d-flex flex-wrap align-items-center gap-2 small">
    <div class="btn-group btn-group-sm" role="group" aria-label="${esc(t('chart.metric'))}">${metric('temperature')}${metric('humidity')}</div>
    <div class="vr mx-1 d-none d-sm-block"></div>
    <span class="text-body-secondary">${t('chart.zoom_axis')}</span>
    <div class="btn-group btn-group-sm" role="group" aria-label="${esc(t('chart.zoom_axis'))}">${mode('x')}${mode('y')}${mode('xy')}</div>
    <div class="btn-group btn-group-sm" role="group">
      <button type="button" class="btn btn-outline-secondary" data-zoom="out" title="${esc(t('chart.zoom_out'))}" aria-label="${esc(t('chart.zoom_out'))}"><i class="cil-zoom-out"></i></button>
      <button type="button" class="btn btn-outline-secondary" data-zoom="in" title="${esc(t('chart.zoom_in'))}" aria-label="${esc(t('chart.zoom_in'))}"><i class="cil-zoom-in"></i></button>
    </div>
    <div class="vr mx-1 d-none d-sm-block"></div>
    <span class="text-body-secondary">${t('chart.axis_y')}</span>
    <div class="form-check form-switch mb-0">
      <input class="form-check-input" type="checkbox" role="switch" id="yauto-${id}" data-yauto ${ey.yAuto ? 'checked' : ''}>
      <label class="form-check-label" for="yauto-${id}">${t('chart.auto')}</label>
    </div>
    <input type="number" class="form-control form-control-sm" style="width:5.2rem" step="0.5" data-ymin value="${esc(ey.yMin)}" placeholder="${esc(t('min'))}" aria-label="${esc(t('chart.axis_y') + ' ' + t('min'))}" ${ey.yAuto ? 'disabled' : ''}>
    <input type="number" class="form-control form-control-sm" style="width:5.2rem" step="0.5" data-ymax value="${esc(ey.yMax)}" placeholder="${esc(t('max'))}" aria-label="${esc(t('chart.axis_y') + ' ' + t('max'))}" ${ey.yAuto ? 'disabled' : ''}>
    <div class="vr mx-1 d-none d-sm-block"></div>
    <span class="text-body-secondary">${t('chart.show')}</span>
    <div class="btn-group btn-group-sm" role="group" aria-label="${esc(t('chart.show'))}">${layer('thermostats')}${layer('windows')}${layer('reference')}</div>
    <button type="button" class="btn btn-sm btn-outline-secondary" data-reset="${id}" hidden><i class="cil-zoom-out me-1"></i>${t('chart.reset')}</button>
  </div>`;
}
function renderControls() {
  document.querySelectorAll('[data-controls]').forEach(el => {
    el.innerHTML = htmlControls(el.dataset.controls);
    updateButtonReset(el.dataset.controls);
  });
}

document.addEventListener('click', e => {
  const cont = e.target.closest('[data-controls]');
  if (!cont) return;
  const id = cont.dataset.controls, chart = charts[id], v = viewOf(id);
  const bMet = e.target.closest('[data-metric]');
  if (bMet) {
    if (v.metric === bMet.dataset.metric) return;
    v.metric = bMet.dataset.metric;
    saveView(id);
    cont.innerHTML = htmlControls(id);      // the Y axis shows the saved range of the other metric
    if (lastDraw[id]) draw(id, ...lastDraw[id], { keepY: false });
    if (id === 'chart-temp' && lastDraw[id]) renderTempSummary(lastDraw[id][0]);
    return;
  }
  const bLayer = e.target.closest('[data-layer]');
  if (bLayer) {
    const k = bLayer.dataset.layer;
    v[k] = !v[k];
    saveView(id);
    bLayer.classList.toggle('active', v[k]);
    bLayer.setAttribute('aria-pressed', v[k]);
    if (lastDraw[id]) draw(id, ...lastDraw[id]);
    return;
  }
  const bMode = e.target.closest('[data-mode]');
  if (bMode) {
    v.mode = bMode.dataset.mode;
    saveView(id);
    cont.querySelectorAll('[data-mode]').forEach(b => { b.classList.toggle('active', b === bMode); b.setAttribute('aria-pressed', b === bMode); });
    if (chart) {
      chart.options.plugins.zoom.zoom.mode = v.mode;
      chart.options.plugins.zoom.pan.mode = v.mode;
      chart.update('none');
    }
    return;
  }
  const bZoom = e.target.closest('[data-zoom]');
  if (bZoom && chart) {
    chart.zoom(bZoom.dataset.zoom === 'in' ? 1.25 : 0.8);
    updateButtonReset(id);
  }
});

document.addEventListener('change', e => {
  const cont = e.target.closest('[data-controls]');
  if (!cont || !e.target.matches('[data-yauto], [data-ymin], [data-ymax]')) return;
  const id = cont.dataset.controls, chart = charts[id], v = viewOf(id);
  const mn = cont.querySelector('[data-ymin]'), mx = cont.querySelector('[data-ymax]');
  const ey = axisY(v);
  ey.yAuto = cont.querySelector('[data-yauto]').checked;
  mn.disabled = mx.disabled = ey.yAuto;
  if (!ey.yAuto && chart) {  // when switching to a fixed range, start from the currently visible range
    if (mn.value === '') mn.value = Math.floor(chart.scales.y.min);
    if (mx.value === '') mx.value = Math.ceil(chart.scales.y.max);
  }
  if (!ey.yAuto && Number(mn.value) >= Number(mx.value)) return toast(t('chart.invalid_range'), 'warning');
  ey.yMin = mn.value;
  ey.yMax = mx.value;
  saveView(id);
  if (lastDraw[id]) draw(id, ...lastDraw[id], { keepY: false });
});

function updateButtonReset(id) {
  const b = document.querySelector(`[data-reset="${id}"]`);
  if (b) b.hidden = !charts[id]?.isZoomedOrPanned?.();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-reset]');
  if (!b) return;
  charts[b.dataset.reset]?.resetZoom();
  b.hidden = true;
});

function draw(id, data, windows, range, options = {}) {
  lastDraw[id] = [data, windows, range];
  const view = viewOf(id);
  const ey = axisY(view), met = METRICS[view.metric] || METRICS.temperature;
  const ref = state[met.ref] || met.refDef;
  const yConfig = { min: ey.yAuto ? undefined : numOrEmpty(ey.yMin), max: ey.yAuto ? undefined : numOrEmpty(ey.yMax) };
  // On refresh, the zoom (X and Y separately) and the series hidden from the legend are kept
  const previous = charts[id];
  let zoomX = null, zoomY = null;
  if (previous?.$config) {
    const o = previous.options.scales, c = previous.$config;
    if (o.x.min !== c.x.min || o.x.max !== c.x.max) zoomX = { min: previous.scales.x.min, max: previous.scales.x.max };
    if (options.keepY !== false && (o.y.min !== c.y.min || o.y.max !== c.y.max)) zoomY = { min: previous.scales.y.min, max: previous.scales.y.max };
  }
  const hidden = new Set(previous ? previous.data.datasets.filter((d, i) => !previous.isDatasetVisible(i)).map(d => d.sid) : []);

  const series = seriesOf(data, view.metric);
  if (id === 'chart-panel') addLivePoints(series, view.metric, range);
  const order = Object.keys(series).sort((a, b) => a === 'outdoor' ? 1 : b === 'outdoor' ? -1 : nameOf(a).localeCompare(nameOf(b), lang));
  // Zigbee sensors break the line when readings are missing; manual ones are loose points and always joined
  const zigbeeGap = Math.max(3 * (state.interval_minutes || 10), 30) * 6e4;
  const datasets = order.map(sid => {
    const manual = isManual(sid);
    return {
      sid, label: nameOf(sid), data: series[sid], hidden: hidden.has(sid), yAxisID: 'y',
      borderColor: colorDe[sid] || '#999', backgroundColor: colorDe[sid] || '#999',
      borderWidth: sid === 'outdoor' ? 1.5 : 2, borderDash: sid === 'outdoor' ? [5, 4] : [],
      pointRadius: manual ? 3 : series[sid].length <= 60 ? 2.5 : 0, pointHoverRadius: 4, tension: 0.25,
      spanGaps: manual || sid === 'outdoor' ? true : zigbeeGap,
    };
  });
  const steps = view.thermostats ? thermostatSeries(data.thermostats || [], range) : {};
  for (const [sid, pts] of Object.entries(steps)) {
    datasets.push({
      sid, thermostat: true, label: t('thermo.legend', { n: nameOf(sid) }), data: pts, yAxisID: 'y2', hidden: hidden.has(sid),
      borderColor: colorDe[sid] || '#999', backgroundColor: colorDe[sid] || '#999',
      borderWidth: 1.5, borderDash: [2, 3],
      // In Chart.js, 'before' means the level holds until the next point
      stepped: 'before', pointRadius: 0, pointHoverRadius: 3, tension: 0,
    });
  }
  const hasThermostats = Object.keys(steps).length > 0;
  const rows = {};
  const bands = (view.windows ? windows : []).map(v => ({
    sid: v.sensor, name: nameOf(v.sensor), color: colorDe[v.sensor] || '#999',
    since: new Date(v.start_at).getTime(), until: v.end_at ? new Date(v.end_at).getTime() : Date.now(), open: !v.end_at,
    row: rows[v.sensor] ??= Object.keys(rows).length,
  }));
  const theme = chartTheme(), { text, grid } = theme;
  const onZoomChange = () => updateButtonReset(id);

  const chart = renderChart(id, 'line', { datasets }, {
    parsing: false, normalized: true,
    interaction: { mode: 'nearest', axis: 'x', intersect: false },
    scales: {
      x: timeAxis(theme, range[0], range[1]),
      y: { min: yConfig.min, max: yConfig.max, grace: '5%',
           suggestedMin: ref.min - met.marginRef, suggestedMax: ref.max + met.marginRef, grid: { color: grid }, ticks: { color: text, includeBounds: false, callback: v => `${num(v, Number.isInteger(v) ? 0 : 1)} ${met.unit}` } },
      y2: {
        display: hasThermostats, position: 'right', min: 0, max: 5, grid: { drawOnChartArea: false },
        title: { display: true, text: t('chart.thermo_level'), color: text },
        afterBuildTicks: axis => { axis.ticks = LEVEL_MARKS.map(value => ({ value })); },
        ticks: {
          color: text,
          callback: v => v === FROST ? FROST_ICON : String(v),
          font: c => c.tick?.value === FROST ? { family: 'CoreUI-Icons-Free', size: 11 } : undefined,
        },
      },
    },
    plugins: {
      // Reduces the points only for drawing; zooming recalculates with the real detail
      decimation: { enabled: true, algorithm: 'lttb' },
      legend: {
        labels: lineLegend(theme, { filter: (item, data) => !data.datasets[item.datasetIndex].thermostat }),
        // Hiding a room also hides its thermostat and windows
        onClick: (e, item, legend) => {
          const ch = legend.chart, sid = ch.data.datasets[item.datasetIndex].sid, view = !ch.isDatasetVisible(item.datasetIndex);
          ch.data.datasets.forEach((d, i) => { if (d.sid === sid) ch.setDatasetVisibility(i, view); });
          ch.update();
        },
      },
      tooltip: {
        callbacks: {
          title: tooltipTimeTitle,
          label: it => it.dataset.thermostat ? `${it.dataset.label}: ${fmtLevel(it.parsed.y, false)}`
                                             : `${it.dataset.label}: ${num(it.parsed.y, met.dec)} ${met.unit}`,
        },
      },
      bands: { bands },
      references: !view.reference ? {} : { range: ref, textMin: t('ref.min', { v: `${num(ref.min, Number.isInteger(ref.min) ? 0 : 1)} ${met.unit}` }),
                                  textMax: t('ref.max', { v: `${num(ref.max, Number.isInteger(ref.max) ? 0 : 1)} ${met.unit}` }) },
      zoom: {
        limits: { x: { min: range[0], max: range[1], minRange: 15 * 6e4 }, y: met.limits, y2: { min: 0, max: 5, minRange: 5 } },
        pan: { enabled: true, mode: view.mode, onPanComplete: onZoomChange },
        zoom: zoomGestures(view.mode, onZoomChange),
      },
    },
  });
  chart.$config = { x: { min: range[0], max: range[1] }, y: yConfig };
  charts[id] = chart;
  if (zoomX) chart.zoomScale('x', { min: Math.max(zoomX.min, range[0]), max: Math.min(zoomX.max, range[1]) }, 'none');
  if (zoomY) chart.zoomScale('y', zoomY, 'none');
  updateButtonReset(id);
}

//  Temperatures tab

function paramsRange(sinceSel, untilSel) {
  const p = new URLSearchParams();
  if ($(sinceSel).value) p.set('since', $(sinceSel).value + 'T00:00:00');
  if ($(untilSel).value) p.set('until', $(untilSel).value + 'T23:59:59');
  return p;
}

async function loadTemperatures() {
  temperaturesLoaded = true;
  const sel = [...document.querySelectorAll('#t-sensors input:checked')].map(i => i.value);
  const p = paramsRange('#t-since', '#t-until');
  p.set('sensors', sel.join(','));
  $('#t-download').href = '/api/temperatures.csv?' + p + '&lang=' + lang;
  const empty = { columns: ['timestamp', 'sensor', 'temperature', 'humidity', 'battery'], rows: [] };
  let d, v, tm;
  try {
    [d, v, tm] = sel.length
      ? await Promise.all([api('/api/temperatures?' + p), api('/api/windows?' + paramsRange('#t-since', '#t-until')),
                           api('/api/thermostats?' + paramsRange('#t-since', '#t-until'))])
      : [empty, [], []];
  } catch (err) { return toast(err.message); }
  d.thermostats = tm.filter(x => sel.includes(x.sensor));
  const start = $('#t-since').value ? new Date($('#t-since').value + 'T00:00:00').getTime() : null;
  const endDay = $('#t-until').value ? new Date($('#t-until').value + 'T23:59:59').getTime() : Date.now();
  const series = seriesOf(d);
  let minX = Infinity;
  for (const s of Object.values(series)) if (s.length) minX = Math.min(minX, s[0].x);
  const endRange = Math.min(endDay, Date.now());
  const startRange = start ?? (isFinite(minX) ? minX : Date.now() - DAY);
  const range = [startByData(d, v, startRange, endRange), endRange];
  draw('chart-temp', d, v.filter(x => sel.includes(x.sensor)), range);

  renderTempSummary(d);

  idxTable = Object.fromEntries(d.columns.map((c, n) => [c, n]));
  tableRows = d.rows.slice().reverse();
  $('#t-title').textContent = t('temp.records', { n: whole(tableRows.length) });
  $('#t-table').innerHTML = `<thead><tr><th>${t('timestamp')}</th><th>${t('room')}</th><th class="text-end">${t('temp_short')}</th><th class="text-end">${t('humidity')}</th><th class="text-end">${t('battery')}</th><th></th></tr></thead><tbody></tbody>`;
  showPageTemp();
}

function renderTempSummary(d) {
  const metric = viewOf('chart-temp').metric, met = METRICS[metric] || METRICS.temperature;
  const series = seriesOf(d, metric);
  $('#t-summary').innerHTML = Object.entries(series).sort((a, b) => nameOf(a[0]).localeCompare(nameOf(b[0]), lang)).map(([sid, pts]) => {
    let mn = Infinity, mx = -Infinity, sum = 0;
    for (const q of pts) { mn = Math.min(mn, q.y); mx = Math.max(mx, q.y); sum += q.y; }
    return `<div class="col-6 col-md-4 col-xl"><div class="border-start border-4 px-3" style="border-color:${colorDe[sid] || '#999'} !important">
      <div class="small text-body-secondary">${esc(nameOf(sid))}</div>
      <div class="fw-semibold">${num(sum / pts.length, met.dec)} ${met.unit} <span class="small text-body-secondary fw-normal">${t('avg')}</span></div>
      <div class="small text-body-secondary">${t('min')} ${num(mn, met.dec)} · ${t('max')} ${num(mx, met.dec)}</div></div></div>`;
  }).join('') || `<div class="col text-body-secondary small">${t('no_data')}</div>`;
}

function showPageTemp() {
  const i = idxTable, table = $('#t-table'), body = table.querySelector('tbody');
  const since = pageOf('t-table', tableRows.length) * ROWS_PER_PAGE;
  body.innerHTML = tableRows.length
    ? tableRows.slice(since, since + ROWS_PER_PAGE).map(f => `<tr>
    <td>${fmtDateTime(f[i.timestamp])}</td><td><span class="d-inline-flex align-items-center gap-2">${point(f[i.sensor])}${esc(nameOf(f[i.sensor]))}</span></td>
    <td class="text-end">${num(f[i.temperature])} °C</td><td class="text-end">${num(f[i.humidity], 0)} %</td>
    <td class="text-end">${f[i.battery] ? f[i.battery] + ' %' : '–'}</td>
    <td class="text-end">${isManual(f[i.sensor]) ? `<button class="btn btn-sm btn-ghost-danger py-0" data-sensor="${esc(f[i.sensor])}" data-date="${esc(f[i.timestamp])}" title="${esc(t('delete'))}" aria-label="${esc(t('delete'))}"><i class="cil-trash"></i></button>` : ''}</td></tr>`).join('')
    : `<tr><td colspan="6" class="text-center text-body-secondary py-4">${t('no_records')}</td></tr>`;
  drawPaginator('t-table', table, tableRows.length, showPageTemp);
}
$('#t-apply').addEventListener('click', loadTemperatures);
$('#t-table').addEventListener('click', async e => {
  const b = e.target.closest('button[data-date]');
  if (!b || !await confirm(t('confirm_delete'), { danger: true })) return;
  try {
    await api('/api/manual_readings?' + new URLSearchParams({ sensor: b.dataset.sensor, timestamp: b.dataset.date }), { method: 'DELETE' });
    toast(t('deleted'), 'success');
    await refresh();
  } catch (err) { toast(err.message); }
});
$('#t-manual').addEventListener('click', () => openReadingDialog());

function openReadingDialog(sensor) {
  if (!manual_sensors().length) return toast(t('manual.none_available'), 'warning');
  $('#dlgl-sensor').innerHTML = manual_sensors().map(s => `<option value="${esc(s.id)}">${esc(nameOf(s.id))}</option>`).join('');
  $('#dlgl-sensor').value = sensor || manual_sensors()[0].id;
  $('#dlgl-date').value = isoLocal(new Date()).slice(0, 16);
  $('#dlgl-temp').value = '';
  $('#dlgl-hum').value = '';
  $('#dlgl-error').classList.add('d-none');
  modalReading.show();
}
$('#dlgl-form').addEventListener('submit', async e => {
  e.preventDefault();
  const body = { sensor: $('#dlgl-sensor').value, timestamp: $('#dlgl-date').value, temperature: $('#dlgl-temp').value, humidity: $('#dlgl-hum').value };
  const detail = `${nameOf(body.sensor)} · ${fmtDateTime(body.timestamp)} · ${num(body.temperature)} °C` + (body.humidity !== '' ? ` · ${num(body.humidity)} %` : '');
  if (!await confirm(t('conf.new'), { detail })) return;
  try {
    await api('/api/manual_readings', { method: 'POST', body });
    modalReading.hide();
    toast(t('manual.saved'), 'success');
    temperaturesLoaded = false;
    await refresh();
  } catch (err) {
    $('#dlgl-error').textContent = err.message;
    $('#dlgl-error').classList.remove('d-none');
  }
});

function windowEffect(i) {
  if (!i) return `<span class="text-body-secondary">${t('window.no_data')}</span>`;
  const cls = i.drop >= 2 ? 'text-danger' : i.drop >= 0.5 ? 'text-warning' : 'text-body-secondary';
  const approx = i.approximate ? `<span title="${esc(t('window.approx_help'))}">≈</span>` : '';
  return `${approx}${num(i.temp_before)} → ${num(i.temp_min)} °C <span class="fw-semibold ${cls}">(${i.drop > 0 ? '−' : '+'}${num(Math.abs(i.drop))})</span>
    <span class="small text-body-secondary">· ${minutesText(i.minutes_to_min)}</span>`;
}

    (windowList.length ? windowList.map(v => `<tr>
      <td><span class="d-inline-flex align-items-center gap-2">${point(v.sensor)}${esc(nameOf(v.sensor))}</span></td>
