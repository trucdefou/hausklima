async function mostrarAgua() {
  try { await cargarMedidores(); } catch (err) { return aviso(err.message); }
  renderAgua();
}

function renderAgua() {
  const ahoraLocal = isoLocal(new Date()).slice(0, 16);
  $('#ag-tarjetas').innerHTML = medidoresAgua.length ? medidoresAgua.map(m => htmlTarjetaMedidor(m, ahoraLocal)).join('')
    : `<div class="col-12 w-100"><div class="card"><div class="card-body text-body-secondary">${t('agua.ninguno')}</div></div></div>`;
  if ($('#ag-editando').value) { $('#ag-titulo').textContent = t('agua.editar'); $('#ag-guardar').textContent = t('guardar'); }
  const csv = paramsRango('#ag-desde', '#ag-hasta');
  csv.set('tipo', 'agua_caliente');
  $('#ag-descargar').href = '/api/consumo.csv?' + csv + '&idioma=' + idioma;

  const d = $('#ag-desde').value ? new Date($('#ag-desde').value + 'T00:00:00').getTime() : Date.now() - 30 * DIA;
  const h = Math.min($('#ag-hasta').value ? new Date($('#ag-hasta').value + 'T23:59:59').getTime() : Date.now(), Date.now());
  const datos = medidoresAgua.map(m => {
    const s = serieAcum(m.id);
    const consumo = acumEn(s, h) - acumEn(s, d);
    const ini = s.length ? Math.max(d, s[0].x) : 0, fin = s.length ? Math.min(h, s[s.length - 1].x) : 0;
    const dias = s.length > 1 && fin > ini ? (fin - ini) / DIA : 0;
    return { m, s, consumo, porDia: dias ? consumo / dias : null };
  });

  // Resumen
  const widget = (titulo, valor, sub, color) => `<div class="col-6 col-lg-3"><div class="card h-100" style="border-top:3px solid ${color}">
    <div class="card-body py-3"><div class="small text-body-secondary text-truncate">${titulo}</div>
    <div class="fs-4 fw-semibold tabular">${valor}</div><div class="small text-body-secondary">${sub}</div></div></div></div>`;
  let html = '';
  if (datos.length > 1 && datos.every(x => enLitros(x.m))) {
    const total = datos.reduce((s, x) => s + x.consumo, 0), totalDia = datos.reduce((s, x) => s + (x.porDia || 0), 0);
    html += widget(t('cons.total_todos'), fmtConsumo(total, datos[0].m), t('agua.por_dia', { v: fmtConsumo(totalDia, datos[0].m) }), 'var(--cui-primary)');
  }
  html += datos.map(x => widget(esc(x.m.nombre), fmtConsumo(x.consumo, x.m),
    x.porDia == null ? t('agua.en_periodo') : t('agua.por_dia', { v: fmtConsumo(x.porDia, x.m) }), colorMed[x.m.id])).join('');
  $('#ag-resumen').innerHTML = html;

  // Barras por día o por mes
  const css = getComputedStyle(document.documentElement);
  const texto = css.getPropertyValue('--cui-body-color').trim() || '#666';
  const grid = css.getPropertyValue('--cui-border-color-translucent').trim() || 'rgba(0,0,0,.1)';
  const diario = h - d <= 62 * DIA;
  $('#ag-barras-titulo').textContent = t(diario ? 'cons.barras_dia' : 'cons.barras_mes');
  const cortes = [];
  const c = new Date(d);
  c.setHours(0, 0, 0, 0);
  if (!diario) c.setDate(1);
  while (c.getTime() < h && cortes.length < 400) {
    const ini = Math.max(c.getTime(), d);
    if (diario) c.setDate(c.getDate() + 1); else c.setMonth(c.getMonth() + 1);
    cortes.push([ini, Math.min(c.getTime(), h)]);
  }
  const factor = m => enLitros(m) ? 1000 : 1;
  graficos['graf-agua']?.destroy();
  graficos['graf-agua'] = new Chart($('#graf-agua'), {
    type: 'bar',
    data: {
      labels: cortes.map(([a]) => diario ? fmtDiaMes(new Date(a)) : new Date(a).toLocaleDateString(idioma, { month: 'short', year: 'numeric' })),
      datasets: datos.map(x => ({
        label: `${x.m.nombre} (${enLitros(x.m) ? 'L' : unidadDe(x.m)})`, backgroundColor: colorMed[x.m.id], stack: 'agua',
        data: cortes.map(([a, b]) => Math.max(0, acumEn(x.s, b) - acumEn(x.s, a)) * factor(x.m)),
      })),
    },
    options: {
      animation: false, maintainAspectRatio: false,
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { color: texto, maxRotation: 0, autoSkip: true } },
        y: { stacked: true, beginAtZero: true, grid: { color: grid }, ticks: { color: texto, callback: v => fmtValor(v, 0) } },
      },
      plugins: {
        legend: { labels: { color: texto, boxWidth: 12 } },
        tooltip: { callbacks: { label: it => `${it.dataset.label}: ${fmtValor(it.parsed.y, 0)}` } },
      },
    },
  });

  // Consumo por período de liquidación
  const hoy = Date.now();
  const pers = periodos.filter(p => p.inicio <= fechaInput(new Date()));
  $('#ag-per-card').hidden = !pers.length || !medidoresAgua.length;
  if (!$('#ag-per-card').hidden) {
    $('#ag-per').innerHTML = `<thead><tr><th>${t('agua.contador')}</th>${pers.map(p => `<th class="text-end">${esc(p.nombre)}${badgePerMudanza(p)}${limitesPer(p)[1] >= hoy ? ` <span class="badge text-bg-info">${t('per.estado_curso')}</span>` : ''}</th>`).join('')}</tr></thead><tbody>` +
      datos.map(x => `<tr><td><span class="d-inline-flex align-items-center gap-2">${puntoMed(x.m.id)}${esc(x.m.nombre)}</span></td>` + pers.map(p => {
        const [ini, fin] = limitesPer(p);
        if (!x.s.length || x.s[x.s.length - 1].x < ini || x.s[0].x > fin) return '<td class="text-end text-body-secondary">–</td>';
        const incompleto = fin < hoy && x.s[x.s.length - 1].x < fin;
        return `<td class="text-end ${incompleto ? 'fst-italic text-body-secondary' : 'fw-semibold'}">${fmtConsumo(acumEn(x.s, fin) - acumEn(x.s, ini), x.m)}${incompleto ? ` <span class="badge text-bg-warning">${t('per.incompleto')}</span>` : ''}</td>`;
      }).join('') + '</tr>').join('') + '</tbody>';
  }

  // Historial
  const filas = lecturasAgua.slice().sort((a, b) => b.fecha_hora.localeCompare(a.fecha_hora));
  $('#ag-tabla').innerHTML = `<thead><tr><th>${t('agua.contador')}</th><th>${t('fecha_hora')}</th><th class="text-end">${t('med.lectura')}</th>
    <th class="text-end">${t('med.consumo')}</th><th class="text-end">${t('med.dias')}</th><th class="text-end">${t('agua.litros_dia')}</th><th></th></tr></thead><tbody>` +
    (filas.length ? filas.map(l => { const m = medPorId(l.medidor); return `<tr class="${l.antes_mudanza || l.virtual ? 'text-body-secondary' : ''}">
      <td><span class="d-inline-flex align-items-center gap-2">${puntoMed(l.medidor)}${l.virtual ? `<em>${esc(m?.nombre)} · ${esc(etiquetaVirtual(l))}</em>` : esc(m?.nombre)}</span></td>
      <td>${fmtFechaHora(l.fecha_hora)}</td>
      <td class="text-end">${l.valor == null ? '–' : fmtValor(l.valor)} <span class="small text-body-secondary">${esc(unidadDe(m))}</span></td>
      <td class="text-end">${l.consumo == null ? (l.tipo === 'entrada' || l.virtual ? '' : `<span class="small text-body-secondary">${t('med.primera')}</span>`) : consumoTachado(l, fmtConsumo(l.consumo, m))}${badgeReinicio(l)}${badgeMudanza(l)}</td>
      <td class="text-end">${l.dias == null ? '–' : num(l.dias, 1)}</td>
      <td class="text-end">${l.consumo != null && l.dias && !l.antes_mudanza ? (enLitros(m) ? fmtValor(l.consumo * 1000 / l.dias, 0) : fmtValor(l.consumo / l.dias, 3)) : '–'}</td>
      <td class="text-end text-nowrap">${l.virtual ? `<span class="badge text-bg-light border">${t('med.calculado')}</span>` : `
        <button class="btn btn-sm btn-ghost-secondary py-0" data-editar-lect="${esc(l.id)}" title="${esc(t('editar'))}" aria-label="${esc(t('editar'))}"><i class="cil-pencil"></i></button>
        <button class="btn btn-sm btn-ghost-danger py-0" data-borrar-lect="${esc(l.id)}" title="${esc(t('borrar'))}" aria-label="${esc(t('borrar'))}"><i class="cil-trash"></i></button>`}
      </td></tr>`; }).join('') : `<tr><td colspan="7" class="text-center text-body-secondary py-4">${t('sin_registros')}</td></tr>`) + '</tbody>';
}

async function mostrarPeriodos() {
  try { await cargarMedidores(); } catch (err) { return aviso(err.message); }
  renderPeriodos();
}

function renderPeriodos() {
  const hoy = fechaInput(new Date());
  if (!periodos.length && !$('#pe-editando').value && !$('#pe-nombre').value) {   // sugerencia: el año en curso
    const y = new Date().getFullYear();
    $('#pe-nombre').value = String(y);
    $('#pe-inicio').value = `${y}-01-01`;
    $('#pe-fin').value = `${y}-12-31`;
  }
  const estado = p => p.fin < hoy ? ['secondary', 'per.estado_cerrado'] : p.inicio > hoy ? ['light border', 'per.estado_futuro'] : ['info', 'per.estado_curso'];
  const fmtDia = d => fmtFecha(new Date(d + 'T12:00:00'));
  $('#pe-tabla').innerHTML = `<thead><tr><th>${t('med.nombre')}</th><th>${t('desde')}</th><th>${t('hasta')}</th><th class="text-end">${t('med.dias')}</th><th></th><th></th></tr></thead><tbody>` +
    (periodos.length ? periodos.slice().reverse().map(p => {
      const [cls, clave] = estado(p);
      const dias = Math.round((new Date(p.fin) - new Date(p.inicio)) / DIA) + 1;
      const cargados = cierres.filter(c => c.periodo === p.id).length;
      return `<tr>
        <td class="fw-semibold">${esc(p.nombre)}</td><td>${fmtDia(p.inicio)}</td><td>${fmtDia(p.fin)}</td>
        <td class="text-end">${dias}</td>
        <td><span class="badge text-bg-${cls}">${t(clave)}</span></td>
        <td class="text-end text-nowrap">
          <button class="btn btn-sm btn-outline-primary" data-cierres-per="${esc(p.id)}">${t('per.valores_finales')} <span class="badge text-bg-light border">${cargados}/${medidores.length}</span></button>
          <button class="btn btn-sm btn-ghost-secondary" data-editar-per="${esc(p.id)}" title="${esc(t('editar'))}" aria-label="${esc(t('editar'))}"><i class="cil-pencil"></i></button>
          <button class="btn btn-sm btn-ghost-danger" data-borrar-per="${esc(p.id)}" title="${esc(t('borrar'))}" aria-label="${esc(t('borrar'))}"><i class="cil-trash"></i></button>
        </td></tr>`;
    }).join('') : `<tr><td colspan="6" class="text-center text-body-secondary py-4">${t('per.ninguno')}</td></tr>`) + '</tbody>';
  if ($('#pe-cierres-form').dataset.id) abrirCierres($('#pe-cierres-form').dataset.id);
  if ($('#pe-editando').value) { $('#pe-titulo').textContent = t('per.editar'); $('#pe-guardar').textContent = t('guardar'); }
}

function limpiarFormPer() {
  $('#pe-editando').value = '';
  $('#pe-nombre').value = $('#pe-inicio').value = $('#pe-fin').value = '';
  $('#pe-titulo').textContent = t('per.nuevo');
  $('#pe-guardar').textContent = t('crear');
  $('#pe-cancelar').hidden = true;
}

function abrirCierres(id) {
  const p = periodos.find(x => x.id === id);
  if (!p) { $('#pe-cierres-card').hidden = true; delete $('#pe-cierres-form').dataset.id; return; }
  $('#pe-cierres-form').dataset.id = id;
  $('#pe-cierres-titulo').textContent = t('per.cierres_titulo', { n: p.nombre });
  $('#pe-cierres').innerHTML = medidores.length ? medidores.map(m => {
    const c = cierres.find(x => x.periodo === id && x.medidor === m.id);
    return `<div class="col"><label class="form-label d-flex align-items-center gap-2" for="cierre-${esc(m.id)}">${puntoMed(m.id)}${esc(m.nombre)}</label>
      <div class="input-group"><input type="number" class="form-control" id="cierre-${esc(m.id)}" data-medidor="${esc(m.id)}" step="any" min="0" inputmode="decimal" value="${c ? c.valor : ''}">
      <span class="input-group-text">${esc(unidadDe(m))}</span></div></div>`;
  }).join('') : `<div class="col text-body-secondary">${t('per.sin_medidores')}</div>`;
  $('#pe-cierres-card').hidden = false;
}

$('#pe-form').addEventListener('submit', async e => {
  e.preventDefault();
  const id = $('#pe-editando').value;
  const body = { nombre: $('#pe-nombre').value, inicio: $('#pe-inicio').value, fin: $('#pe-fin').value };
  if (!await confirmar(t(id ? 'conf.cambios' : 'conf.nuevo'), { detalle: body.nombre })) return;
  try {
    await api(id ? `/api/periodos/${id}` : '/api/periodos', { method: id ? 'PUT' : 'POST', body });
    aviso(t(id ? 'per.actualizado' : 'per.creado'), 'success');
    limpiarFormPer();
    await mostrarPeriodos();
  } catch (err) { aviso(err.message); }
});
$('#pe-cancelar').addEventListener('click', limpiarFormPer);
$('#pe-tabla').addEventListener('click', async e => {
  const bc = e.target.closest('[data-cierres-per]');
  if (bc) { abrirCierres(bc.dataset.cierresPer); $('#pe-cierres-card').scrollIntoView({ behavior: 'smooth' }); return; }
  const be = e.target.closest('[data-editar-per]');
  if (be) {
    const p = periodos.find(x => x.id === be.dataset.editarPer);
    $('#pe-editando').value = p.id;
    $('#pe-nombre').value = p.nombre;
    $('#pe-inicio').value = p.inicio;
    $('#pe-fin').value = p.fin;
    $('#pe-titulo').textContent = t('per.editar');
    $('#pe-guardar').textContent = t('guardar');
    $('#pe-cancelar').hidden = false;
    $('#pe-nombre').focus();
    return;
  }
  const bb = e.target.closest('[data-borrar-per]');
  if (!bb) return;
  const p = periodos.find(x => x.id === bb.dataset.borrarPer);
  if (!await confirmar(t('per.confirmar_borrar', { n: p.nombre }), { peligro: true })) return;
  try {
    await api(`/api/periodos/${p.id}`, { method: 'DELETE' });
    aviso(t('borrado'), 'success');
    if ($('#pe-editando').value === p.id) limpiarFormPer();
    await mostrarPeriodos();
  } catch (err) { aviso(err.message); }
});
$('#pe-cierres-form').addEventListener('submit', async e => {
  e.preventDefault();
  const valores = {};
  document.querySelectorAll('#pe-cierres input[data-medidor]').forEach(i => { valores[i.dataset.medidor] = i.value; });
  if (!await confirmar(t('conf.cambios'))) return;
  try {
    await api(`/api/periodos/${$('#pe-cierres-form').dataset.id}/cierres`, { method: 'PUT', body: { valores } });
    aviso(t('per.cierres_guardados'), 'success');
    await mostrarPeriodos();
  } catch (err) { aviso(err.message); }
});

// ======================================================================
//  Modal de registro
// ======================================================================
let editando = null;
function abrirDialogo(v) {
  if (!estado.sensores.length) return aviso(t('sin_habitaciones'), 'warning');
  editando = v?.id || null;
  $('#dlg-titulo').textContent = t(v ? 'dlg.editar' : 'dlg.nuevo');
  $('#dlg-sensor').value = v?.sensor || $('#v-sensor').value || estado.sensores[0].id;
  $('#dlg-inicio').value = v ? v.inicio.slice(0, 16) : isoLocal(new Date(Date.now() - 15 * 6e4)).slice(0, 16);
  $('#dlg-fin').value = v ? (v.fin || '').slice(0, 16) : isoLocal(new Date()).slice(0, 16);
  $('#dlg-nota').value = v?.nota || '';
  $('#dlg-error').classList.add('d-none');
  modal.show();
}
$('#dlg-form').addEventListener('submit', async e => {
  e.preventDefault();
  const body = { sensor: $('#dlg-sensor').value, inicio: $('#dlg-inicio').value, fin: $('#dlg-fin').value, nota: $('#dlg-nota').value };
  const detalle = `${nombreDe(body.sensor)} · ${fmtFechaHora(body.inicio)}` + (body.fin ? ` – ${fmtFechaHora(body.fin)}` : '');
  if (!await confirmar(t(editando ? 'conf.cambios' : 'conf.nuevo'), { detalle })) return;
  try {
    if (editando) await api(`/api/ventanas/${editando}`, { method: 'PUT', body });
    else await api('/api/ventanas', { method: 'POST', body });
    modal.hide();
    aviso(t('guardado'), 'success');
    await refrescar();
  } catch (err) {
    $('#dlg-error').textContent = err.message;
    $('#dlg-error').classList.remove('d-none');
  }
});

// ======================================================================
//  Ajustes
// ======================================================================
function renderAjustes() {
  $('#a-habitaciones').innerHTML = estado.sensores.length ? estado.sensores.map(s => `<div class="mb-3">
      <div class="input-group">
        <span class="input-group-text">${punto(s.id)}</span>
        <input class="form-control" data-id="${esc(s.id)}" value="${esc(s.nombre_configurado)}" placeholder="${esc(t('sensor'))} ${esc(s.id.slice(-4))}" maxlength="40" aria-label="${esc(s.id)}">
      </div>
      <div class="form-text tabular">${esc(s.id)} · ${num(s.temperatura)} °C · ${s.ultima_lectura ? t('aj.ultima', { h: hace(s.ultima_lectura) }) : t('aj.sin_lecturas')}</div>
    </div>`).join('') : `<p class="text-body-secondary">${t('aj.no_sensores')}</p>`;
  const ms = manuales();
  $('#a-manuales').innerHTML = ms.length ? ms.map(s => `<li class="list-group-item d-flex align-items-center gap-2">
      ${punto(s.id)}<span class="flex-grow-1 text-truncate">${esc(nombreDe(s.id))}</span>
      <button class="btn btn-sm btn-ghost-danger" data-borrar-manual="${esc(s.id)}" title="${esc(t('borrar'))}" aria-label="${esc(t('borrar'))}"><i class="cil-trash"></i></button>
    </li>`).join('') : `<li class="list-group-item small text-body-secondary">${t('manual.ninguno')}</li>`;
  $('#a-intervalo').value = estado.intervalo_minutos;
  $('#a-mudanza').value = estado.fecha_mudanza || '';
  $('#a-temp-min').value = estado.temp_ref?.min ?? 18;
  $('#a-temp-max').value = estado.temp_ref?.max ?? 22;
  $('#a-hum-min').value = estado.humedad_ref?.min ?? 40;
  $('#a-hum-max').value = estado.humedad_ref?.max ?? 60;
  $('#a-ubic-actual').textContent = nombreUbicacion();
  $('#a-resultados').innerHTML = '';
  ubicPendiente = null;
}

async function buscarUbicacion() {
  const q = $('#a-buscar').value.trim();
  if (q.length < 2) return;
  $('#a-resultados').innerHTML = `<div class="list-group-item text-body-secondary">${t('aj.buscando')}</div>`;
  try {
    const res = await api('/api/buscar_ubicacion?' + new URLSearchParams({ q, idioma }));
    $('#a-resultados').innerHTML = res.length
      ? res.map((r, n) => `<button type="button" class="list-group-item list-group-item-action" data-n="${n}"><i class="cil-location-pin me-2"></i>${esc(r.nombre)}</button>`).join('')
      : `<div class="list-group-item text-body-secondary">${t('aj.sin_resultados')}</div>`;
    $('#a-resultados').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      ubicPendiente = res[b.dataset.n];
      $('#a-ubic-actual').innerHTML = `${esc(ubicPendiente.nombre)} <span class="badge text-bg-warning">${t('aj.sin_guardar')}</span>`;
      $('#a-resultados').innerHTML = '';
    };
  } catch (err) { $('#a-resultados').innerHTML = `<div class="list-group-item text-danger">${esc(err.message)}</div>`; }
}
$('#a-buscar-btn').addEventListener('click', buscarUbicacion);

async function crearManual() {
  const nombre = $('#a-manual-nombre').value.trim();
  if (!nombre) return $('#a-manual-nombre').focus();
  if (!await confirmar(t('conf.nuevo'), { detalle: nombre })) return;
  try {
    await api('/api/sensores_manuales', { method: 'POST', body: { nombre } });
    $('#a-manual-nombre').value = '';
    await cargarEstado();
    renderAjustes();
    aviso(t('manual.creado'), 'success');
  } catch (err) { aviso(err.message); }
}
$('#a-manual-crear').addEventListener('click', crearManual);
$('#a-manual-nombre').addEventListener('keydown', e => { if (e.key === 'Enter') crearManual(); });
$('#a-manuales').addEventListener('click', async e => {
  const b = e.target.closest('[data-borrar-manual]');
  if (!b || !await confirmar(t('manual.confirmar_borrar', { n: nombreDe(b.dataset.borrarManual) }), { peligro: true })) return;
  try {
    await api(`/api/sensores_manuales/${b.dataset.borrarManual}`, { method: 'DELETE' });
    await cargarEstado();
    renderAjustes();
    tempCargadas = false;
    aviso(t('manual.borrado'), 'success');
  } catch (err) { aviso(err.message); }
});
$('#a-buscar').addEventListener('keydown', e => { if (e.key === 'Enter') buscarUbicacion(); });

$('#a-guardar').addEventListener('click', async () => {
  const habitaciones = {};
  document.querySelectorAll('#a-habitaciones input').forEach(i => { if (i.value.trim()) habitaciones[i.dataset.id] = i.value.trim(); });
  const body = { habitaciones, intervalo_minutos: Number($('#a-intervalo').value),
                 humedad_ref: { min: Number($('#a-hum-min').value), max: Number($('#a-hum-max').value) },
                 temp_ref: { min: Number($('#a-temp-min').value), max: Number($('#a-temp-max').value) },
                 fecha_mudanza: $('#a-mudanza').value };
  if (ubicPendiente) body.ubicacion = ubicPendiente;
  if (!await confirmar(t('conf.ajustes'))) return;
  try {
    await api('/api/config', { method: 'PUT', body });
    await cargarEstado();
    renderAjustes();
    tempCargadas = false;
    aviso(t('aj.guardados'), 'success');
    redibujarGraficos();
    if (body.ubicacion) setTimeout(() => cargarEstado().catch(() => {}), 3000);
  } catch (err) { aviso(err.message); }
});

// ======================================================================
//  Arranque
// ======================================================================
async function refrescar() {
  await cargarEstado();
  const tab = tabActual();
  if (tab === 'panel') cargarGraficoPanel().catch(err => aviso(err.message));
  if (tab === 'ventanas') cargarVentanas();
  if (tab === 'termostatos') cargarTermostatos();
  if (tab === 'temperaturas') cargarTemperaturas();
}

(async () => {
  prepararFechas();
  traducirPagina();
  guardarIdioma();
  aplicarTema(leerTema());
  $('#t-hasta').value = $('#v-hasta').value = fechaInput(new Date());
  $('#t-desde').value = fechaInput(new Date(Date.now() - 6 * DIA));
  $('#v-desde').value = fechaInput(new Date(Date.now() - 29 * DIA));
  $('#tm-hasta').value = fechaInput(new Date());
  $('#tm-desde').value = fechaInput(new Date(Date.now() - 29 * DIA));
  $('#cs-hasta').value = fechaInput(new Date());
  $('#cs-desde').value = `${new Date().getFullYear()}-01-01`;
  $('#ag-hasta').value = fechaInput(new Date());
  $('#ag-desde').value = fechaInput(new Date(Date.now() - 29 * DIA));
  try { await cargarEstado(); } catch (err) { aviso(err.message); }
  mostrarTab();
  setInterval(() => { if (!document.hidden && !document.querySelector('.modal.show')) cargarEstado().catch(() => {}); }, 30000);
  setInterval(() => { if (!document.hidden && tabActual() === 'panel') cargarGraficoPanel().catch(() => {}); }, 5 * 60000);
})();
</script>
</body>
</html>
