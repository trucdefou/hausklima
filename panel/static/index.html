<script>
  // Aplica el tema antes de pintar para evitar parpadeo
  (() => {
    let t = 'auto';
    try { t = localStorage.getItem('tema') || 'auto'; } catch (e) {}
    const real = t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
    document.documentElement.setAttribute('data-coreui-theme', real);
  })();
</script>

<style>
  /* Transición al cambiar de sección y barra de carga mientras se piden datos */
  @keyframes entrada { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  [id^="tab-"]:not([hidden]) { animation: entrada .3s ease-out; }
  [id^="tab-"] { transition: opacity .2s; }
  body.cargando [id^="tab-"]:not([hidden]) { opacity: .55; pointer-events: none; }
  #barra-carga { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 2000; overflow: hidden; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #barra-carga.activa { opacity: 1; }
  #barra-carga::before { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; background: var(--cui-primary); border-radius: 2px; animation: barra-carga 1.1s ease-in-out infinite; }
  @keyframes barra-carga { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { [id^="tab-"]:not([hidden]) { animation: none; } #barra-carga::before { animation-duration: 3s; } }

  @media (min-width: 992px) { .sidebar.sidebar-fixed:not(.hide) ~ .wrapper { padding-inline-start: var(--cui-sidebar-width, 16rem); } }
  .sidebar-brand { font-weight: 600; font-size: 1.05rem; }
  .nav-icon[class*="cil-"] { font-size: 1.15rem; }
  .temp-grande { font-size: 2.1rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.5px; line-height: 1.1; }
  .punto { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .card-habitacion { border-top-width: 3px; }
  .card-habitacion.abierta { box-shadow: 0 0 0 2px var(--cui-warning); }
  .grafico { position: relative; height: 320px; }
  .tabular { font-variant-numeric: tabular-nums; }
  .table td, .table th { white-space: nowrap; }
  .table td.nota { white-space: normal; min-width: 7rem; max-width: 16rem; overflow-wrap: anywhere; }
  .nota-corta { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  .table .col-efecto { white-space: normal; min-width: 11rem; }

  .termo-escala { position: relative; height: 1.1rem; font-size: .7rem; color: var(--cui-secondary-color); }
  .termo-escala span { position: absolute; transform: translateX(-50%); line-height: 1; }
  .termo-valor { min-width: 2.6rem; text-align: center; }
  .termo-valor.pendiente { opacity: .6; }
  .flatpickr-day.selected, .flatpickr-day.selected:hover { background: var(--cui-primary); border-color: var(--cui-primary); }
  [data-coreui-theme=dark] .flatpickr-calendar { background: var(--cui-tertiary-bg); box-shadow: 0 3px 13px rgba(0,0,0,.5); }
  [data-coreui-theme=dark] .flatpickr-calendar.arrowTop:after { border-bottom-color: var(--cui-tertiary-bg); }
  [data-coreui-theme=dark] .flatpickr-calendar.arrowBottom:after { border-top-color: var(--cui-tertiary-bg); }
  [data-coreui-theme=dark] .flatpickr-months .flatpickr-month, [data-coreui-theme=dark] .flatpickr-current-month,
  [data-coreui-theme=dark] span.flatpickr-weekday, [data-coreui-theme=dark] .flatpickr-day, [data-coreui-theme=dark] .flatpickr-time input,
  [data-coreui-theme=dark] .flatpickr-time .flatpickr-time-separator { color: var(--cui-body-color); fill: var(--cui-body-color); }
  [data-coreui-theme=dark] .flatpickr-months .flatpickr-prev-month svg, [data-coreui-theme=dark] .flatpickr-months .flatpickr-next-month svg { fill: var(--cui-body-color); }
  [data-coreui-theme=dark] .flatpickr-current-month .flatpickr-monthDropdown-months { background: var(--cui-tertiary-bg); }
  [data-coreui-theme=dark] .flatpickr-day.prevMonthDay, [data-coreui-theme=dark] .flatpickr-day.nextMonthDay { color: var(--cui-secondary-color); }
  [data-coreui-theme=dark] .flatpickr-day:hover, [data-coreui-theme=dark] .flatpickr-time input:hover { background: var(--cui-secondary-bg); }
  [data-coreui-theme=dark] .flatpickr-time { border-top-color: var(--cui-border-color); }
  /* En pantallas táctiles los gráficos arrancan bloqueados (se puede deslizar la página por encima); al tocarlos se activan */
  .grafico-velo, .grafico-listo { display: none; }
  @media (pointer: coarse) {
    .grafico:not(.activo) .grafico-velo { display: flex; position: absolute; inset: 0; z-index: 2; align-items: center; justify-content: center;
                                          touch-action: pan-y pinch-zoom; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .grafico-velo .badge { opacity: .85; pointer-events: none; }
    .grafico.activo { outline: 2px solid var(--cui-primary); outline-offset: 4px; border-radius: 2px; }
    .grafico.activo .grafico-listo { display: inline-flex; align-items: center; gap: .25rem; position: absolute; top: -.25rem; right: 0; z-index: 2; }
  }
  /* Pantalla completa de un gráfico: solo la tarjeta (encabezado con controles + gráfico) ocupa toda la pantalla */
  .card.pantalla-completa { position: fixed; inset: 0; z-index: 1060; margin: 0 !important; width: 100vw; height: 100vh; height: 100dvh !important;
                            border-radius: 0; border: 0; display: flex; flex-direction: column; }
  .card.pantalla-completa > .card-header { flex: none; flex-wrap: nowrap !important; overflow-x: auto; padding: .35rem .75rem;
                                           padding-left: max(.75rem, env(safe-area-inset-left)); padding-right: max(.75rem, env(safe-area-inset-right)); }
  .card.pantalla-completa > .card-header > *, .card.pantalla-completa > .card-header .d-flex { flex-wrap: nowrap !important; flex-shrink: 0; white-space: nowrap; }
  .card.pantalla-completa > .card-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: .5rem;
                                         padding-left: max(.5rem, env(safe-area-inset-left)); padding-right: max(.5rem, env(safe-area-inset-right));
                                         padding-bottom: max(.5rem, env(safe-area-inset-bottom)); }
  .card.pantalla-completa > .card-body > :not(.grafico), .card.pantalla-completa > :not(.card-header):not(.card-body) { display: none !important; }
  .card.pantalla-completa [data-pantalla] { position: sticky; right: 0; z-index: 1; margin-left: auto;
                                           background: var(--cui-body-bg); box-shadow: -.75rem 0 .5rem -.25rem var(--cui-body-bg); }
  .card.pantalla-completa .grafico { flex: 1 1 auto; height: auto; min-height: 0; outline: 0; }
  .card.pantalla-completa .grafico-velo, .card.pantalla-completa .grafico-listo { display: none !important; }
  body.con-pantalla-completa { overflow: hidden; }
  .aviso-girar { display: none; }
  @media (pointer: coarse) and (orientation: portrait) {
    .card.pantalla-completa .aviso-girar { display: flex; position: absolute; left: 50%; bottom: max(1rem, env(safe-area-inset-bottom)); transform: translateX(-50%);
                                           z-index: 3; align-items: center; gap: .4rem; pointer-events: none; white-space: nowrap; }
  }

  .modal-backdrop.conf-backdrop { z-index: 1065; }
</style>

const IDIOMAS = Object.keys(I18N);

function idiomaInicial() {
  let i = null;
  try { i = localStorage.getItem('idioma'); } catch (e) {}
  if (IDIOMAS.includes(i)) return i;
  for (const l of navigator.languages || [navigator.language]) {
    const corto = (l || '').slice(0, 2).toLowerCase();
    if (IDIOMAS.includes(corto)) return corto;
  }
  return 'es';
}
let idioma = idiomaInicial();

function t(clave, params = {}) {
  const txt = I18N[idioma][clave] ?? I18N.es[clave] ?? clave;
  return txt.replace(/\{(\w+)\}/g, (_, k) => params[k] ?? '');
}

const $ = s => document.querySelector(s);

// ---------- Gráficos en pantallas táctiles ----------
// Encima de cada gráfico va un "velo" transparente que deja deslizar la página. Al tocarlo, el gráfico se activa
// (zoom con dos dedos, arrastrar, ver valores) hasta tocar "Listo" o cualquier lugar fuera de su tarjeta.
document.querySelectorAll('.grafico').forEach(g => g.insertAdjacentHTML('beforeend',
  `<div class="grafico-velo"><span class="badge text-bg-secondary fw-normal"><i class="cil-touch-app me-1"></i><span data-i18n="grafico.tocar"></span></span></div>
   <button type="button" class="btn btn-sm btn-primary grafico-listo"><i class="cil-check-alt"></i><span data-i18n="grafico.listo"></span></button>`));
// ---------- Pantalla completa ----------
// Botón en el encabezado de cada tarjeta con gráfico. Se intenta pantalla completa real + girar a horizontal
// (Android/Chrome); donde el navegador no lo permite (iPhone) la tarjeta igual ocupa toda la pantalla y,
// si el celular está vertical, se pide girarlo.
document.querySelectorAll('.grafico').forEach(g => {
  const card = g.closest('.card'), cab = card?.querySelector(':scope > .card-header');
  if (!cab) return;
  cab.classList.add('d-flex', 'align-items-center', 'gap-2');
  cab.insertAdjacentHTML('beforeend', `<button type="button" class="btn btn-sm btn-ghost-secondary ${cab.querySelector('.ms-auto, .flex-grow-1') ? '' : 'ms-auto'}" data-pantalla
      data-i18n-aria="grafico.pantalla" data-i18n-title="grafico.pantalla"><i class="cil-fullscreen"></i></button>`);
  g.insertAdjacentHTML('beforeend', `<span class="aviso-girar badge text-bg-dark fw-normal"><i class="cil-screen-smartphone"></i><span data-i18n="grafico.girar"></span></span>`);
});
const elementoFull = () => document.fullscreenElement || document.webkitFullscreenElement;
async function entrarPantallaCompleta(card) {
  card.classList.add('pantalla-completa');
  document.body.classList.add('con-pantalla-completa');
  card.querySelector('.grafico')?.classList.add('activo');   // en pantalla completa el gráfico se usa directo
  actualizarBotonPantalla(card);
  try {
    if (card.requestFullscreen) await card.requestFullscreen({ navigationUI: 'hide' });
    else if (card.webkitRequestFullscreen) card.webkitRequestFullscreen();
  } catch (e) { /* sin pantalla completa real: queda la tarjeta ocupando toda la ventana */ }
  try { await screen.orientation?.lock?.('landscape'); } catch (e) { /* no se puede girar solo: se muestra el aviso */ }
}
function salirPantallaCompleta(card) {
  card.classList.remove('pantalla-completa');
  document.body.classList.remove('con-pantalla-completa');
  const g = card.querySelector('.grafico');
  if (g) desactivarGrafico(g);
  actualizarBotonPantalla(card);
  try { screen.orientation?.unlock?.(); } catch (e) {}
  if (elementoFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document).catch?.(() => {});
}
function actualizarBotonPantalla(card) {
  const b = card.querySelector('[data-pantalla]'), on = card.classList.contains('pantalla-completa');
  b.dataset.i18nAria = b.dataset.i18nTitle = on ? 'grafico.salir_pantalla' : 'grafico.pantalla';
  b.title = t(b.dataset.i18nTitle);
  b.setAttribute('aria-label', b.title);
  b.innerHTML = `<i class="cil-${on ? 'fullscreen-exit' : 'fullscreen'}"></i>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-pantalla]');
  if (!b) return;
  const card = b.closest('.card');
  if (card.classList.contains('pantalla-completa')) salirPantallaCompleta(card); else entrarPantallaCompleta(card);
});
// Si se sale con el botón "atrás"/Esc del navegador, también se cierra la vista
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => {
  if (elementoFull()) return;
  document.querySelectorAll('.card.pantalla-completa').forEach(salirPantallaCompleta);
}));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.querySelector('.modal.show')) document.querySelectorAll('.card.pantalla-completa').forEach(salirPantallaCompleta);
});

function desactivarGrafico(g) {
  g.classList.remove('activo');
  const ch = Chart.getChart(g.querySelector('canvas'));
  if (ch) { ch.setActiveElements([]); ch.tooltip?.setActiveElements([], { x: 0, y: 0 }); ch.update('none'); }   // sin tooltip colgado
}
document.addEventListener('click', e => {

const fmtFechaHora = s => { if (!s) return ''; const d = new Date(s); return `${fmtFecha(d)} ${fmtHora24(d)}`; };
function minutosTexto(min) {

// Campos de fecha: el selector del navegador usa el formato de su configuración (p. ej. MM/DD/YYYY);
// se reemplaza por flatpickr para mostrar siempre TT.MM.JJJJ y 24 h. El valor interno sigue siendo ISO
// (AAAA-MM-DD o AAAA-MM-DDTHH:MM), así el resto del código lee y escribe .value como antes.
const valorNativo = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
const localeCalendario = () => ({ ...((window.flatpickr && flatpickr.l10ns[idioma]) || {}), firstDayOfWeek: 1 });
function prepararFecha(el) {
  if (!window.flatpickr || el._flatpickr || !['date', 'datetime-local'].includes(el.type)) return;
  const conHora = el.type === 'datetime-local';
  flatpickr(el, {
    altInput: true, allowInput: true, disableMobile: true, time_24hr: true, enableTime: conHora,
    // de a 1 minuto: con el paso por defecto (5) el campo de minutos del calendario, que dentro de un modal
    // queda dentro del <form>, es inválido si la hora no es múltiplo de 5 y el navegador bloquea el envío sin avisar
    minuteIncrement: 1,
    dateFormat: conHora ? 'Y-m-d\\TH:i' : 'Y-m-d', altFormat: conHora ? 'd.m.Y H:i' : 'd.m.Y',
    locale: localeCalendario(),
    static: !!el.closest('.modal'),          // dentro de un modal, el calendario va junto al campo
  });
  // si el código asigna .value, el campo visible se actualiza solo
  let sincronizando = false;
  Object.defineProperty(el, 'value', {
    configurable: true,
    get() { return valorNativo.get.call(this); },
    set(v) {
      valorNativo.set.call(this, v);
      if (sincronizando || !this._flatpickr) return;
      sincronizando = true;
      try { this._flatpickr.setDate(v || null, false); } finally { sincronizando = false; }
    },
  });
}
function prepararFechas(raiz = document) {
  raiz.querySelectorAll?.('input[type=date], input[type=datetime-local]').forEach(prepararFecha);
}
new MutationObserver(cambios => cambios.forEach(c => c.addedNodes.forEach(n => {
  if (n.nodeType !== 1) return;
  if (n.matches('input[type=date], input[type=datetime-local]')) prepararFecha(n); else prepararFechas(n);
}))).observe(document.body, { childList: true, subtree: true });

// Barra de carga: solo aparece si una petición tarda más de un instante, para no parpadear en las rápidas
let peticiones = 0, temporizadorCarga = null;
function cargaMas(n) {
  peticiones = Math.max(0, peticiones + n);
  if (peticiones > 0 && !temporizadorCarga) {
    temporizadorCarga = setTimeout(() => {
      $('#barra-carga')?.classList.add('activa');
      if (tabActual() !== 'panel') document.body.classList.add('cargando');
    }, 150);
  } else if (peticiones === 0) {
    clearTimeout(temporizadorCarga); temporizadorCarga = null;
    $('#barra-carga')?.classList.remove('activa');
    document.body.classList.remove('cargando');
  }
}
async function api(url, { silencioso, ...opts } = {}) {
  if (!silencioso) cargaMas(1);
  try {
    const r = await fetch(url, {
      ...opts,
      headers: { 'Content-Type': 'application/json' },
      body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
    });
    if (r.status === 401) { location.href = '/login'; throw new Error(t('err.sesion')); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error ? t(d.error) : t('err.http', { n: r.status }));
    return d;
  } finally { if (!silencioso) cargaMas(-1); }
}

const FILAS_POR_PAGINA = 25;
const paginaActual = {};   // id de tabla -> página (desde 0); se conserva al refrescar los datos

function paginaDe(id, total) {
  const ultima = Math.max(Math.ceil(total / FILAS_POR_PAGINA) - 1, 0);
  return paginaActual[id] = Math.min(paginaActual[id] || 0, ultima);
}

function dibujarPaginador(id, tabla, total, alCambiar) {
  const pag = paginaDe(id, total), paginas = Math.ceil(total / FILAS_POR_PAGINA);
  let nav = document.getElementById(`pag-${id}`);
  if (!nav) {
    nav = document.createElement('div');
    nav.id = `pag-${id}`;
    nav.className = 'd-flex flex-wrap justify-content-between align-items-center gap-2 px-3 py-2 small text-body-secondary border-top';
    (tabla.closest('.table-responsive') || tabla).after(nav);
    nav.addEventListener('click', e => {
      const b = e.target.closest('button[data-pag]');
      if (!b || b.disabled) return;
      paginaActual[id] = Number(b.dataset.pag);
      nav.alCambiar();
    });
  }
  nav.alCambiar = alCambiar;
  nav.classList.toggle('d-none', total <= FILAS_POR_PAGINA);
  nav.classList.toggle('d-flex', total > FILAS_POR_PAGINA);
  const boton = (texto, clave, destino, activo) => `<li class="page-item ${activo ? '' : 'disabled'}">
    <button class="page-link" type="button" data-pag="${destino}" aria-label="${esc(t(clave))}" title="${esc(t(clave))}" ${activo ? '' : 'disabled'}>${texto}</button></li>`;
  nav.innerHTML = `<span class="tabular">${t('pag.rango', { a: entero(pag * FILAS_POR_PAGINA + 1), b: entero(Math.min((pag + 1) * FILAS_POR_PAGINA, total)), n: entero(total) })}</span>
    <ul class="pagination pagination-sm mb-0">
      ${boton('«', 'pag.primera', 0, pag > 0)}${boton('‹', 'pag.anterior', pag - 1, pag > 0)}
      <li class="page-item disabled"><span class="page-link tabular">${t('pag.pagina', { p: entero(pag + 1), n: entero(paginas) })}</span></li>
      ${boton('›', 'pag.siguiente', pag + 1, pag < paginas - 1)}${boton('»', 'pag.ultima', paginas - 1, pag < paginas - 1)}
    </ul>`;
}

// Para tablas ya dibujadas: oculta las filas de las otras páginas (tabla completa o directamente su <tbody>)
function paginarTabla(selector) {
  const el = $(selector), cuerpo = el.tagName === 'TBODY' ? el : el.tBodies[0], tabla = cuerpo.closest('table');
  const id = selector.slice(1), filas = [...cuerpo.rows];
  const mostrar = () => {
    const desde = paginaDe(id, filas.length) * FILAS_POR_PAGINA;
    filas.forEach((f, i) => { f.hidden = i < desde || i >= desde + FILAS_POR_PAGINA; });
    dibujarPaginador(id, tabla, filas.length, mostrar);
  };
  mostrar();
}

  estado = await api('/api/estado', { silencioso });

  estado.sensores.sort((a, b) => nombreDe(a.id).localeCompare(nombreDe(b.id), idioma));

// Tiempo real: cada segundos_vivo (Ajustes) se consulta una versión liviana y se actualiza solo si llegó un dato nuevo.
// Cada 30 s como mínimo se recarga igual, por lo que no sube la versión (clima, ventanas abiertas desde otro dispositivo).
// Se pausa con un modal abierto, con un clic o arrastre en curso y al escribir en un campo, para no mover nada bajo el usuario.
const MS_RECARGA_MINIMA = 30000;
let versionVivo = null, ultimaRecarga = Date.now(), punteroPresionado = false;
document.addEventListener('pointerdown', () => { punteroPresionado = true; }, true);
for (const ev of ['pointerup', 'pointercancel']) document.addEventListener(ev, () => { punteroPresionado = false; }, true);

async function seguirEnVivo() {
  if (document.hidden || punteroPresionado || document.querySelector('.modal.show')
      || document.activeElement?.matches('select, textarea, input:not([type=range])')) return;
  try {
    const { version } = await api('/api/vivo', { silencioso: true });
    const cambio = version !== versionVivo;
    if (!cambio && Date.now() - ultimaRecarga < MS_RECARGA_MINIMA) return;
    await cargarEstado(true);
    versionVivo = version;
    ultimaRecarga = Date.now();
    if (cambio && tabActual() === 'panel' && ultimoDibujo['graf-panel']) dibujar('graf-panel', ...ultimoDibujo['graf-panel']);
  } catch { /* se reintenta en la próxima vuelta */ }
}

// setTimeout encadenado: toma enseguida un intervalo nuevo y nunca se solapan dos consultas
function programarVivo() {
  setTimeout(async () => { await seguirEnVivo(); programarVivo(); }, (estado?.segundos_vivo || 10) * 1000);
}

// Color según la distancia al rango recomendado: dentro = verde, hasta la tolerancia = amarillo, más lejos = rojo
const TOLERANCIA_REF = { temperatura: 2, humedad: 10 };
function claseRango(metrica, valor) {
  if (valor == null) return '';
  const met = METRICAS[metrica], ref = estado[met.ref] || met.refDef;
  const dist = valor < ref.min ? ref.min - valor : valor > ref.max ? valor - ref.max : 0;
  return dist === 0 ? 'text-success' : dist <= TOLERANCIA_REF[metrica] ? 'text-warning' : 'text-danger';
}

// Ajuste del termostato: se guarda solo el valor final (al soltar el deslizador o ~1 s después del último − / +)
const termoPendiente = {};
function mostrarNivel(cont, n) {
  const badge = cont.querySelector('.termo-valor');
  badge.innerHTML = fmtNivel(n);
  badge.className = `badge ${n === 0 ? 'text-bg-secondary' : 'text-bg-danger'} ms-auto termo-valor fs-6 pendiente`;
}
function programarNivel(cont, espera) {
  const sensor = cont.dataset.termo;
  clearTimeout(termoPendiente[sensor]);
  termoPendiente[sensor] = setTimeout(async () => {
    delete termoPendiente[sensor];
    const nivel = Number(cont.querySelector('input[type=range]').value);
    if (String(nivel) === cont.dataset.actual) return refrescar();   // volvió al mismo valor: nada que guardar
    termoPendiente[sensor] = 0;   // mientras se confirma, que el refresco automático no redibuje la tarjeta
    const ok = await confirmar(t('conf.termo', { h: nombreDe(sensor), n: fmtNivel(nivel, false) }));
    delete termoPendiente[sensor];
    if (!ok) return refrescar();
    try {
      await api('/api/termostatos', { method: 'POST', body: { sensor, nivel } });
      aviso(t('termo.guardado'), 'success');
    } catch (err) { aviso(err.message); }
    await refrescar();
  }, espera);
}
$('#tarjetas').addEventListener('input', e => {
  const cont = e.target.closest('[data-termo]');
  if (!cont || e.target.type !== 'range') return;
  mostrarNivel(cont, Number(e.target.value));
  clearTimeout(termoPendiente[cont.dataset.termo]);
  termoPendiente[cont.dataset.termo] = 0;   // en curso: que el refresco automático no redibuje la tarjeta
});
$('#tarjetas').addEventListener('change', e => {
  const cont = e.target.closest('[data-termo]');
  if (cont && e.target.type === 'range') programarNivel(cont, 400);
});

$('#tarjetas').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.lectura) return abrirDialogoLectura(b.dataset.lectura);
  if (b.dataset.paso) {
    const cont = b.closest('[data-termo]'), rango = cont.querySelector('input[type=range]');
    rango.value = Math.min(5, Math.max(0, Number(rango.value) + 0.5 * Number(b.dataset.paso)));
    mostrarNivel(cont, Number(rango.value));
    return programarNivel(cont, 1200);
  }
  const sensorVentana = b.dataset.abrir || estado.sensores.find(s => s.ventana_abierta?.id === b.dataset.cerrar)?.id;
  if (!await confirmar(t(b.dataset.abrir ? 'conf.abrir' : 'conf.cerrar', { h: nombreDe(sensorVentana) }))) return;
  b.disabled = true;
  try {
    if (b.dataset.abrir) await api('/api/ventanas', { method: 'POST', body: { sensor: b.dataset.abrir } });
    else if (b.dataset.cerrar) await api(`/api/ventanas/${b.dataset.cerrar}/cerrar`, { method: 'POST' });

});

async function cargarGraficoPanel() {
  // El día de hoy, de 00:00 a 24:00: los datos llegan hasta ahora y la línea avanza con el día
  const hasta = new Date(), desde = new Date(); desde.setHours(0, 0, 0, 0);
  const finDia = new Date(desde.getFullYear(), desde.getMonth(), desde.getDate() + 1).getTime();
  const q = new URLSearchParams({ desde: isoLocal(desde), hasta: isoLocal(hasta) });
  const [d, v, tm] = await Promise.all([api('/api/temperaturas?' + q), api('/api/ventanas?' + q), api('/api/termostatos?' + q)]);
  d.termostatos = tm;
  dibujar('graf-panel', d, v, [desde.getTime(), finDia]);
  cargarConsumo24().catch(err => aviso(err.message));
}

// Consumo acumulado de calefacción del día de hoy (00:00 a 24:00), por habitación. La línea de hoy se dibuja hasta ahora
// y avanza con el día. Parte de 0 a las 00:00; si la lectura anterior cae fuera, el primer tramo se reparte proporcionalmente.
async function cargarConsumo24() {
  await cargarMedidores();
  const ahora = Date.now(), medianoche = new Date(); medianoche.setHours(0, 0, 0, 0);
  const ini = medianoche.getTime(), fin = new Date(medianoche.getFullYear(), medianoche.getMonth(), medianoche.getDate() + 1).getTime();
  const datasets = [];
  const hora = l => new Date(l.fecha_hora).getTime();
  // Puntos (x, consumo acumulado) de un medidor entre ini y fin; null si no hay lecturas suficientes
  const serie = (filas, ini, fin, hastaAhora = false) => {
    let i0 = filas.findLastIndex(l => hora(l) <= ini);
    if (i0 < 0) i0 = filas.findIndex(l => hora(l) > ini);
    const dentro = i0 < 0 ? [] : filas.slice(i0 + 1).filter(l => hora(l) > ini && hora(l) <= fin);
    if (i0 < 0 || !dentro.length) return null;
    const base = filas[i0], pts = [];
    let aporte = 0;   // lo consumido entre la lectura base y el inicio de la ventana, que no cuenta
    if (hora(base) < ini) {
      pts.push({ x: ini, y: 0 });
      const prim = dentro[0], parte = (hora(prim) - ini) / (hora(prim) - hora(base));
      aporte = (1 - parte) * (prim.acumulado - base.acumulado);
    } else pts.push({ x: hora(base), y: 0 });
    for (const l of dentro) pts.push({ x: hora(l), y: l.acumulado - base.acumulado - aporte });
    if (!hastaAhora) pts.push({ x: fin, y: pts[pts.length - 1].y });   // hoy termina en la última lectura real
    return pts;
  };
  for (const m of medidores) {
    const filas = lecturasMed.filter(l => l.medidor === m.id && !l.virtual)
      .sort((a, b) => a.fecha_hora.localeCompare(b.fecha_hora));
    const hoy = serie(filas, ini, ahora, true), ayer = serie(filas, ini - DIA, ini);
    const punto = n => ctx => ctx.dataIndex === 0 || ctx.dataIndex === n - 1 ? 0 : 3;
    // El día anterior se dibuja desplazado 24 h, para compararlo hora a hora con hoy (de 00:00 a 24:00)
    if (ayer) datasets.push({ label: t('panel.consumo24_ayer', { n: m.nombre }), unidad: unidadDe(m), ayer: true,
      data: ayer.map(p => ({ x: p.x + DIA, y: p.y })), borderColor: colorMed[m.id], backgroundColor: colorMed[m.id],
      borderWidth: 1.5, borderDash: [5, 4], pointRadius: punto(ayer.length), tension: 0 });
    if (hoy) datasets.push({ label: m.nombre, unidad: unidadDe(m), data: hoy, borderColor: colorMed[m.id], backgroundColor: colorMed[m.id],
      borderWidth: 2, pointRadius: punto(hoy.length), tension: 0 });
  }
  $('#consumo24-vacio').hidden = datasets.length > 0;
  $('.grafico:has(#graf-consumo24)').hidden = datasets.length === 0;
  graficos['graf-consumo24']?.destroy();
  delete graficos['graf-consumo24'];
  if (!datasets.length) return;
  const css = getComputedStyle(document.documentElement);
  const texto = css.getPropertyValue('--cui-body-color').trim() || '#666';
  const grid = css.getPropertyValue('--cui-border-color-translucent').trim() || 'rgba(0,0,0,.1)';
  graficos['graf-consumo24'] = new Chart(document.getElementById('graf-consumo24'), {
    type: 'line', data: { datasets },
    options: {
      animation: false, maintainAspectRatio: false, parsing: false,
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      scales: {
        x: { type: 'linear', min: ini, max: fin, grid: { color: grid },
             afterBuildTicks: eje => { eje.ticks = marcasTiempo(eje.min, eje.max); },
             ticks: { color: texto, maxRotation: 0, callback(v) { return etiquetaEje(v, this.max - this.min); } } },
        y: { beginAtZero: true, grace: '5%', grid: { color: grid }, ticks: { color: texto, includeBounds: false } },
      },
      plugins: {
        legend: { labels: { color: texto, boxWidth: 14, boxHeight: 2 } },
        tooltip: { callbacks: {
          title: it => it.length ? fmtFechaHora(isoLocal(new Date(it[0].parsed.x - (it[0].dataset.ayer ? DIA : 0)))) : '',
          label: it => `${it.dataset.label}: +${num(it.parsed.y, Number.isInteger(it.parsed.y) ? 0 : 1)} ${it.dataset.unidad}`,
        } },
      },
    },
  });
}

// Aperturas de ventana: línea vertical al abrir, otra al cerrar y la zona del medio sombreada.
// Mientras sigue abierta solo se ve la línea de apertura y la sombra llega hasta "ahora".
const bandasPlugin = {
  id: 'bandas',
  beforeDatasetsDraw(chart, args, opts) {
    const { ctx, chartArea: a, scales: { x } } = chart;
    // Se oculta solo si la habitación tiene línea en el gráfico y la ocultaste desde la leyenda
    const conLinea = new Set(chart.data.datasets.map(d => d.sid));
    const visibles = new Set(chart.data.datasets.filter((d, i) => chart.isDatasetVisible(i)).map(d => d.sid));
    ctx.save();
    ctx.beginPath(); ctx.rect(a.left, a.top, a.right - a.left, a.bottom - a.top); ctx.clip();
    const linea = px => { ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke(); };
    for (const b of opts.bandas || []) {
      if (conLinea.has(b.sid) && !visibles.has(b.sid)) continue;
      const x1 = x.getPixelForValue(b.desde), x2 = x.getPixelForValue(b.hasta);
      if (x2 < a.left || x1 > a.right) continue;
      ctx.globalAlpha = 0.15;
      ctx.fillStyle = b.color;
      ctx.fillRect(x1, a.top, Math.max(x2 - x1, 1), a.bottom - a.top);
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([]);
      linea(x1);
      if (!b.abierta) linea(x2);
      ctx.globalAlpha = 1;
      ctx.fillStyle = b.color;
      ctx.font = '600 11px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.textBaseline = 'top';
      ctx.fillText(b.nombre, Math.max(x1, a.left) + 4, a.top + 4 + b.fila * 14);
    }
    ctx.restore();
  },
};
const sinDatosPlugin = {
  id: 'sinDatos',
  afterDraw(chart) {
    if (chart.data.datasets.length) return;
    const { ctx, chartArea: a } = chart;
    ctx.save(); ctx.fillStyle = chart.options.scales.x.ticks.color; ctx.textAlign = 'center';
    ctx.fillText(t('sin_datos_periodo'), (a.left + a.right) / 2, (a.top + a.bottom) / 2); ctx.restore();
  },
};
// El cuadro de valores (tooltip) solo se ve mientras el puntero está sobre el gráfico:
// con mouse se oculta al salir; en pantallas táctiles, 1,5 s después de levantar el dedo.
const ocultarTooltipPlugin = {
  id: 'ocultarTooltip',
  afterInit(chart) {
    let temporizador;
    const ocultar = () => {
      clearTimeout(temporizador);
      if (!chart.tooltip?.getActiveElements().length) return;
      chart.tooltip.setActiveElements([], { x: 0, y: 0 });
      chart.setActiveElements([]);
      chart.update('none');
    };
    chart.$escuchas = [
      ['mouseleave', ocultar],
      ['touchcancel', ocultar],
      ['touchstart', () => clearTimeout(temporizador)],
      ['touchend', () => { clearTimeout(temporizador); temporizador = setTimeout(ocultar, 1500); }],
    ];
    chart.$escuchas.forEach(([ev, fn]) => chart.canvas.addEventListener(ev, fn, { passive: true }));
  },
  beforeDestroy(chart) {
    chart.$escuchas?.forEach(([ev, fn]) => chart.canvas.removeEventListener(ev, fn));
  },
};
// Líneas de referencia (rango recomendado de humedad): franja suave y dos líneas punteadas con su valor
const referenciasPlugin = {
  id: 'referencias',
  beforeDatasetsDraw(chart, args, opts) {
    if (!opts?.rango) return;
    const { ctx, chartArea: a, scales: { y } } = chart;
    const color = opts.color || '#2eb85c';
    const yMin = y.getPixelForValue(opts.rango.min), yMax = y.getPixelForValue(opts.rango.max);
    ctx.save();
    ctx.beginPath(); ctx.rect(a.left, a.top, a.right - a.left, a.bottom - a.top); ctx.clip();
    ctx.globalAlpha = 0.07;
    ctx.fillStyle = color;
    ctx.fillRect(a.left, Math.min(yMin, yMax), a.right - a.left, Math.abs(yMin - yMax));
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 4]);
    for (const py of [yMax, yMin]) {
      if (py < a.top || py > a.bottom) continue;
      ctx.beginPath(); ctx.moveTo(a.left, py); ctx.lineTo(a.right, py); ctx.stroke();
    }
    ctx.restore();
  },
  // Las etiquetas van encima de las líneas de datos, con fondo para que se lean
  afterDatasetsDraw(chart, args, opts) {
    if (!opts?.rango) return;
    const { ctx, chartArea: a, scales: { y } } = chart;
    const color = opts.color || '#2eb85c';
    const fondo = getComputedStyle(document.documentElement).getPropertyValue('--cui-body-bg').trim() || '#fff';
    ctx.save();
    ctx.font = '600 11px system-ui, -apple-system, "Segoe UI", sans-serif';
    ctx.textBaseline = 'middle';
    for (const [valor, texto, abajo] of [[opts.rango.max, opts.textoMax, false], [opts.rango.min, opts.textoMin, true]]) {
      const py = y.getPixelForValue(valor);
      if (py < a.top || py > a.bottom) continue;
      const ancho = ctx.measureText(texto).width + 10, alto = 16;
      const x = a.left + 4, cy = py + (abajo ? alto / 2 + 2 : -alto / 2 - 2);
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = fondo;
      ctx.beginPath(); ctx.roundRect(x, cy - alto / 2, ancho, alto, 4); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = color;
      ctx.fillText(texto, x + 5, cy);
    }
    ctx.restore();
  },
};
Chart.register(bandasPlugin, sinDatosPlugin, ocultarTooltipPlugin, referenciasPlugin);
if (window.ChartZoom) Chart.register(window.ChartZoom);

// Magnitudes que se pueden graficar con el mismo gráfico
const METRICAS = {
  temperatura: { unidad: '°C', dec: 1, limites: { min: -60, max: 120, minRange: 0.5 }, ref: 'temp_ref', refDef: { min: 18, max: 22 }, margenRef: 1 },
  humedad: { unidad: '%', dec: 0, limites: { min: 0, max: 100, minRange: 2 }, ref: 'humedad_ref', refDef: { min: 40, max: 60 }, margenRef: 3 },
};

function seriesDe(datos, campo = 'temperatura') {
  const i = Object.fromEntries(datos.columnas.map((c, n) => [c, n]));
  const series = {};
  for (const f of datos.filas) {
    const y = parseFloat(f[i[campo]]);
    if (isNaN(y)) continue;
    (series[f[i.sensor]] ??= []).push({ x: new Date(f[i.fecha_hora]).getTime(), y });
  }
  return series;
}

// Agrega al final de cada línea la última lectura recibida, aunque todavía no se haya guardado. Solo se dibuja: el
// registro sigue guardando según su intervalo.
function agregarPuntosVivos(series, campo, rango) {
  for (const s of estado.sensores) {
    const y = parseFloat(s[campo]);
    if (s.manual || s.conexion === 'offline' || !s.ultima_lectura || isNaN(y)) continue;
    const x = new Date(s.ultima_lectura).getTime(), linea = series[s.id] ??= [];
    if (x >= rango[0] && x > (linea.at(-1)?.x ?? -Infinity)) linea.push({ x, y });
  }
}

// Marcas del eje en horarios "redondos" según el rango visible (de 5 min a 30 días), en hora local
function marcasTiempo(min, max) {
  const M = 6e4, H = 36e5;
  const pasos = [5 * M, 10 * M, 15 * M, 30 * M, H, 2 * H, 3 * H, 6 * H, 12 * H, DIA, 2 * DIA, 7 * DIA, 14 * DIA, 30 * DIA];
  const paso = pasos.find(p => (max - min) / p <= 8) || pasos[pasos.length - 1];
  const d = new Date(min);
  d.setSeconds(0, 0);
  if (paso >= DIA) d.setHours(0, 0);
  else if (paso >= H) { d.setMinutes(0); d.setHours(Math.ceil(d.getHours() / (paso / H)) * (paso / H)); }
  else d.setMinutes(Math.ceil(d.getMinutes() / (paso / M)) * (paso / M));
  const res = [];
  for (let x = d.getTime(); x <= max && res.length < 60; ) {
    if (x >= min) res.push({ value: x });
    if (paso >= DIA) { const n = new Date(x); n.setDate(n.getDate() + paso / DIA); x = n.getTime(); } else x += paso;
  }
  return res;
}

function etiquetaEje(v, rango) {
  const d = new Date(v);
  const fecha = fmtDiaMes(d);
  const hora = fmtHora24(d);
  if (!d.getHours() && !d.getMinutes()) return fecha;      // medianoche: mostrar el día
  return rango > 1.5 * DIA ? `${fecha} ${hora}` : hora;
}

// Nivel del termostato como escalones: cada cambio vale hasta el siguiente (o hasta "ahora")
function seriesTermostato(regs, rango) {
  const fin = Math.min(Date.now(), rango[1]);
  const res = {};
  for (const r of regs) {
    const pts = (res[r.sensor] ??= []);
    const x = Math.max(new Date(r.fecha_hora).getTime(), rango[0]);
    if (pts.length && pts[pts.length - 1].x === x) pts.pop();  // el que regía antes del rango queda pisado
    pts.push({ x, y: Number(r.nivel) });
  }
  for (const pts of Object.values(res)) {
    const ult = pts[pts.length - 1];
    if (ult.x < fin) pts.push({ x: fin, y: ult.y });
  }
  return res;
}

// Si hay datos solo de una parte del período, el eje empieza donde empiezan los datos
// (con un margen y mostrando como mínimo 1 hora), para que no quede todo apretado contra el borde.
function inicioSegunDatos(datos, ventanas, inicio, fin) {
  let primero = Infinity;
  for (const pts of Object.values(seriesDe(datos))) if (pts.length) primero = Math.min(primero, pts[0].x);
  for (const v of ventanas) primero = Math.min(primero, Math.max(new Date(v.inicio).getTime(), inicio));
  if (!isFinite(primero)) return inicio;
  const margen = Math.max((fin - primero) * 0.05, 5 * 6e4);
  return Math.max(inicio, Math.min(primero - margen, fin - 36e5));
}

const ultimoDibujo = {};
function redibujarGraficos() {
  for (const id in ultimoDibujo) dibujar(id, ...ultimoDibujo[id]);
  if (tabActual() === 'consumo' && typeof renderConsumo === 'function') renderConsumo();
  if (tabActual() === 'agua' && typeof renderAgua === 'function') renderAgua();
}

// Preferencias de vista por gráfico (eje del zoom y rango del eje Y), recordadas en este navegador
const VISTA_DEF = { modo: 'x', metrica: 'temperatura', ejes: {}, termostatos: true, ventanas: true, referencia: true };
// Rango del eje Y de la magnitud que se está viendo (cada magnitud recuerda el suyo)
function ejeY(v) {
  v.ejes ??= {};
  return v.ejes[v.metrica] ??= { yAuto: true, yMin: '', yMax: '' };
}
const vistas = {};
function vistaDe(id) {
  if (!vistas[id]) {
    let v = {};
    try { v = JSON.parse(localStorage.getItem('vista-' + id) || '{}'); } catch (e) {}
    vistas[id] = { ...VISTA_DEF, ...v };
  }
  return vistas[id];
}
function guardarVista(id) { try { localStorage.setItem('vista-' + id, JSON.stringify(vistas[id])); } catch (e) {} }
const numOVacio = v => (v === '' || v == null || isNaN(v)) ? undefined : Number(v);

function htmlControles(id) {
  const v = vistaDe(id), ey = ejeY(v);
  const metrica = m => `<button type="button" class="btn btn-outline-secondary ${v.metrica === m ? 'active' : ''}" data-metrica="${m}" aria-pressed="${v.metrica === m}">${t('grafico.' + m)}</button>`;
  const modo = m => `<button type="button" class="btn btn-outline-secondary ${v.modo === m ? 'active' : ''}" data-modo="${m}" aria-pressed="${v.modo === m}">${{ x: 'X', y: 'Y', xy: 'X+Y' }[m]}</button>`;
  const capa = k => `<button type="button" class="btn btn-outline-secondary ${v[k] ? 'active' : ''}" data-capa="${k}" aria-pressed="${!!v[k]}">${t('grafico.' + k)}</button>`;
  return `<div class="d-flex flex-wrap align-items-center gap-2 small">
    <div class="btn-group btn-group-sm" role="group" aria-label="${esc(t('grafico.magnitud'))}">${metrica('temperatura')}${metrica('humedad')}</div>
    <div class="vr mx-1 d-none d-sm-block"></div>
    <span class="text-body-secondary">${t('grafico.zoom_eje')}</span>
    <div class="btn-group btn-group-sm" role="group" aria-label="${esc(t('grafico.zoom_eje'))}">${modo('x')}${modo('y')}${modo('xy')}</div>
    <div class="btn-group btn-group-sm" role="group">
      <button type="button" class="btn btn-outline-secondary" data-zoom="out" title="${esc(t('grafico.alejar'))}" aria-label="${esc(t('grafico.alejar'))}"><i class="cil-zoom-out"></i></button>
      <button type="button" class="btn btn-outline-secondary" data-zoom="in" title="${esc(t('grafico.acercar'))}" aria-label="${esc(t('grafico.acercar'))}"><i class="cil-zoom-in"></i></button>
    </div>
    <div class="vr mx-1 d-none d-sm-block"></div>
    <span class="text-body-secondary">${t('grafico.eje_y')}</span>
    <div class="form-check form-switch mb-0">
      <input class="form-check-input" type="checkbox" role="switch" id="yauto-${id}" data-yauto ${ey.yAuto ? 'checked' : ''}>
      <label class="form-check-label" for="yauto-${id}">${t('grafico.auto')}</label>
    </div>
    <input type="number" class="form-control form-control-sm" style="width:5.2rem" step="0.5" data-ymin value="${esc(ey.yMin)}" placeholder="${esc(t('min'))}" aria-label="${esc(t('grafico.eje_y') + ' ' + t('min'))}" ${ey.yAuto ? 'disabled' : ''}>
    <input type="number" class="form-control form-control-sm" style="width:5.2rem" step="0.5" data-ymax value="${esc(ey.yMax)}" placeholder="${esc(t('max'))}" aria-label="${esc(t('grafico.eje_y') + ' ' + t('max'))}" ${ey.yAuto ? 'disabled' : ''}>
    <div class="vr mx-1 d-none d-sm-block"></div>
    <span class="text-body-secondary">${t('grafico.mostrar')}</span>

    <button type="button" class="btn btn-sm btn-outline-secondary" data-reset="${id}" hidden><i class="cil-zoom-out me-1"></i>${t('grafico.reset')}</button>
  </div>`;
}
function renderControles() {
  document.querySelectorAll('[data-controles]').forEach(el => {
    el.innerHTML = htmlControles(el.dataset.controles);
    actualizarBotonReset(el.dataset.controles);
  });
}

document.addEventListener('click', e => {
  const cont = e.target.closest('[data-controles]');
  if (!cont) return;
  const id = cont.dataset.controles, chart = graficos[id], v = vistaDe(id);
  const bMet = e.target.closest('[data-metrica]');
  if (bMet) {
    if (v.metrica === bMet.dataset.metrica) return;
    v.metrica = bMet.dataset.metrica;
    guardarVista(id);
    cont.innerHTML = htmlControles(id);      // el eje Y muestra el rango guardado de la otra magnitud
    if (ultimoDibujo[id]) dibujar(id, ...ultimoDibujo[id], { mantenerY: false });
    if (id === 'graf-temp' && ultimoDibujo[id]) renderResumenTemp(ultimoDibujo[id][0]);
    return;
  }
  const bCapa = e.target.closest('[data-capa]');
  if (bCapa) {
    const k = bCapa.dataset.capa;
    v[k] = !v[k];
    guardarVista(id);
    bCapa.classList.toggle('active', v[k]);
    bCapa.setAttribute('aria-pressed', v[k]);
    if (ultimoDibujo[id]) dibujar(id, ...ultimoDibujo[id]);
    return;
  }
  const bModo = e.target.closest('[data-modo]');
  if (bModo) {
    v.modo = bModo.dataset.modo;
    guardarVista(id);
    cont.querySelectorAll('[data-modo]').forEach(b => { b.classList.toggle('active', b === bModo); b.setAttribute('aria-pressed', b === bModo); });
    if (chart) {
      chart.options.plugins.zoom.zoom.mode = v.modo;
      chart.options.plugins.zoom.pan.mode = v.modo;
      chart.update('none');
    }
    return;
  }
  const bZoom = e.target.closest('[data-zoom]');
  if (bZoom && chart) {
    chart.zoom(bZoom.dataset.zoom === 'in' ? 1.25 : 0.8);
    actualizarBotonReset(id);
  }
});

document.addEventListener('change', e => {
  const cont = e.target.closest('[data-controles]');
  if (!cont || !e.target.matches('[data-yauto], [data-ymin], [data-ymax]')) return;
  const id = cont.dataset.controles, chart = graficos[id], v = vistaDe(id);
  const mn = cont.querySelector('[data-ymin]'), mx = cont.querySelector('[data-ymax]');
  const ey = ejeY(v);
  ey.yAuto = cont.querySelector('[data-yauto]').checked;
  mn.disabled = mx.disabled = ey.yAuto;
  if (!ey.yAuto && chart) {  // al pasar a rango fijo, se parte del rango que se ve ahora
    if (mn.value === '') mn.value = Math.floor(chart.scales.y.min);
    if (mx.value === '') mx.value = Math.ceil(chart.scales.y.max);
  }
  if (!ey.yAuto && Number(mn.value) >= Number(mx.value)) return aviso(t('grafico.rango_invalido'), 'warning');
  ey.yMin = mn.value;
  ey.yMax = mx.value;
  guardarVista(id);
  if (ultimoDibujo[id]) dibujar(id, ...ultimoDibujo[id], { mantenerY: false });
});

function actualizarBotonReset(id) {
  const b = document.querySelector(`[data-reset="${id}"]`);
  if (b) b.hidden = !graficos[id]?.isZoomedOrPanned?.();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-reset]');
  if (!b) return;
  graficos[b.dataset.reset]?.resetZoom();
  b.hidden = true;
});

function dibujar(id, datos, ventanas, rango, opciones = {}) {
  ultimoDibujo[id] = [datos, ventanas, rango];
  const vista = vistaDe(id);
  const ey = ejeY(vista), met = METRICAS[vista.metrica] || METRICAS.temperatura;
  const ref = estado[met.ref] || met.refDef;
  const yConfig = { min: ey.yAuto ? undefined : numOVacio(ey.yMin), max: ey.yAuto ? undefined : numOVacio(ey.yMax) };
  // Al refrescar se conserva el zoom (en X y en Y por separado) y las series ocultas desde la leyenda
  const previo = graficos[id];
  let zoomX = null, zoomY = null;
  if (previo?.$config) {
    const o = previo.options.scales, c = previo.$config;
    if (o.x.min !== c.x.min || o.x.max !== c.x.max) zoomX = { min: previo.scales.x.min, max: previo.scales.x.max };
    if (opciones.mantenerY !== false && (o.y.min !== c.y.min || o.y.max !== c.y.max)) zoomY = { min: previo.scales.y.min, max: previo.scales.y.max };
  }
  const ocultos = new Set(previo ? previo.data.datasets.filter((d, i) => !previo.isDatasetVisible(i)).map(d => d.sid) : []);

  const series = seriesDe(datos, vista.metrica);
  if (id === 'graf-panel') agregarPuntosVivos(series, vista.metrica, rango);
  const orden = Object.keys(series).sort((a, b) => a === 'afuera' ? 1 : b === 'afuera' ? -1 : nombreDe(a).localeCompare(nombreDe(b), idioma));
  // Los sensores Zigbee cortan la línea cuando faltan lecturas; los manuales son puntos sueltos y se unen siempre
  const huecoZigbee = Math.max(3 * (estado.intervalo_minutos || 10), 30) * 6e4;
  const datasets = orden.map(sid => {
    const manual = esManual(sid);
    return {
      sid, label: nombreDe(sid), data: series[sid], hidden: ocultos.has(sid), yAxisID: 'y',
      borderColor: colorDe[sid] || '#999', backgroundColor: colorDe[sid] || '#999',
      borderWidth: sid === 'afuera' ? 1.5 : 2, borderDash: sid === 'afuera' ? [5, 4] : [],
      pointRadius: manual ? 3 : series[sid].length <= 60 ? 2.5 : 0, pointHoverRadius: 4, tension: 0.25,
      spanGaps: manual || sid === 'afuera' ? true : huecoZigbee,
    };
  });
  const escalones = vista.termostatos ? seriesTermostato(datos.termostatos || [], rango) : {};
  for (const [sid, pts] of Object.entries(escalones)) {
    datasets.push({
      sid, termostato: true, label: t('termo.leyenda', { n: nombreDe(sid) }), data: pts, yAxisID: 'y2', hidden: ocultos.has(sid),
      borderColor: colorDe[sid] || '#999', backgroundColor: colorDe[sid] || '#999',
      borderWidth: 1.5, borderDash: [2, 3], stepped: 'before',  // en Chart.js 'before' = el nivel se mantiene hasta el próximo punto pointRadius: 0, pointHoverRadius: 3, tension: 0,
    });
  }
  const hayTermostatos = Object.keys(escalones).length > 0;
  const filas = {};
  const bandas = (vista.ventanas ? ventanas : []).map(v => ({
    sid: v.sensor, nombre: nombreDe(v.sensor), color: colorDe[v.sensor] || '#999',
    desde: new Date(v.inicio).getTime(), hasta: v.fin ? new Date(v.fin).getTime() : Date.now(), abierta: !v.fin,
    fila: filas[v.sensor] ??= Object.keys(filas).length,
  }));
  const css = getComputedStyle(document.documentElement);
  const texto = css.getPropertyValue('--cui-body-color').trim() || '#666';
  const grid = css.getPropertyValue('--cui-border-color-translucent').trim() || 'rgba(0,0,0,.1)';
  const alCambiarZoom = () => actualizarBotonReset(id);

  previo?.destroy();
  const chart = new Chart(document.getElementById(id), {
    type: 'line',
    data: { datasets },
    options: {
      animation: false, maintainAspectRatio: false, parsing: false, normalized: true,
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      scales: {
        x: {
          type: 'linear', min: rango[0], max: rango[1], grid: { color: grid },
          afterBuildTicks: eje => { eje.ticks = marcasTiempo(eje.min, eje.max); },
          ticks: { color: texto, maxRotation: 0, callback(v) { return etiquetaEje(v, this.max - this.min); } },
        },
        y: { min: yConfig.min, max: yConfig.max, grace: '5%',
             suggestedMin: ref.min - met.margenRef, suggestedMax: ref.max + met.margenRef, grid: { color: grid }, ticks: { color: texto, includeBounds: false, callback: v => `${num(v, Number.isInteger(v) ? 0 : 1)} ${met.unidad}` } },
        y2: {
          display: hayTermostatos, position: 'right', min: 0, max: 5, grid: { drawOnChartArea: false },
          title: { display: true, text: t('grafico.nivel_termo'), color: texto },
          afterBuildTicks: eje => { eje.ticks = MARCAS_NIVEL.map(value => ({ value })); },
          ticks: {
            color: texto,
            callback: v => v === HELADA ? ICONO_HELADA : String(v),
            font: c => c.tick?.value === HELADA ? { family: 'CoreUI-Icons-Free', size: 11 } : undefined,
          },
        },
      },
      plugins: {
        // Reduce los puntos solo para dibujar; al hacer zoom se vuelve a calcular con el detalle real
        decimation: { enabled: true, algorithm: 'lttb' },
        legend: {
          labels: { color: texto, boxWidth: 14, boxHeight: 2, filter: (item, data) => !data.datasets[item.datasetIndex].termostato },
          // Ocultar una habitación oculta también su termostato y sus ventanas
          onClick: (e, item, legend) => {
            const ch = legend.chart, sid = ch.data.datasets[item.datasetIndex].sid, ver = !ch.isDatasetVisible(item.datasetIndex);
            ch.data.datasets.forEach((d, i) => { if (d.sid === sid) ch.setDatasetVisibility(i, ver); });
            ch.update();
          },
        },
        tooltip: {
          callbacks: {
            title: it => it.length ? fmtFechaHora(isoLocal(new Date(it[0].parsed.x))) : '',
            label: it => it.dataset.termostato ? `${it.dataset.label}: ${fmtNivel(it.parsed.y, false)}`
                                               : `${it.dataset.label}: ${num(it.parsed.y, met.dec)} ${met.unidad}`,
          },
        },
        bandas: { bandas },
        referencias: !vista.referencia ? {} : { rango: ref, textoMin: t('ref.min', { v: `${num(ref.min, Number.isInteger(ref.min) ? 0 : 1)} ${met.unidad}` }),
                                    textoMax: t('ref.max', { v: `${num(ref.max, Number.isInteger(ref.max) ? 0 : 1)} ${met.unidad}` }) },
        zoom: {
          limits: { x: { min: rango[0], max: rango[1], minRange: 15 * 6e4 }, y: met.limites, y2: { min: 0, max: 5, minRange: 5 } },
          pan: { enabled: true, mode: vista.modo, onPanComplete: alCambiarZoom },
          zoom: { wheel: { enabled: true, speed: 0.15 }, pinch: { enabled: true }, mode: vista.modo, onZoomComplete: alCambiarZoom },
        },
      },
    },
  });
  chart.$config = { x: { min: rango[0], max: rango[1] }, y: yConfig };
  graficos[id] = chart;
  if (zoomX) chart.zoomScale('x', { min: Math.max(zoomX.min, rango[0]), max: Math.min(zoomX.max, rango[1]) }, 'none');
  if (zoomY) chart.zoomScale('y', zoomY, 'none');
  actualizarBotonReset(id);
}

// ======================================================================
//  Pestaña Temperaturas
// ======================================================================
function paramsRango(desdeSel, hastaSel) {
  const p = new URLSearchParams();
  if ($(desdeSel).value) p.set('desde', $(desdeSel).value + 'T00:00:00');
  if ($(hastaSel).value) p.set('hasta', $(hastaSel).value + 'T23:59:59');
  return p;
}

async function cargarTemperaturas() {
  tempCargadas = true;
  const sel = [...document.querySelectorAll('#t-sensores input:checked')].map(i => i.value);
  const p = paramsRango('#t-desde', '#t-hasta');
  p.set('sensores', sel.join(','));
  $('#t-descargar').href = '/api/temperaturas.csv?' + p + '&idioma=' + idioma;
  const vacio = { columnas: ['fecha_hora', 'sensor', 'temperatura', 'humedad', 'bateria'], filas: [] };
  let d, v, tm;
  try {
    [d, v, tm] = sel.length
      ? await Promise.all([api('/api/temperaturas?' + p), api('/api/ventanas?' + paramsRango('#t-desde', '#t-hasta')),
                           api('/api/termostatos?' + paramsRango('#t-desde', '#t-hasta'))])
      : [vacio, [], []];
  } catch (err) { return aviso(err.message); }
  d.termostatos = tm.filter(x => sel.includes(x.sensor));
  const ini = $('#t-desde').value ? new Date($('#t-desde').value + 'T00:00:00').getTime() : null;
  const finDia = $('#t-hasta').value ? new Date($('#t-hasta').value + 'T23:59:59').getTime() : Date.now();
  const series = seriesDe(d);
  let minX = Infinity;
  for (const s of Object.values(series)) if (s.length) minX = Math.min(minX, s[0].x);
  const finRango = Math.min(finDia, Date.now());
  const inicioRango = ini ?? (isFinite(minX) ? minX : Date.now() - DIA);
  const rango = [inicioSegunDatos(d, v, inicioRango, finRango), finRango];
  dibujar('graf-temp', d, v.filter(x => sel.includes(x.sensor)), rango);

  renderResumenTemp(d);

  idxTabla = Object.fromEntries(d.columnas.map((c, n) => [c, n]));
  filasTabla = d.filas.slice().reverse();
  $('#t-titulo').textContent = t('temp.registros', { n: entero(filasTabla.length) });
  $('#t-tabla').innerHTML = `<thead><tr><th>${t('fecha_hora')}</th><th>${t('habitacion')}</th><th class="text-end">${t('temp_corta')}</th><th class="text-end">${t('humedad')}</th><th class="text-end">${t('bateria')}</th><th></th></tr></thead><tbody></tbody>`;
  mostrarPaginaTemp();
}

function renderResumenTemp(d) {
  const metrica = vistaDe('graf-temp').metrica, met = METRICAS[metrica] || METRICAS.temperatura;
  const series = seriesDe(d, metrica);
  $('#t-resumen').innerHTML = Object.entries(series).sort((a, b) => nombreDe(a[0]).localeCompare(nombreDe(b[0]), idioma)).map(([sid, pts]) => {
    let mn = Infinity, mx = -Infinity, suma = 0;
    for (const q of pts) { mn = Math.min(mn, q.y); mx = Math.max(mx, q.y); suma += q.y; }
    return `<div class="col-6 col-md-4 col-xl"><div class="border-start border-4 px-3" style="border-color:${colorDe[sid] || '#999'} !important">
      <div class="small text-body-secondary">${esc(nombreDe(sid))}</div>
      <div class="fw-semibold">${num(suma / pts.length, met.dec)} ${met.unidad} <span class="small text-body-secondary fw-normal">${t('prom')}</span></div>
      <div class="small text-body-secondary">${t('min')} ${num(mn, met.dec)} · ${t('max')} ${num(mx, met.dec)}</div></div></div>`;
  }).join('') || `<div class="col text-body-secondary small">${t('sin_datos')}</div>`;
}

function mostrarPaginaTemp() {
  const i = idxTabla, tabla = $('#t-tabla'), cuerpo = tabla.querySelector('tbody');
  const desde = paginaDe('t-tabla', filasTabla.length) * FILAS_POR_PAGINA;
  cuerpo.innerHTML = filasTabla.length
    ? filasTabla.slice(desde, desde + FILAS_POR_PAGINA).map(f => `<tr>
    <td>${fmtFechaHora(f[i.fecha_hora])}</td><td><span class="d-inline-flex align-items-center gap-2">${punto(f[i.sensor])}${esc(nombreDe(f[i.sensor]))}</span></td>
    <td class="text-end">${num(f[i.temperatura])} °C</td><td class="text-end">${num(f[i.humedad], 0)} %</td>

function efectoVentana(i) {
  if (!i) return `<span class="text-body-secondary">${t('vent.sin_datos')}</span>`;
  const clase = i.caida >= 2 ? 'text-danger' : i.caida >= 0.5 ? 'text-warning' : 'text-body-secondary';
  const aprox = i.aproximado ? `<span title="${esc(t('vent.aprox_ayuda'))}">≈</span>` : '';
  return `${aprox}${num(i.temp_antes)} → ${num(i.temp_min)} °C <span class="fw-semibold ${clase}">(${i.caida > 0 ? '−' : '+'}${num(Math.abs(i.caida))})</span>
    <span class="small text-body-secondary">· ${minutosTexto(i.minutos_a_min)}</span>`;
}

async function cargarVentanas() {
  const p = paramsRango('#v-desde', '#v-hasta');
  if ($('#v-sensor').value) p.set('sensor', $('#v-sensor').value);
  $('#v-descargar').href = '/api/ventanas.csv?' + p + '&idioma=' + idioma;
  try { listaVentanas = await api('/api/ventanas?' + p); } catch (err) { return aviso(err.message); }

  const totales = {};
  for (const v of listaVentanas) {
    const x = (totales[v.sensor] ??= { n: 0, min: 0 });
    x.n++; x.min += ((v.fin ? new Date(v.fin) : new Date()) - new Date(v.inicio)) / 6e4;
  }
  const totalMin = Object.values(totales).reduce((s, x) => s + x.min, 0);
  const widget = (titulo, valor, sub, color) => `<div class="col-6 col-lg-3"><div class="card h-100" style="border-top:3px solid ${color}">
    <div class="card-body py-3"><div class="small text-body-secondary text-truncate">${titulo}</div>
    <div class="fs-5 fw-semibold">${valor}</div><div class="small text-body-secondary">${sub}</div></div></div></div>`;
  const caidas = listaVentanas.filter(v => v.impacto).map(v => v.impacto.caida);
  const caidaMedia = caidas.length ? caidas.reduce((a, b) => a + b, 0) / caidas.length : null;
  const caidasHum = listaVentanas.map(v => v.impacto?.hum_caida).filter(x => x != null);
  const caidaHumMedia = caidasHum.length ? caidasHum.reduce((a, b) => a + b, 0) / caidasHum.length : null;
  $('#v-resumen').innerHTML = widget(t('total'), t('n_aperturas', { n: listaVentanas.length }), t('abiertas_total', { d: minutosTexto(totalMin) }), 'var(--cui-primary)') +
    widget(t('vent.caida_media'), caidaMedia == null ? '–' : `−${num(caidaMedia)} °C`, t('vent.caida_media_sub'), 'var(--cui-info)') +
    widget(t('vent.caida_hum_media'), caidaHumMedia == null ? '–' : `−${num(caidaHumMedia)} ${t('met.puntos')}`, t('vent.caida_hum_sub', { n: caidasHum.length }), 'var(--cui-info)') +
    Object.entries(totales).map(([sid, x]) => widget(esc(nombreDe(sid)), t('n_aperturas', { n: x.n }), minutosTexto(x.min), colorDe[sid] || '#999')).join('');

  $('#v-tabla').innerHTML = `<thead><tr><th>${t('habitacion')}</th><th>${t('apertura')}</th><th>${t('cierre')}</th><th class="text-end">${t('duracion')}</th><th class="col-efecto" title="${esc(t('vent.efecto_ayuda'))}">${t('vent.efecto')} <i class="cil-info ms-1 text-body-secondary" role="img" tabindex="0" title="${esc(t('vent.precision'))}" aria-label="${esc(t('vent.precision'))}"></i></th><th>${t('nota')}</th><th class="text-end col-acciones">${t('acciones')}</th></tr></thead><tbody>` +
    (listaVentanas.length ? listaVentanas.map(v => `<tr>
      <td><span class="d-inline-flex align-items-center gap-2">${punto(v.sensor)}${esc(nombreDe(v.sensor))}</span></td>
      <td>${fmtFechaHora(v.inicio)}</td>
      <td>${v.fin ? fmtFechaHora(v.fin) : `<span class="badge text-bg-warning">${t('abierta_min')}</span>`}</td>
      <td class="text-end">${duracion(v.inicio, v.fin)}</td>
      <td class="tabular col-efecto">${efectoVentana(v.impacto)}</td>
      <td class="nota"><span class="nota-corta" title="${esc(v.nota)}">${esc(v.nota)}</span></td>
      <td class="text-end col-acciones">
        ${v.fin ? '' : `<button class="btn btn-sm btn-warning" data-cerrar="${esc(v.id)}">${t('cerrar_btn')}</button>`}
        <button class="btn btn-sm btn-ghost-secondary" data-editar="${esc(v.id)}" title="${esc(t('editar'))}" aria-label="${esc(t('editar'))}"><i class="cil-pencil"></i></button>
        <button class="btn btn-sm btn-ghost-danger" data-borrar="${esc(v.id)}" title="${esc(t('borrar'))}" aria-label="${esc(t('borrar'))}"><i class="cil-trash"></i></button>
      </td></tr>`).join('')
    : `<tr><td colspan="7" class="text-center text-body-secondary py-4">${t('sin_registros')}</td></tr>`) + '</tbody>';
  paginarTabla('#v-tabla');
}

// ======================================================================
//  Calefacción: medidores, lecturas y consumo
// ======================================================================
let medidores = [], lecturasMed = [];          // calefacción
let medidoresAgua = [], lecturasAgua = [];      // agua caliente
let todosMed = [], todasLecturas = [];
const colorMed = {};
const COLORES_MED = ['#e55353', '#f9b115', '#2eb85c', '#39f', '#5856d6', '#9c27b0', '#e83e8c', '#20c997'];
const esAgua = m => m?.tipo === 'agua_caliente';
const unidadDe = m => m?.unidad || (esAgua(m) ? 'm³' : t('med.unidades'));
// Consumo de agua: si la unidad es m³ se muestra en litros
const enLitros = m => esAgua(m) && /^m(³|3)$/i.test(unidadDe(m));
const fmtConsumo = (v, m, dec = 2) => enLitros(m) ? `${fmtValor(v * 1000, 0)} L` : `${fmtValor(v, dec)} ${unidadDe(m)}`;
const fmtValor = (v, dec = 3) => (v == null || isNaN(v)) ? '–' : Number(v).toLocaleString(idioma, { maximumFractionDigits: dec });
const medPorId = id => todosMed.find(m => m.id === id);
const puntoMed = id => `<span class="punto" style="background:${colorMed[id] || '#999'}"></span>`;
const modalLectMed = coreui.Modal.getOrCreateInstance($('#dlg-lectmed'));
let periodos = [], cierres = [];
const hayPeriodos = () => periodos.length > 0;

async function cargarMedidores() {
  let pe;
  let climaDiario;
  [todosMed, todasLecturas, pe, climaDiario] = await Promise.all([api('/api/medidores'), api('/api/lecturas_medidor'), api('/api/periodos'),
    api('/api/clima_diario').catch(() => [])]);
  prepararGradosDia(climaDiario);
  periodos = pe.periodos;
  cierres = pe.cierres;
  medidores = todosMed.filter(m => !esAgua(m));
  medidoresAgua = todosMed.filter(esAgua);
  const idsCal = new Set(medidores.map(m => m.id));
  lecturasMed = todasLecturas.filter(l => idsCal.has(l.medidor));
  lecturasAgua = todasLecturas.filter(l => !idsCal.has(l.medidor));
  medidores.forEach((m, i) => colorMed[m.id] = (m.sensor && colorDe[m.sensor]) || COLORES_MED[i % COLORES_MED.length]);
  medidoresAgua.forEach((m, i) => colorMed[m.id] = ['#39f', '#e55353', '#2eb85c', '#9c27b0'][i % 4]);
}
// Vuelve a cargar y redibuja la sección de medidores que se está viendo
function refrescarMedidores() {
  return tabActual() === 'agua' ? mostrarAgua() : mostrarLecturas();
}
async function mostrarLecturas() {
  try { await cargarMedidores(); } catch (err) { return aviso(err.message); }
  renderLecturas();
}
async function mostrarConsumo() {
  try { await cargarMedidores(); } catch (err) { return aviso(err.message); }
  renderConsumo();
}

// ---------- Consumo ----------
// Acumulado de un medidor en cualquier instante, interpolando linealmente entre lecturas
// (así el consumo entre dos lecturas se reparte de forma pareja en esos días).
function serieAcum(id) {
  const serie = todasLecturas.filter(l => l.medidor === id).map(l => ({ x: new Date(l.fecha_hora).getTime(), a: l.acumulado }));
  serie.segunFrio = !esAgua(medPorId(id));
  return serie;
}

// Grados-día acumulados: un día suma lo que le falta para llegar a la temperatura base (un día cálido suma 0).
// Entre dos lecturas, el consumo de calefacción se reparte en proporción a ellos. El agua caliente no depende del frío.
const BASE_GRADOS_DIA = 15, DIAS_TOLERANCIA_CLIMA = 7;
let gradosDia = null;
function prepararGradosDia(filas) {
  gradosDia = null;
  if (!filas.length) return;
  const porFecha = new Map(filas), valores = filas.map(([, temp]) => Math.max(0, BASE_GRADOS_DIA - temp));
  const media = valores.reduce((a, b) => a + b, 0) / valores.length;
  const ini = new Date(filas[0][0] + 'T00:00:00'), fin = new Date(filas[filas.length - 1][0] + 'T00:00:00');
  const acum = [0];
  for (const c = new Date(ini); c <= fin; c.setDate(c.getDate() + 1)) {
    const temp = porFecha.get(fechaInput(c));
    acum.push(acum[acum.length - 1] + (temp == null ? media : Math.max(0, BASE_GRADOS_DIA - temp)));
  }
  gradosDia = { ini: ini.getTime(), fin: fin.getTime() + DIA, acum };
}
function gradosHasta(x) {
  const pos = Math.min(Math.max((x - gradosDia.ini) / DIA, 0), gradosDia.acum.length - 1), i = Math.floor(pos);
  const sig = gradosDia.acum[Math.min(i + 1, gradosDia.acum.length - 1)];
  return gradosDia.acum[i] + (sig - gradosDia.acum[i]) * (pos - i);
}
function repartePorFrio(serie, desde, hasta) {
  return !!(serie.segunFrio && gradosDia && desde >= gradosDia.ini && hasta <= gradosDia.fin + DIAS_TOLERANCIA_CLIMA * DIA);
}
function acumEn(serie, x) {
  if (!serie.length || x <= serie[0].x) return 0;
  const ult = serie[serie.length - 1];
  if (x >= ult.x) return ult.a;
  let i = 0;
  while (serie[i + 1].x <= x) i++;
  const p = serie[i], q = serie[i + 1];
  if (repartePorFrio(serie, p.x, q.x)) {
    const gp = gradosHasta(p.x), gq = gradosHasta(q.x);
    if (gq > gp) return p.a + (q.a - p.a) * (gradosHasta(x) - gp) / (gq - gp);
  }
  return p.a + (q.a - p.a) * (x - p.x) / (q.x - p.x);
}

// Período de comparación: las mismas fechas un año antes. La calefacción depende de la estación, y un período en curso
// se compara solo contra el mismo tramo del anterior.
const unAnioAntes = x => { const f = new Date(x); f.setFullYear(f.getFullYear() - 1); return f.getTime(); };
// Con lecturas muy separadas, el valor en una fecha intermedia no se midió: es una estimación
const DIAS_LECTURA_CERCANA = 45;
function fechaEstimada(s, x) {
  const i = s.findIndex(p => p.x >= x);
  return i > 0 && s[i].x !== x && s[i].x - s[i - 1].x > DIAS_LECTURA_CERCANA * DIA;
}
// Consumo de un medidor en el período anterior. 'parcial': faltan datos (empezó después, o es de antes de la mudanza).
// 'porFrio': no hay lecturas cerca del corte y el tramo se estimó según el frío de cada día.
// 'estimado': tampoco hay datos del clima, así que no se puede saber el mismo tramo y se da 'completo' como referencia.
function consumoAnterior(s, d, h, hPeriodo) {
  if (s.length < 2) return null;
  const fin = Math.min(h, s[s.length - 1].x);
  if (fin <= d) return null;
  const ini = unAnioAntes(d), finAnt = unAnioAntes(fin);
  if (finAnt <= s[0].x) return null;
  const mudanza = estado.fecha_mudanza ? new Date(estado.fecha_mudanza + 'T00:00:00').getTime() : 0;
  const lejos = fechaEstimada(s, ini) || fechaEstimada(s, finAnt), porFrio = lejos && repartePorFrio(s, ini, finAnt);
  // "Total": el período de liquidación completo, aunque el filtro abarque solo una parte
  const per = periodos.map(limitesPer).find(([a, b]) => a <= ini && ini <= b);
  const [iniTotal, finTotal] = per || [ini, unAnioAntes(hPeriodo)];
  return { valor: acumEn(s, finAnt) - acumEn(s, ini), hasta: finAnt, parcial: s[0].x > ini || mudanza > ini,
           porFrio, estimado: lejos && !porFrio,
           completo: acumEn(s, finTotal) - acumEn(s, iniTotal) };
}
const iconoAyuda = texto => `<i class="cil-info ms-1 text-body-secondary" role="img" tabindex="0" title="${esc(texto)}" aria-label="${esc(texto)}"></i>`;
const filaConsumo = (etiqueta, valor) => `<div class="d-flex flex-wrap justify-content-between column-gap-2"><span class="text-nowrap">${esc(etiqueta)}</span><span class="tabular ms-auto text-end">${valor}</span></div>`;
const ayudaProyeccion = f => f ? t('per.proy_frio', { c: fmtValor(f.consumido, 0), r: fmtValor(f.ritmo, 3), g: fmtValor(f.gradosResto, 0), p: fmtValor(f.total, 0) }) : t('per.proy_calculo');
const htmlProyeccion = (valor, ayuda) => `<div class="small text-body-secondary mt-1">${filaConsumo(t('cons.proyeccion'), `≈ ${fmtValor(valor, 0)}${iconoAyuda(ayuda)}`)}</div>`;
function htmlComparacion(actual, ant) {
  const fila = filaConsumo;
  const bloque = filas => `<div class="small text-body-secondary mt-2 pt-2 border-top"><div class="fw-semibold">${esc(t('cons.periodo_ant'))}</div>${filas}</div>`;
  if (!ant) return bloque(fila(t('cons.total_todos'), '–'));
  const total = sufijo => fila(t('cons.total_todos'), `${ant.parcial ? '≈ ' : ''}${fmtValor(ant.completo, 0)}${sufijo}`);
  if (ant.estimado) return bloque(total(iconoAyuda(t('cons.estimado_ayuda'))));
  const dif = ant.valor > 0 && !ant.parcial ? (actual - ant.valor) / ant.valor * 100 : null;
  const clase = dif == null || Math.abs(dif) < 1 ? 'text-body-secondary' : dif > 0 ? 'text-danger' : 'text-success';
  const aprox = ant.parcial || ant.porFrio ? '≈ ' : '';
  const pct = dif == null ? '' : ` <span class="fw-semibold text-nowrap ${clase}">${dif > 0 ? '+' : dif < 0 ? '−' : ''}${num(Math.abs(dif), 0)} %</span>`;
  const ayuda = ant.parcial ? 'cons.parcial' : ant.porFrio ? 'cons.frio_ayuda' : '';
  const extra = pct + (ayuda ? iconoAyuda(t(ayuda)) : '');
  // En un período cerrado "a la fecha" y "total" son el mismo valor: una sola fila
  if (Math.abs(ant.completo - ant.valor) < 0.5) return bloque(total(extra));
  return bloque(fila(t('cons.a_la_fecha'), `<span class="text-nowrap">${aprox}${fmtValor(ant.valor, 0)}</span>${extra}`) + total(''));
}

const limitesPer = p => [new Date(p.inicio + 'T00:00:00').getTime(), new Date(p.fin + 'T23:59:59').getTime()];
// Período en el que fue la mudanza: solo cuenta desde ese día
const badgePerMudanza = p => estado.fecha_mudanza && p.inicio < estado.fecha_mudanza && estado.fecha_mudanza <= p.fin
  ? ` <span class="badge text-bg-light border" title="${esc(t('mud.antes_ayuda'))}">${t('mud.desde')}</span>` : '';

function renderConsumo() {
  const perPrev = $('#cs-periodo').value;
  $('#cs-periodo').innerHTML = `<option value="">${t('per.personalizado')}</option>` +
    periodos.slice().reverse().map(p => `<option value="${esc(p.id)}">${esc(p.nombre)}</option>`).join('');
  $('#cs-periodo').value = periodos.some(p => p.id === perPrev) ? perPrev : '';
  const selPrev = $('#cs-medidor').value;
  $('#cs-medidor').innerHTML = `<option value="">${t('med.todos')}</option>` + medidores.map(m => `<option value="${esc(m.id)}">${esc(m.nombre)}</option>`).join('');
  $('#cs-medidor').value = medPorId(selPrev) ? selPrev : '';
  const sel = $('#cs-medidor').value;
  const csv = paramsRango('#cs-desde', '#cs-hasta');
  if (sel) csv.set('medidor', sel);
  $('#cs-descargar').href = '/api/consumo.csv?' + csv + '&idioma=' + idioma;

  const d = $('#cs-desde').value ? new Date($('#cs-desde').value + 'T00:00:00').getTime() : Date.now() - 365 * DIA;
  const h = Math.min($('#cs-hasta').value ? new Date($('#cs-hasta').value + 'T23:59:59').getTime() : Date.now(), Date.now());
  const lista = medidores.filter(m => !sel || m.id === sel);
  const hPeriodo = $('#cs-hasta').value ? new Date($('#cs-hasta').value + 'T23:59:59').getTime() : h;
  // La proyección al cierre solo tiene sentido si el filtro arranca al inicio del período en curso
  const perEnCurso = periodos.map(limitesPer).find(([a, b]) => a === d && b >= Date.now());
  const datos = lista.map(m => {
    const s = serieAcum(m.id);
    const consumo = acumEn(s, h) - acumEn(s, d);
    const ini = s.length ? Math.max(d, s[0].x) : 0, fin = s.length ? Math.min(h, s[s.length - 1].x) : 0;
    const dias = s.length > 1 && fin > ini ? (fin - ini) / DIA : 0;
    return { m, s, consumo, dias, porDia: dias ? consumo / dias : null, anterior: consumoAnterior(s, d, h, hPeriodo),
             proyeccion: perEnCurso ? calcularProyeccion(s, perEnCurso[0], perEnCurso[1], acumEn(s, perEnCurso[1]) - acumEn(s, perEnCurso[0]), Date.now()) : null };
  });

  // Resumen
  const widget = (titulo, valor, unidad, sub1, sub2, color, comparacion, proyeccion = '') => `<div class="col-6 col-lg-3"><div class="card h-100" style="border-top:3px solid ${color}">
    <div class="card-body py-3"><div class="small text-body-secondary text-truncate">${titulo}</div>
    <div class="fs-4 fw-semibold tabular">${valor} <span class="fs-6 fw-normal text-body-secondary">${esc(unidad)}</span></div>
    ${sub1 ? `<div class="small text-body-secondary">${sub1}</div>` : ''}${sub2 ? `<div class="small text-body-secondary">${sub2}</div>` : ''}${proyeccion}${comparacion}</div></div></div>`;
  let html = '';
  const unidades = new Set(lista.map(unidadDe));
  if (datos.length > 1 && unidades.size === 1) {
    const total = datos.reduce((s, x) => s + x.consumo, 0);
    const conAnterior = datos.filter(x => x.anterior);
    const anteriorTotal = conAnterior.length ? { valor: conAnterior.reduce((s, x) => s + x.anterior.valor, 0),
      completo: conAnterior.reduce((s, x) => s + x.anterior.completo, 0), estimado: conAnterior.some(x => x.anterior.estimado),
      porFrio: conAnterior.some(x => x.anterior.porFrio),
      parcial: conAnterior.length < datos.length || conAnterior.some(x => x.anterior.parcial) } : null;
    html += widget(t('cons.total_todos'), fmtValor(total, 2), [...unidades][0], '', '', 'var(--cui-primary)',
      htmlComparacion(total, anteriorTotal),
      datos.every(x => x.proyeccion?.proy != null) ? htmlProyeccion(datos.reduce((s, x) => s + x.proyeccion.proy, 0), t('cons.proy_total_ayuda')) : '');
  }
  html += datos.map(x => widget(esc(x.m.nombre), fmtValor(x.consumo, 2), unidadDe(x.m),
    x.porDia == null ? '' : t('cons.por_dia', { v: fmtValor(x.porDia, 2) }),
    '', colorMed[x.m.id], htmlComparacion(x.consumo, x.anterior),
    x.proyeccion?.proy != null ? htmlProyeccion(x.proyeccion.proy, ayudaProyeccion(x.proyeccion.frio)) : '')).join('');
  $('#cs-resumen').innerHTML = medidores.length ? html : `<div class="col-12"><div class="card"><div class="card-body text-body-secondary">${t('cons.sin_medidores')}</div></div></div>`;

  const css = getComputedStyle(document.documentElement);
  const texto = css.getPropertyValue('--cui-body-color').trim() || '#666';
  const grid = css.getPropertyValue('--cui-border-color-translucent').trim() || 'rgba(0,0,0,.1)';

  // Gráfico: consumo acumulado dentro del período (arranca en 0 al inicio del período)
  const lineas = datos.filter(x => x.s.length > 1).map(x => {
    const base = acumEn(x.s, d);
    const ini = Math.max(d, x.s[0].x), fin = Math.min(h, x.s[x.s.length - 1].x);
    if (fin <= ini) return null;
    const pts = [{ x: ini, y: acumEn(x.s, ini) - base },
      ...x.s.filter(p => p.x > ini && p.x < fin).map(p => ({ x: p.x, y: p.a - base })),
      { x: fin, y: acumEn(x.s, fin) - base }];
    return { label: `${x.m.nombre} (${unidadDe(x.m)})`, data: pts, borderColor: colorMed[x.m.id], backgroundColor: colorMed[x.m.id],
             borderWidth: 2, pointRadius: 3, tension: 0 };
  }).filter(Boolean);
  graficos['graf-acum']?.destroy();
  graficos['graf-acum'] = new Chart($('#graf-acum'), {
    type: 'line', data: { datasets: lineas },
    options: {
      animation: false, maintainAspectRatio: false, parsing: false,
      interaction: { mode: 'nearest', intersect: false },
      scales: {
        x: { type: 'linear', min: d, max: h, grid: { color: grid },
             afterBuildTicks: eje => { eje.ticks = marcasTiempo(eje.min, eje.max); },

      ...datos.filter(x => x.anterior).map(x => {

      },
      plugins: {

          labels: { color: texto, boxWidth: 12,
            // Una sola entrada para todas las columnas del período anterior
            generateLabels(chart) {
              const items = Chart.defaults.plugins.legend.labels.generateLabels(chart);
              const anteriores = items.filter(i => chart.data.datasets[i.datasetIndex].anterior);

  // Tabla de períodos entre lecturas que tocan el rango
  const ids = new Set(lista.map(m => m.id));
  const tramos = lecturasMed.filter(l => ids.has(l.medidor) && l.consumo != null && l.tipo !== 'inicio_periodo' && !l.antes_mudanza &&
    new Date(l.fecha_hora).getTime() >= d && new Date(l.desde).getTime() <= h).sort((a, b) => b.fecha_hora.localeCompare(a.fecha_hora));
  $('#cs-tabla').innerHTML = `<thead><tr><th>${t('med.medidor')}</th><th>${t('desde')}</th><th>${t('hasta')}</th><th class="text-end">${t('med.dias')}</th>
    <th class="text-end">${t('med.consumo')}</th><th class="text-end">${t('cons.prom_dia')}</th><th class="text-end">${t('med.acumulado')}</th></tr></thead><tbody>` +
    (tramos.length ? tramos.map(l => { const m = medPorId(l.medidor); return `<tr>
      <td><span class="d-inline-flex align-items-center gap-2">${puntoMed(l.medidor)}${esc(m?.nombre)}${l.virtual ? ` <em class="small text-body-secondary">(${esc(etiquetaVirtual(l))})</em>` : ''}</span></td>
      <td>${fmtFechaHora(l.desde)}</td><td>${fmtFechaHora(l.fecha_hora)}</td>
      <td class="text-end">${num(l.dias, 1)}</td>
      <td class="text-end">${fmtValor(l.consumo, 2)} <span class="small text-body-secondary">${esc(unidadDe(m))}</span>${badgeReinicio(l)}</td>
      <td class="text-end">${l.dias ? fmtValor(l.consumo / l.dias, 2) : '–'}</td>
      <td class="text-end">${fmtValor(l.acumulado, 2)}</td></tr>`; }).join('')
    : `<tr><td colspan="7" class="text-center text-body-secondary py-4">${t('sin_registros')}</td></tr>`) + '</tbody>';
  paginarTabla('#cs-tabla');
}
